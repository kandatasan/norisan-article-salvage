name: Apply outing spacing v6 20260903
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-outing-spacing-v6-20260903.yml'
      - 'category-hubs/outing-v6/**'
permissions:
  contents: read
jobs:
  deploy-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('category-hubs/outing-v6/patch_spacing.py').read_text(encoding='utf-8')
          req=["EXPECTED_SHA='bc9bef266ff65ddefb39b8fe4b81766345d905e9e7d98a3a97dbd7e8d29591e0'","tq-outing-spacing:v6:compact-vertical","margin-top:0!important","padding-top:24px!important"]
          m=[x for x in req if x not in s]
          if m: raise SystemExit('OUTING_V6_SOURCE_MISSING='+repr(m))
          print('OUTING_V6_SOURCE_OK')
          PY
      - name: Backup published outing
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          TQ_OUTING_BACKUP_PATH: /tmp/outing-v6-backup.json
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4; do
            if python category-hubs/outing-v3/live_backup.py backup; then ok=1; break; fi
            sleep $((attempt*4))
          done
          test "$ok" -eq 1
      - name: Apply compact vertical spacing
        id: deploy
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          TQ_OUTING_V6_RESULT_PATH: /tmp/outing-v6-result.json
        run: |
          set -euo pipefail
          python category-hubs/outing-v6/patch_spacing.py | tee /tmp/outing-v6-deploy.log
      - name: Install render audit dependencies
        if: steps.deploy.outcome == 'success'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet selenium
      - name: Verify desktop and mobile spacing
        id: verify
        if: steps.deploy.outcome == 'success'
        run: |
          set -euo pipefail
          python category-hubs/outing-v6/verify_spacing.py | tee /tmp/outing-v6-render.log
      - name: Roll back if render audit fails
        if: failure() && steps.deploy.outcome == 'success' && steps.verify.outcome == 'failure'
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          TQ_OUTING_BACKUP_PATH: /tmp/outing-v6-backup.json
        run: |
          set -euo pipefail
          python category-hubs/outing-v3/live_backup.py rollback
          echo 'Outing v6 spacing audit failed; page restored.' >&2
          exit 1
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outing-v6-spacing-audit
          path: |
            /tmp/outing-v6-result.json
            /tmp/outing-v6-deploy.log
            /tmp/outing-v6-render.log
            outing-v6-render.json
            outing-v6-desktop.png
            outing-v6-mobile.png
          if-no-files-found: warn
