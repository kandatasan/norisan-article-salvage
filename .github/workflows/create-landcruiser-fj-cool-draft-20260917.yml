name: Create Land Cruiser FJ cool draft 20260917

on:
  push:
    branches: [main]
    paths:
      - 'packages/landcruiser-fj-cool/content.html'
      - 'scripts/create_landcruiser_fj_cool_draft_20260917.py'
      - '.github/workflows/create-landcruiser-fj-cool-draft-20260917.yml'

permissions:
  contents: read
  issues: write

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create guarded WordPress draft
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/create_landcruiser_fj_cool_draft_20260917.py
          python scripts/create_landcruiser_fj_cool_draft_20260917.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fj-cool-draft-${{ github.run_id }}
          path: reports/landcruiser-fj-cool-create-20260917/
          if-no-files-found: warn
      - name: Record result on audit issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file reports/landcruiser-fj-cool-create-20260917/summary.md
