name: Apply gulpalivepowder grounding when PR is ready
on:
  pull_request:
    types: [ready_for_review]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/gulpalivepowder-grounding-labeled-20260822'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
      TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply exact guarded cleanup
        run: PYTHONPATH=scripts python scripts/patch_gulpalivepowder_source_grounding_once.py
      - name: Commit grounded editorial source to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editorial/gulpalivepowder/content.html
          if git diff --cached --quiet; then
            echo 'Editorial source already matches grounded WordPress body.'
          else
            git commit -m 'Ground gulpalivepowder firsthand wording'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Record result on salvage audit issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          { echo '### gulpalivepowder ready-PR grounding: SUCCESS'; echo; cat reports/gulpalivepowder-source-grounding/summary.md; } > /tmp/comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gulpalivepowder-ready-pr-grounding
          path: reports/gulpalivepowder-source-grounding/
          if-no-files-found: warn
