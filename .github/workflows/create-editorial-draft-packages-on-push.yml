name: Create editorial draft packages on push

on:
  push:
    branches: [main]
    paths:
      - 'editorial/**/create.json'
      - 'editorial/**/content.html'
  workflow_dispatch:
    inputs:
      create_path:
        description: 'Editorial create path, e.g. editorial/tanto-long-review/create.json'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  create-editorial-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run draft rail safety tests
        run: |
          python -m unittest tests/test_create_editorial_draft_once.py -v
          python -m unittest tests/test_apply_editorial_draft_once.py -v

      - name: Resolve create packages
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/creates.txt

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            create='${{ inputs.create_path }}'
            test -f "$create"
            if [[ "$(basename "$create")" != "create.json" ]]; then
              echo "workflow_dispatch requires an editorial create.json path" >&2
              exit 1
            fi
            package_dir="$(dirname "$create")"
            if [[ -f "$package_dir/config.json" ]]; then
              echo "Package already has config.json; use the guarded update rail instead." >&2
              exit 1
            fi
            printf '%s\n' "$create" > /tmp/creates.txt
          else
            git diff --name-only HEAD^ HEAD -- 'editorial/*/create.json' 'editorial/*/content.html' \
              | awk -F/ 'NF>=3 {print $1 "/" $2 "/create.json"}' \
              | sort -u > /tmp/create-candidates.txt

            while IFS= read -r create; do
              [[ -z "$create" ]] && continue
              package_dir="$(dirname "$create")"
              if [[ -f "$package_dir/config.json" ]]; then
                echo "Skipping promoted package (config.json exists): $package_dir"
              elif [[ -f "$create" ]]; then
                printf '%s\n' "$create" >> /tmp/creates.txt
              else
                echo "Skipping editorial package without create.json: $package_dir"
              fi
            done < /tmp/create-candidates.txt
          fi

          if [[ -s /tmp/creates.txt ]]; then
            cat /tmp/creates.txt
          else
            echo 'No new editorial draft packages to create.'
          fi

      - name: Create only guarded WordPress drafts
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r create; do
            [[ -z "$create" ]] && continue
            python scripts/create_editorial_draft_once.py --create "$create"
          done < /tmp/creates.txt

      - name: Record results on salvage audit issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Editorial draft creation: SUCCESS'
            echo
            if find reports -path '*-draft-create/summary.md' -print -quit | grep -q .; then
              find reports -path '*-draft-create/summary.md' -print -exec cat {} \;
            else
              echo 'No new editorial draft package was applicable for this push.'
            fi
          } > /tmp/editorial-create-comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/editorial-create-comment.md

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-draft-create
          path: reports/
          if-no-files-found: warn
