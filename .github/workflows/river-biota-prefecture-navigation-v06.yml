name: Audit prefecture-to-watershed biology navigation v06 (research only)
on:
  push:
    branches:
      - research/river-biota-prefecture-drilldown-20261020
    paths:
      - river-fish/research-individual-v06/*.py
      - .github/workflows/river-biota-prefecture-navigation-v06.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pref-navigation-v06-research
  cancel-in-progress: true
jobs:
  build_offline:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test documentary source extraction
        run: |
          python -m py_compile river-fish/research-individual-v06/*.py
          python -m unittest discover -s river-fish/research-individual-v06 -p 'test_*.py' -v
      - name: Restore name-first survey dataset with SHA verification
        run: |
          python river-fish/research-individual-v05/snapshot_parts_v05.py verify \
            --parts-dir river-fish/research-individual-v05/outputs \
            --db /tmp/river_individual_research_v05.sqlite
      - name: Build documented prefecture/watershed navigation overlay
        run: |
          python river-fish/research-individual-v06/build_prefecture_navigation_v06.py \
            --biota-db /tmp/river_individual_research_v05.sqlite \
            --out river-fish/research-individual-v06/outputs
      - name: Verify conservation and no false geography
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json
          folder=Path('river-fish/research-individual-v06/outputs')
          s=json.loads((folder/'prefecture_navigation_audit_v06.json').read_text())
          d=json.loads((folder/'river_atlas_navigation_v06.json').read_text())
          assert s['prefectures_offered']==47
          assert s['original_named_rivers_unchanged']==428
          assert s['original_name_first_biota_contexts_unchanged']==553351
          assert s['navigation_is_documentary_not_geographic']
          assert s['river_prefecture_not_inferred_from_watershed']
          assert s['prefecture_does_not_imply_all_tributaries_inside']
          assert s['linked_prefecture_watershed_pairs']>0
          assert s['prefectures_with_verified_documentary_navigation']>0
          assert s['production_modified'] is False
          assert len(d['rivers'])==428 and len(d['prefectures'])==47
          assert all(len(r['biota'])==4 for r in d['rivers'])
          for link in d['prefecture_watershed_entries']:
              assert link['official_evidence_urls']
              assert link['no_claim_all_watershed_rivers_within_prefecture']
          assert not any(link['prefecture']=='群馬県' for link in d['prefecture_watershed_entries'])
          assert all(not ('prefecture' in r) for r in d['rivers'])
          print('VERIFIED_RESEARCH_NAVIGATION',json.dumps({
              k:v for k,v in s.items() if isinstance(v,(int,bool))},ensure_ascii=False))
          PY
      - name: Generate no-iframe mobile click-through research prototype
        run: |
          python river-fish/research-individual-v06/render_offline_navigation_v06.py \
            --source river-fish/research-individual-v06/outputs/river_atlas_navigation_v06.json \
            --out river-fish/research-individual-v06/outputs/river_atlas_prefecture_preview_v06.html
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('river-fish/research-individual-v06/outputs')
          data=json.loads((p/'river_atlas_navigation_v06.json').read_text())
          html=(p/'river_atlas_prefecture_preview_v06.html').read_text()
          assert '<iframe' not in html and 'fetch(' not in html
          assert '都道府県' in html and '生物調査' in html
          assert not any(x['prefecture']=='佐賀県' and x['watershed']=='那珂川' for x in data['prefecture_watershed_entries'])
          assert not any(x['prefecture']=='和歌山県' and x['watershed']=='太田川' for x in data['prefecture_watershed_entries'])
          assert not any(x['prefecture']=='大阪府' and x['watershed']=='芦田川' for x in data['prefecture_watershed_entries'])
          hi=[x for x in data['prefecture_watershed_entries'] if x['prefecture']=='広島県' and x['watershed']=='太田川']
          assert len(hi)==1 and hi[0]['identity_basis']=='two_or_more_exact_prefecture_documented_approved_rivers'
          links={x['river_name'] for x in data['prefecture_river_links'] if x['prefecture']=='広島県' and x['watershed']=='太田川'}
          assert '三篠川' in links and '根谷川' in links
          print('HIROSHIMA_OTA',sorted(links))
          assert len(html.encode())<2_000_000
          PY
      - name: Syntax-check embedded browser JavaScript without executing network access
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          src=Path('river-fish/research-individual-v06/outputs/river_atlas_prefecture_preview_v06.html').read_text()
          found=re.findall(r'<script>([\s\S]+?)</script>',src)
          assert len(found)==1
          Path('/tmp/atlas-pref-v06-ui.js').write_text(found[0])
          PY
          node --check /tmp/atlas-pref-v06-ui.js
      - name: Upload source-validated research files
        uses: actions/upload-artifact@v4
        with:
          name: prefecture-watershed-river-biota-research-v06
          path: river-fish/research-individual-v06/outputs/
          if-no-files-found: error
      - name: Commit overlay reports to research branch only
        run: |
          test "$GITHUB_REF_NAME" = "research/river-biota-prefecture-drilldown-20261020"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add river-fish/research-individual-v06/outputs
          if ! git diff --cached --quiet; then
            git commit -m "research: archive documented prefecture-watershed navigation and river biology coverage"
            git push origin HEAD:refs/heads/research/river-biota-prefecture-drilldown-20261020
          fi
