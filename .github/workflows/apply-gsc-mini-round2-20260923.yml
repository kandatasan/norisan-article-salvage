name: Apply GSC mini rewrite round 2 20260923

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_gsc_mini_round2_20260923.py
      - .github/workflows/apply-gsc-mini-round2-20260923.yml

permissions:
  contents: read
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile scripts/apply_gsc_mini_round2_20260923.py
      - name: Apply guarded mini rewrites
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/apply_gsc_mini_round2_20260923.py | tee /tmp/summary.md
      - name: Record audit result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### GSC mini rewrite round 2 2026-09-23'
            echo
            cat /tmp/summary.md 2>/dev/null || echo '- result: **BLOCKED_OR_FAILED_BEFORE_SUMMARY**'
          } > /tmp/comment.md
          gh issue comment 22 --repo "${{ github.repository }}" --body-file /tmp/comment.md
