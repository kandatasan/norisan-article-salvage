name: Audit current car hub page 3294
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-car-page-3294-20260902.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Read full current page 3294
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,urllib.request
          BASE='https://tsurikue.com/wp-json/wp/v2'
          tok=base64.b64encode(f"{os.environ['TSURIKUE_WP_USER']}:{os.environ['TSURIKUE_WP_APP_PASSWORD']}".encode()).decode()
          H={'Authorization':'Basic '+tok,'Accept':'application/json','User-Agent':'tsurikue-car-current-audit/1.0'}
          req=urllib.request.Request(BASE+'/pages/3294?context=edit&_fields=id,slug,status,title,content,link',headers=H)
          with urllib.request.urlopen(req,timeout=40) as r:
              item=json.loads(r.read().decode())
          raw=((item.get('content') or {}).get('raw') or '')
          result={
              'id':item['id'],
              'slug':item['slug'],
              'status':item['status'],
              'title':item['title']['rendered'],
              'link':item.get('link'),
              'sha256':hashlib.sha256(raw.encode()).hexdigest(),
              'length':len(raw),
              'raw_b64':base64.b64encode(raw.encode()).decode(),
          }
          print('CAR_CURRENT_FULL_AUDIT '+json.dumps(result,ensure_ascii=False))
          PY
