name: Fix LBX cheap pre-publish copy

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_lbx_cheap_prepublish_20260927.py
      - .github/workflows/fix-lbx-cheap-prepublish-20260927.yml

permissions:
  contents: read
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded draft-only fix
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/fix_lbx_cheap_prepublish_20260927.py > /tmp/result.md
      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### LBX cheap pre-publish fix 2026-09-27'
            echo
            if [ -f /tmp/result.md ]; then cat /tmp/result.md; else echo '- result: **STOPPED/FAILED**'; fi
          } > /tmp/comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
