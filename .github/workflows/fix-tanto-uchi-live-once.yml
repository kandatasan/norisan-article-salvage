name: Fix Tanto repeated uchi-no from live draft

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_tanto_uchi_live_once.py'
      - '.github/workflows/fix-tanto-uchi-live-once.yml'

permissions:
  contents: read
  issues: write

jobs:
  fix-tanto-uchi-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Syntax check
        run: python -m py_compile scripts/fix_tanto_uchi_live_once.py
      - name: Patch current WordPress draft only
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/fix_tanto_uchi_live_once.py
      - name: Record result on salvage audit issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Tanto live wording cleanup: SUCCESS'
            echo
            cat reports/tanto-model-history-uchi-live-fix/summary.md
          } > /tmp/tanto-uchi-comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/tanto-uchi-comment.md
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tanto-model-history-uchi-live-fix
          path: reports/tanto-model-history-uchi-live-fix/
          if-no-files-found: warn
