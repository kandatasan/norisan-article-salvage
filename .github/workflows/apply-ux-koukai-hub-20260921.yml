name: Apply UX koukai hub enhancement 20260921

on:
  pull_request:
    branches: [main]
    paths:
      - 'baselines/ux-koukai-20260921.html'
      - 'scripts/apply_ux_koukai_hub_20260921.py'
      - '.github/workflows/apply-ux-koukai-hub-20260921.yml'
  push:
    branches: [main]
    paths:
      - 'baselines/ux-koukai-20260921.html'
      - 'scripts/apply_ux_koukai_hub_20260921.py'
      - '.github/workflows/apply-ux-koukai-hub-20260921.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verify-or-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile guarded updater
        run: python -m py_compile scripts/apply_ux_koukai_hub_20260921.py
      - name: Preflight on pull request
        if: github.event_name == 'pull_request'
        run: python scripts/apply_ux_koukai_hub_20260921.py --mode preflight
      - name: Apply reviewed update on main
        if: github.event_name == 'push'
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/apply_ux_koukai_hub_20260921.py --mode apply
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-koukai-hub-${{ github.run_id }}
          path: reports/ux-koukai-hub-20260921/
          if-no-files-found: warn
      - name: Comment PR preflight
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f reports/ux-koukai-hub-20260921/summary.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file reports/ux-koukai-hub-20260921/summary.md
          fi
      - name: Record apply audit in issue 22
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f reports/ux-koukai-hub-20260921/summary.md ]; then
            gh issue comment 22 --repo "${{ github.repository }}" --body-file reports/ux-koukai-hub-20260921/summary.md
          fi
