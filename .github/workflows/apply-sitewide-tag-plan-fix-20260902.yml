name: Apply sitewide tag plan fix 20260902

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-sitewide-tag-plan-fix-20260902.yml']

permissions:
  contents: read
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Preflight and generate configs using existing terms
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,base64,json,os,re,urllib.parse,urllib.request
          from pathlib import Path
          src=Path('.github/workflows/apply-sitewide-tag-plan-20260902.yml').read_text()
          PLAN=ast.literal_eval(re.search(r'^\s*PLAN=(\[.*\])$',src,re.M).group(1))
          TAGS=ast.literal_eval(re.search(r'^\s*TAGS=(\{.*\})$',src,re.M).group(1))
          TAGS['fh']=('釣り方','tsurikata');TAGS['ex']=('実験','lab')
          SITE='https://tsurikue.com'
          tok=base64.b64encode(f"{os.environ['TSURIKUE_WP_USER']}:{os.environ['TSURIKUE_WP_APP_PASSWORD']}".encode()).decode()
          H={'Authorization':'Basic '+tok,'Accept':'application/json','User-Agent':'tsurikue-sitewide-tag-fix/1.0'}
          def get(url):
              r=urllib.request.Request(url,headers=H,method='GET')
              with urllib.request.urlopen(r,timeout=60) as x:return json.loads(x.read().decode()),dict(x.headers)
          q=urllib.parse.urlencode({'context':'edit','status':'publish','per_page':100,'_fields':'id,slug,status,tags'})
          posts,h=get(f'{SITE}/wp-json/wp/v2/posts?{q}');byid={int(p['id']):p for p in posts};expected={pid:slug for pid,slug,_ in PLAN}
          if int(h.get('X-WP-Total','0'))!=71 or set(byid)!=set(expected):raise SystemExit('PUBLISHED_SET_MISMATCH')
          bad=[(pid,byid[pid]['slug'],slug) for pid,slug,_ in PLAN if byid[pid]['slug']!=slug]
          if bad:raise SystemExit('SLUG_MISMATCH '+repr(bad))
          nonempty={pid:p['tags'] for pid,p in byid.items() if p.get('tags')}
          if nonempty:raise SystemExit('EXPECTED_EMPTY_TAGS '+repr(nonempty))
          root=Path('/tmp/tag-configs');root.mkdir()
          plan={}
          for pid,slug,keys in PLAN:
              cfg={'post_id':pid,'slug':slug,'expected_status':'publish','mode':'add_only','allow_create_tags':True,'tags':[{'name':TAGS[k][0],'slug':TAGS[k][1]} for k in keys]}
              (root/f'{pid}.json').write_text(json.dumps(cfg,ensure_ascii=False),encoding='utf-8')
              plan[str(pid)]=[TAGS[k][1] for k in keys]
          Path('/tmp/sitewide-plan.json').write_text(json.dumps(plan,ensure_ascii=False),encoding='utf-8')
          Path('/tmp/sitewide-preflight-ok').write_text('1')
          print(json.dumps({'ok':True,'posts':len(PLAN),'tags':len(TAGS),'reused':{'釣り方':'tsurikata','実験':'lab'}},ensure_ascii=False))
          PY
      - name: Apply guarded tag-only updates
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          touch /tmp/tag-apply-started
          for config in /tmp/tag-configs/*.json; do python scripts/apply_tag_patch_once.py --config "$config"; done
      - name: Verify 71 exact tag sets
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/sitewide-tag-final.json
          import base64,json,os,urllib.request
          from pathlib import Path
          SITE='https://tsurikue.com';plan=json.loads(Path('/tmp/sitewide-plan.json').read_text())
          tok=base64.b64encode(f"{os.environ['TSURIKUE_WP_USER']}:{os.environ['TSURIKUE_WP_APP_PASSWORD']}".encode()).decode();H={'Authorization':'Basic '+tok,'Accept':'application/json','User-Agent':'tsurikue-sitewide-tag-final/1.0'}
          def get(path):
              r=urllib.request.Request(SITE+path,headers=H,method='GET')
              with urllib.request.urlopen(r,timeout=60) as x:return json.loads(x.read().decode()),dict(x.headers)
          for pid,want in plan.items():
              p,_=get(f'/wp-json/wp/v2/posts/{pid}?context=edit&_fields=id,slug,status,tags')
              if p['status']!='publish':raise SystemExit('STATUS_CHANGED '+pid)
              got=[]
              for tid in p.get('tags',[]):
                  t,_=get(f'/wp-json/wp/v2/tags/{tid}?context=edit&_fields=id,name,slug');got.append(t['slug'])
              if sorted(got)!=sorted(want):raise SystemExit('TAG_MISMATCH '+pid+' '+repr((got,want)))
          _,h=get('/wp-json/wp/v2/posts?status=publish&per_page=1&_fields=id')
          if int(h.get('X-WP-Total','0'))!=71:raise SystemExit('POST_COUNT_CHANGED')
          print(json.dumps({'ok':True,'verified_posts':71,'exact_tag_sets':71,'publish_changes':0,'content_changes':0},ensure_ascii=False))
          PY
      - name: Roll back tags only if apply started and failed
        if: failure()
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          test -f /tmp/tag-apply-started || exit 0
          python - <<'PY'
          import base64,json,os,urllib.request
          from pathlib import Path
          plan=json.loads(Path('/tmp/sitewide-plan.json').read_text());SITE='https://tsurikue.com'
          tok=base64.b64encode(f"{os.environ['TSURIKUE_WP_USER']}:{os.environ['TSURIKUE_WP_APP_PASSWORD']}".encode()).decode()
          for pid in plan:
              r=urllib.request.Request(f'{SITE}/wp-json/wp/v2/posts/{pid}',data=b'{"tags":[]}',headers={'Authorization':'Basic '+tok,'Content-Type':'application/json','User-Agent':'tsurikue-sitewide-tag-rollback/1.0'},method='POST')
              with urllib.request.urlopen(r,timeout=60) as x:x.read()
          print('ROLLBACK_TO_EMPTY_TAGS_COMPLETE')
          PY
      - name: Record audit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Sitewide tag plan 2026-09-02: SUCCESS'
            echo '- published posts: **71/71 verified**'
            echo '- taxonomy: **20 useful tags**'
            echo '- 釣り方 reused existing slug: `tsurikata`'
            echo '- 実験 reused existing slug: `lab`'
            echo '- only the WordPress `tags` field was updated by the guarded updater'
            echo '- content / publish status / featured image writes: **0**'
          } >/tmp/tag-comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/tag-comment.md
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sitewide-tag-plan-fix-20260902-audit
          path: |
            /tmp/sitewide-plan.json
            /tmp/sitewide-tag-final.json
            reports/
          if-no-files-found: warn
