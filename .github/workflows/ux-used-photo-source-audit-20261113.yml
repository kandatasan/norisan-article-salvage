name: UX photo source verification (read-only)
on:
  push:
    branches: [ux-used-real-photos-20261113]
    paths: ['.github/workflows/ux-used-photo-source-audit-20261113.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read existing original photo blocks via WP REST (no writes)
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, html, json, os, re, urllib.request, urllib.parse
          auth='Basic '+base64.b64encode((os.environ['TSURIKUE_WP_USER']+':'+os.environ['TSURIKUE_WP_APP_PASSWORD']).encode()).decode()
          base='https://tsurikue.com/wp-json/wp/v2'
          def get(url):
              req=urllib.request.Request(url, headers={'Authorization':auth,'Accept':'application/json','User-Agent':'tsurikue-source-photo-read-only'})
              with urllib.request.urlopen(req, timeout=40) as res:return json.load(res)
          candidates=['lexus-ux-used','ux-koukai','lexus-ux-rear-seat','lexus-ux-luggage','lexus-ux-trunk']
          image_ids=set()
          for slug in candidates:
              rows=get(base+'/posts?context=edit&slug='+urllib.parse.quote(slug)+'&_fields=id,slug,status,title,content,featured_media')
              if not rows:
                  print('NO_POST',slug)
                  continue
              row=rows[0]; body=row['content']['raw']
              print('POST',row['id'],row['slug'],'sha',hashlib.sha256(body.encode()).hexdigest(),'chars',len(body))
              if slug=='lexus-ux-used':
                  for needle in ['中古UXのメリット・デメリット','また、UXは後席と荷室','後席が狭いのも']:
                      i=body.find(needle)
                      print('ANCHOR',needle,'COUNT',body.count(needle),'CONTEXT',body[max(i-700,0):i+900] if i>=0 else '')
              for i,m in enumerate(re.finditer(r'<!-- wp:image\b.*?<!-- /wp:image -->',body,re.S)):
                  block=m.group(0)
                  ids=re.findall(r'wp-image-(\d+)',block)
                  if not ids: ids=re.findall(r'"id":(\d+)',block)
                  image_ids.update(map(int,ids))
                  print('IMG',slug,i,'IDS',ids,'BLOCK',block[:1200].replace('\n',' '))
          print('MEDIA_IDS',sorted(image_ids))
          for n in sorted(image_ids):
              if len(str(n))>7:continue
              try:
                  media=get(base+'/media/'+str(n)+'?_fields=id,slug,source_url,alt_text,caption,title,post,media_details')
                  md=media.get('media_details') or {}
                  print('MEDIA',json.dumps({'id':n,'post':media.get('post'),'url':media.get('source_url'),'alt':media.get('alt_text'),'title':html.unescape((media.get('title') or {}).get('rendered','')),'width':md.get('width'),'height':md.get('height'),'sizes':sorted((md.get('sizes') or {}).keys())},ensure_ascii=False))
              except Exception as e:print('MEDIA_FAILED',n,str(e)[:180])
          PY