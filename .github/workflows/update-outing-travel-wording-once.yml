name: Update outing travel wording once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-outing-travel-wording-once.yml'
      - 'ops/outing-travel-wording/**'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Patch canonical outing wording
        run: |
          python ops/outing-travel-wording/update.py
          git diff --check

      - name: Update WordPress outing draft only
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            echo "outing wording deploy attempt ${attempt}/3"
            if python category-hubs/outing/deploy.py; then exit 0; fi
            if [[ "$attempt" != 3 ]]; then sleep 8; fi
          done
          exit 1

      - name: Verify WordPress draft wording
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            if python ops/outing-travel-wording/verify.py; then exit 0; fi
            if [[ "$attempt" != 3 ]]; then sleep 6; fi
          done
          exit 1

      - name: Commit canonical wording after verification
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add category-hubs/outing/content.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update outing travel wording'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Success summary
        run: echo 'OUTING_TRAVEL_WORDING_UPDATED'
