name: Apply top header and drawer prototype

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-top-header-drawer-prototype-once.yml'
      - 'experimental-pages/top-design-lab/header-prototype/**'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply header prototype to current top page
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python experimental-pages/top-design-lab/header-prototype/apply.py

      - name: Make checkbox itself the mobile tap target
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python experimental-pages/top-design-lab/header-prototype/patch_direct_checkbox.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser verifier
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Verify mobile drawer and desktop navigation
        id: verify_header
        continue-on-error: true
        run: node experimental-pages/top-design-lab/header-prototype/verify.js

      - name: Roll back custom header if verification failed
        if: steps.verify_header.outcome == 'failure'
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python experimental-pages/top-design-lab/header-prototype/restore.py

      - name: Fail after safe rollback
        if: steps.verify_header.outcome == 'failure'
        run: |
          echo 'Header browser verification failed; custom prototype was rolled back.'
          exit 1

      - name: Commit synchronized WordPress source
        if: steps.verify_header.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experimental-pages/top-design-lab/content.html experimental-pages/top-design-lab/config.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add top header and drawer prototype'
          git push origin HEAD:main
