name: Inspect kotamagai preserved source body once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_kotamagai_source_body_once.py'
      - '.github/workflows/inspect-kotamagai-source-body-once.yml'

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rebuild preserved source locally
        run: PYTHONPATH=scripts python scripts/inspect_kotamagai_source_body_once.py
      - name: Record source body on audit issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### kotamagai preserved source body: SUCCESS'
            echo
            cat reports/kotamagai-source-body/summary.md
          } > /tmp/comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Upload source body
        uses: actions/upload-artifact@v4
        with:
          name: kotamagai-source-body
          path: reports/kotamagai-source-body/
