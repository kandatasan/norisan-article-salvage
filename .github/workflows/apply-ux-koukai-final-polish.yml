name: Apply UX resale through proven UX runner v2

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply_ux_resale_rewrite_v2.py
      - .github/workflows/apply-ux-koukai-final-polish.yml

permissions:
  contents: read
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile UX resale rewrite wrapper
        run: python -m py_compile scripts/apply_ux_resale_rewrite_v2.py
      - name: Apply guarded UX resale rewrite v2
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/apply_ux_resale_rewrite_v2.py
      - name: Record audit result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### ux-resale rewrite through proven UX runner v2'
            echo
            if [ -f reports/ux-resale-rewrite-once/summary.md ]; then
              cat reports/ux-resale-rewrite-once/summary.md
            else
              echo '- result: **BLOCKED_BEFORE_APPLY**'
              echo '- wordpress_write_count: **0**'
            fi
          } > /tmp/comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-resale-rewrite-proven-ux-runner-v2
          path: reports/ux-resale-rewrite-once/
          if-no-files-found: warn
