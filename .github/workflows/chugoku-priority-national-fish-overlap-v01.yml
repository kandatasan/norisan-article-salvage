name: Chugoku priority rivers NILIM fish overlap v01 (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'river-fish/research-20261021/audit_chugoku_priority_national_fish_overlap_v01.py'
      - 'river-fish/research-20261021/test_chugoku_priority_national_fish_overlap_v01.py'
      - 'river-fish/research-20261021/extract_official_named_river_fish_v03.py'
      - 'river-fish/research-20261021/chugoku_seven_river_plan_reaches_v01.csv'
      - '.github/workflows/chugoku-priority-national-fish-overlap-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-fish-overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests for exact matching and output safety
        run: python -m unittest discover -s river-fish/research-20261021 -p 'test_chugoku_priority_national_fish_overlap_v01.py' -v
      - name: Extract pinned official data and summarize only the seven exact name pairs
        run: python river-fish/research-20261021/audit_chugoku_priority_national_fish_overlap_v01.py --out "$RUNNER_TEMP/chugoku-priority-overlap-v01"
      - name: Validate research-only summary artifact
        run: |
          python - <<'PY'
          import csv, json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'chugoku-priority-overlap-v01'
          d=json.loads((root/'chugoku_priority_national_fish_overlap_v01.json').read_text(encoding='utf-8'))
          rows=list(csv.DictReader((root/'chugoku_priority_national_fish_overlap_v01.csv').open(encoding='utf-8',newline='')))
          assert d['priority_river_groups']==7 and len(rows)==7
          assert d['literal_name_match_groups']==2 and d['no_literal_name_match_groups']==5
          assert d['fish_names_emitted'] is False and d['station_or_coordinate_emitted'] is False and d['site_updated'] is False
          assert all(r['fish_publication_approval']=='not_approved' and r['integration_status']=='research_only' for r in rows)
          print('CHUGOKU_PRIORITY_NILIM_OVERLAP_SAFE',json.dumps(d,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chugoku-priority-national-fish-overlap-v01-review-only
          path: ${{ runner.temp }}/chugoku-priority-overlap-v01/chugoku_priority_national_fish_overlap_v01.*
          retention-days: 30
