name: Inspect rendered top header prototype

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-tsurikue-header-menu-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Inspect rendered prototype
        run: |
          cat > inspect.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('https://tsurikue.com/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(1800);
            const d=await page.evaluate(()=>{
              const q=s=>document.querySelector(s);
              return {
                details:q('.tq-site-menu')?.outerHTML || null,
                nav:q('.tq-site-nav')?.outerHTML || null,
                customHtml:[...document.querySelectorAll('.post_content details, .post_content nav')].map(e=>e.outerHTML).slice(0,10)
              };
            });
            console.log('PROTOTYPE_RENDERED='+JSON.stringify(d,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node inspect.js
