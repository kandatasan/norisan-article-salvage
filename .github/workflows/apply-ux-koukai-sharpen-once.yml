name: Apply UX koukai sharpen once

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply_ux_koukai_sharpen_once.py
      - .github/workflows/apply-ux-koukai-sharpen-once.yml

permissions:
  contents: read
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply guarded UX read-through sharpen
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/apply_ux_koukai_sharpen_once.py
      - name: Record audit result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### ux-koukai sharpen'
            echo
            cat reports/ux-koukai-sharpen-once/summary.md
          } > /tmp/comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-koukai-sharpen-once
          path: reports/ux-koukai-sharpen-once/
          if-no-files-found: warn
