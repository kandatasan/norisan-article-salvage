name: Fix NX version L HUD comparison cell

on:
  push:
    branches: [main]
    paths:
      - 'scripts/correct_nx_hud_20261026.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correct-nx-hud:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Syntax check
        run: python -m py_compile scripts/correct_nx_hud_20261026.py
      - name: Correct only NX HUD value
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/correct_nx_hud_20261026.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nx-hud-correction-result
          path: reports/nx-hud-20261026/
          if-no-files-found: warn
