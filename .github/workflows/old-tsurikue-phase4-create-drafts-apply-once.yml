name: Old Tsurikue Phase 4 create drafts apply once

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type CREATE_OLD_TSURIKUE_DRAFTS exactly to create draft posts'
        required: true
        type: string

jobs:
  create-drafts-apply-once:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      OUTPUT_DIR: reports/old-tsurikue-phase4-create-drafts-apply-once
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run all old-tsurikue safety tests
        run: >-
          python -m unittest
          tests/test_old_tsurikue_remake_dry_run.py
          tests/test_old_tsurikue_remake_qa_dry_run.py
          tests/test_old_tsurikue_remake_final_qa_dry_run.py
          tests/test_old_tsurikue_remake_publish_polish_dry_run.py
          tests/test_old_tsurikue_phase4_create_plan_dry_run.py
          tests/test_old_tsurikue_phase4_create_drafts_apply_once.py
          -v
      - name: Create approved old-tsurikue drafts only
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          PHASE4_CONFIRMATION: ${{ inputs.confirmation }}
        run: >-
          python scripts/old_tsurikue_phase4_create_drafts_apply_once.py
          --site-url https://tsurikue.com
          --output-dir "$OUTPUT_DIR"
      - name: Upload apply artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: old-tsurikue-phase4-create-drafts-apply-once
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: warn
