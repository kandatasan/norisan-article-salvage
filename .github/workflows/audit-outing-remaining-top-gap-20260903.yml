name: Audit outing remaining top gap 20260903
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-outing-remaining-top-gap-20260903.yml'
      - 'category-hubs/outing-v6/diagnose_remaining_top_gap.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --quiet selenium
      - name: Diagnose remaining top gap
        run: |
          set -euo pipefail
          python category-hubs/outing-v6/diagnose_remaining_top_gap.py | tee /tmp/outing-remaining-top-gap.json
      - uses: actions/upload-artifact@v4
        with:
          name: outing-remaining-top-gap
          path: /tmp/outing-remaining-top-gap.json
