name: Old Tsurikue Phase 3.1 editorial QA dry-run

on:
  workflow_dispatch:

jobs:
  remake-qa-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OUTPUT_DIR: reports/old-tsurikue-remake-qa-dry-run
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run Phase 3 tests
        run: python -m unittest tests/test_old_tsurikue_remake_dry_run.py -v
      - name: Run Phase 3.1 QA tests
        run: python -m unittest tests/test_old_tsurikue_remake_qa_dry_run.py -v
      - name: Build Phase 3.1 QA artifacts
        run: python scripts/old_tsurikue_remake_qa_dry_run.py --output-dir "$OUTPUT_DIR"
      - name: Upload Phase 3.1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: old-tsurikue-remake-qa-dry-run
          path: ${{ env.OUTPUT_DIR }}/
          if-no-files-found: error
