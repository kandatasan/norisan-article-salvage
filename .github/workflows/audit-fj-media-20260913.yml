name: Audit Land Cruiser FJ uploaded media 20260913

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-fj-media-20260913.yml'

permissions:
  contents: read
  issues: write

jobs:
  audit-fj-media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Inspect FJ media read-only
        shell: bash
        run: |
          python - <<'PY' > /tmp/fj-media-audit.md
          import json, re, urllib.parse, urllib.request

          wanted = [
              'IMG_8318','IMG_8317','IMG_8316','IMG_8315','IMG_8314',
              'IMG_8313','IMG_8312','IMG_8311','IMG_8310','IMG_8309',
              'IMG_8130','IMG_8129','IMG_8123','IMG_8125','IMG_8122'
          ]
          headers={'Accept':'application/json','User-Agent':'tsurikue-fj-media-audit/1.1'}

          def raw(v):
              if isinstance(v,dict):
                  return v.get('rendered') or v.get('raw') or ''
              return v or ''

          matches=[]
          errors=[]
          for stem in wanted:
              q=urllib.parse.urlencode({
                  'per_page':100,
                  'search':stem,
                  '_fields':'id,date,slug,source_url,media_details,alt_text,caption,title'
              })
              url='https://tsurikue.com/wp-json/wp/v2/media?'+q
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      batch=json.loads(r.read().decode())
              except Exception as e:
                  errors.append(f'{stem}: {type(e).__name__}: {e}')
                  continue
              for row in batch:
                  source=row.get('source_url') or ''
                  name=urllib.parse.unquote(source.rsplit('/',1)[-1])
                  title=re.sub('<[^>]+>','',raw(row.get('title'))).strip()
                  if stem.casefold() not in (name+' '+title).casefold():
                      continue
                  md=row.get('media_details') or {}
                  matches.append({
                      'wanted':stem,
                      'id':row.get('id'),
                      'date':row.get('date'),
                      'filename':name,
                      'source_url':source,
                      'width':md.get('width'),
                      'height':md.get('height'),
                      'alt':row.get('alt_text') or '',
                      'caption':re.sub('<[^>]+>','',raw(row.get('caption'))).strip()
                  })

          print('### Land Cruiser FJ media audit 2026-09-13 (read-only)')
          print('')
          print(f'- searched_stems: **{len(wanted)}**')
          print(f'- matched_media: **{len(matches)}**')
          print(f'- query_errors: **{len(errors)}**')
          print('')
          for m in matches:
              print(f"#### {m['wanted']}")
              print(f"- media_id: **{m['id']}**")
              print(f"- filename: `{m['filename']}`")
              print(f"- date: {m['date']}")
              print(f"- dimensions: {m['width']} x {m['height']}")
              print(f"- source_url: {m['source_url']}")
              print(f"- alt: {m['alt']}")
              print(f"- caption: {m['caption']}")
              print('')
          missing=[w for w in wanted if not any(m['wanted']==w for m in matches)]
          print('### Missing stems')
          print('')
          if missing:
              for x in missing:
                  print(f'- {x}')
          else:
              print('- none')
          if errors:
              print('')
              print('### Query errors')
              print('')
              for e in errors:
                  print(f'- {e}')
          PY
      - name: Record on audit issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/fj-media-audit.md
