name: Add spindle carwash images once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_spindle_carwash_images_once.py'
      - '.github/workflows/add-spindle-carwash-images-once.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  insert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Syntax check
        run: python -m py_compile scripts/add_spindle_carwash_images_once.py
      - name: Insert confirmed WordPress media into draft
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/add_spindle_carwash_images_once.py
      - name: Record result on issue 22
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file reports/spindle-carwash-image-insert/summary.md
      - name: Upload image insertion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spindle-carwash-image-insert
          path: reports/spindle-carwash-image-insert/
          if-no-files-found: warn
