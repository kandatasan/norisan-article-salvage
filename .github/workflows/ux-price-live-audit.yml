name: UX v0.20 production and SWELL read-only live audit
on:
  push:
    branches: [main]
    paths:
      - 'ops/lexus-ux-price-checker/blog_parts/verify_public.php'
      - '.github/workflows/ux-price-live-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      XSERVER_SSH_HOST: ${{ secrets.XSERVER_SSH_HOST }}
      XSERVER_SSH_USER: ${{ secrets.XSERVER_SSH_USER }}
      XSERVER_SSH_PRIVATE_KEY: ${{ secrets.XSERVER_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint read-only verifier and check input safety
        shell: bash
        run: |
          set -euo pipefail
          php -l ops/lexus-ux-price-checker/blog_parts/verify_public.php
          grep -Fq 'UX_LIVE_ROUGH_SLIDERS=PASS' ops/lexus-ux-price-checker/blog_parts/verify_public.php
          test -f ops/lexus-ux-price-checker/index.html
          grep -Fq 'id="general-price"' ops/lexus-ux-price-checker/index.html
          grep -Fq 'id="cpo-price"' ops/lexus-ux-price-checker/index.html
      - name: Verify Xserver SSH pinned identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$XSERVER_SSH_HOST" && test -n "$XSERVER_SSH_USER" && test -n "$XSERVER_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$XSERVER_SSH_PRIVATE_KEY" > "$HOME/.ssh/xserver_deploy_key"
          chmod 600 "$HOME/.ssh/xserver_deploy_key"
          bash river-fish/xserver-git/verify_host_key.sh
      - name: Read-only verify current UX tool and SWELL blog part
        shell: bash
        run: |
          set -euo pipefail
          remote="$XSERVER_SSH_USER@$XSERVER_SSH_HOST"
          key="$HOME/.ssh/xserver_deploy_key"
          opts="-p 10022 -i $key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          temp=".tsurikue-ux-audit-$GITHUB_RUN_ID.php"
          scp -P 10022 -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" ops/lexus-ux-price-checker/blog_parts/verify_public.php "$remote:$temp"
          ssh $opts "$remote" bash -s -- "$temp" <<'REMOTE'
          set -euo pipefail
          temp="$1"; [[ "$temp" =~ ^\.tsurikue-ux-audit-[0-9]+\.php$ ]] || exit 12
          root="$HOME/tsurikue.com/public_html"
          test -d "$root" && test ! -L "$root" && test -f "$root/wp-config.php"
          test -f "$HOME/$temp" && test ! -L "$HOME/$temp"
          trap 'rm -f "$HOME/$temp"' EXIT
          cd "$root"
          wp eval-file "$HOME/$temp"
          REMOTE
          echo 'UX_V020_PRODUCTION_AND_SWELL_READONLY_AUDIT=PASS' >> "$GITHUB_STEP_SUMMARY"
