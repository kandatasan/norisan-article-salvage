name: Trim Ask the Meat once
on:
  push:
    branches: [main]
    paths:
      - 'scripts/trim_ask_the_meat_once.py'
      - '.github/workflows/trim-ask-the-meat-once.yml'
  workflow_dispatch:
jobs:
  trim:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python -m py_compile scripts/trim_ask_the_meat_once.py
      - name: Trim copy while preserving user-selected images
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          python scripts/trim_ask_the_meat_once.py | tee /tmp/ask-meat-trim.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ask-the-meat-trim-audit
          path: /tmp/ask-meat-trim.json
          if-no-files-found: warn
