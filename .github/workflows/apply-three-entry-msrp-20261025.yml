name: Apply three entry MSRP updates safely

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_three_entry_msrp_once_20261025.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-entry-msrp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Syntax check
        run: python -m py_compile scripts/update_three_entry_msrp_once_20261025.py
      - name: Guarded WordPress price patches (preserves published status)
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/update_three_entry_msrp_once_20261025.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-entry-msrp-result
          path: reports/three-entry-msrp/
          if-no-files-found: warn
