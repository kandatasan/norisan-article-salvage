name: Inspect kotamagairyouri draft once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-kotamagairyouri-draft-once.yml'

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run GET-only draft inspection
        id: audit
        continue-on-error: true
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set +e
          python scripts/inspect_editorial_draft.py --config editorial-inspect/kotamagairyouri.json > /tmp/audit.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record audit result on Issue 22
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        shell: bash
        run: |
          {
            echo '### kotamagairyouri one-off draft audit'
            echo
            echo "- mode: **GET ONLY**"
            echo "- wordpress_write_count: **0**"
            echo "- exit_code: **${EXIT_CODE:-unknown}**"
            echo
            if [[ "${EXIT_CODE:-1}" == "0" && -f reports/editorial-inspect/kotamagairyouri/summary.md ]]; then
              cat reports/editorial-inspect/kotamagairyouri/summary.md
            else
              echo '#### Safe error output'
              echo '```text'
              tail -n 30 /tmp/audit.log | sed -E 's/(Authorization:|Basic )[A-Za-z0-9+\/=._-]+/[REDACTED]/g'
              echo '```'
            fi
          } > /tmp/comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Fail if inspection failed
        if: always()
        env:
          EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        shell: bash
        run: test "${EXIT_CODE:-1}" = "0"
