name: Repair outing flat cards once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-outing-flat-cards-once.yml']
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Patch page 3154 directly
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python category-hubs/outing/patch_live_flat_cards.py
      - name: Success
        run: echo OUTING_FLAT_CARDS_REPAIRED