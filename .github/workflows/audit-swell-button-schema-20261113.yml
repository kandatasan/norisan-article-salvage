name: Read-only determine SWELL button tracking attributes
on:
  push:
    branches: [migrate-old-gulliver-tracked-buttons-20261113]
    paths: [.github/workflows/audit-swell-button-schema-20261113.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Lookup registered SWELL button block attributes and existing code
        env:
          WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          WP_PASS: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import base64,json,os,urllib.error,urllib.request
          auth="Basic "+base64.b64encode((os.environ['WP_USER']+':'+os.environ['WP_PASS']).encode()).decode()
          for url in [
            'https://tsurikue.com/wp-json/wp/v2/block-types/loos/button?context=edit',
            'https://tsurikue.com/wp-json/wp/v2/block-types?context=edit',
            'https://tsurikue.com/wp-json/wp/v2/blog_parts/4507?context=edit&_fields=content'
          ]:
            req=urllib.request.Request(url,headers={'Authorization':auth,'Accept':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=35) as f:d=json.load(f)
              if isinstance(d,dict) and 'attributes' in d:print('BLOCK_ATTRS',url,json.dumps(d['attributes'],ensure_ascii=False)[:13000])
              elif isinstance(d,list):
                for row in d:
                  if row.get('name')=='loos/button':
                    print('BLOCK_ATTRS_IN_LIST',json.dumps(row,ensure_ascii=False)[:13000])
              elif isinstance(d,dict) and 'content' in d:print('4507_GUTENBERG',repr(d['content']['raw'][:3500]))
              else:print('RESPONSE_OTHER',url,str(d)[:1000])
            except urllib.error.HTTPError as e:print('HTTP_ERROR',url,e.code,e.read().decode('utf-8','replace')[:350])
          PY
          echo 'CODE_SAMPLES'
          grep -R -n -E '"isCount"|counted|btnID|"isCountOn"|data-id="|isCount.*true|"btnId"' scripts/ tests/ editorial/ | head -35 || true