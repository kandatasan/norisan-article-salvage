name: Apply homepage complete v2 20260902

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-homepage-complete-v2-20260902.yml'
      - 'experimental-pages/top-design-lab/content.html'
      - 'experimental-pages/top-design-lab/config.json'
      - 'experimental-pages/top-design-lab/complete-v2/**'

permissions:
  contents: read
  issues: write

jobs:
  deploy-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate canonical homepage complete v2 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('experimental-pages/top-design-lab/content.html')
          s=p.read_text(encoding='utf-8')
          cfg=json.loads(Path('experimental-pages/top-design-lab/config.json').read_text(encoding='utf-8'))
          required=['<!-- tsurikue-experimental-page:v1:top-design-lab -->','/* TQ TOP CARD RESPONSE + HUB LINKS v2 */','href="/odekake/"','href="/gourmet-guide/"','href="/fishing-guide/"','href="/car-guide/"','h3 a::after','touch-action:manipulation']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('HOME_V2_MISSING='+repr(missing))
          old=['/category/sightseeing-leisure/','/category/gourmet/','/category/fishing/','/category/car/']
          if any(x in s for x in old): raise SystemExit('HOME_V2_OLD_CATEGORY_LINK_REMAINS')
          if any(x in s for x in ['100vw','100dvw','50vw','50dvw']): raise SystemExit('HOME_V2_VIEWPORT_HACK_REMAINS')
          digest=hashlib.sha256(s.encode()).hexdigest()
          if cfg.get('expected_current_content_sha256')!=digest: raise SystemExit('HOME_V2_CONFIG_SHA_MISMATCH')
          if cfg.get('homepage_revision')!='complete-v2-card-response-hub-links': raise SystemExit('HOME_V2_REVISION_MISMATCH')
          print('HOME_COMPLETE_V2_SOURCE_OK',digest)
          PY

      - name: Backup published homepage
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          TQ_HOME_BACKUP_PATH: /tmp/homepage-complete-v2-backup.json
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4; do
            if python experimental-pages/top-design-lab/complete-v2/live_backup.py backup; then
              ok=1
              break
            fi
            echo "Homepage backup attempt ${attempt}/4 failed; retrying..." >&2
            sleep $((attempt * 5))
          done
          test "$ok" -eq 1

      - name: Update published homepage
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          TQ_HOME_RESULT_PATH: /tmp/homepage-complete-v2-result.json
        shell: bash
        run: |
          set -euo pipefail
          python experimental-pages/top-design-lab/complete-v2/deploy_live.py | tee /tmp/homepage-complete-v2-deploy.log

      - name: Install render audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet selenium

      - name: Verify live desktop and mobile card response
        id: render
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python experimental-pages/top-design-lab/complete-v2/verify_render.py | tee /tmp/homepage-complete-v2-render.log

      - name: Roll back homepage if render audit fails
        if: steps.render.outcome == 'failure'
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          TQ_HOME_BACKUP_PATH: /tmp/homepage-complete-v2-backup.json
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            if python experimental-pages/top-design-lab/complete-v2/live_backup.py rollback; then
              ok=1
              break
            fi
            echo "Homepage rollback attempt ${attempt}/3 failed; retrying..." >&2
            sleep $((attempt * 5))
          done
          test "$ok" -eq 1
          echo 'Render audit failed; published homepage was restored.' >&2
          exit 1

      - name: Record success audit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Homepage complete v2: SUCCESS'
            echo '```json'
            cat /tmp/homepage-complete-v2-result.json
            echo '```'
            echo '```json'
            cat homepage-complete-v2-render-check.json
            echo '```'
          } >/tmp/homepage-complete-v2-comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/homepage-complete-v2-comment.md

      - name: Upload homepage audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-complete-v2-audit
          path: |
            /tmp/homepage-complete-v2-result.json
            /tmp/homepage-complete-v2-deploy.log
            /tmp/homepage-complete-v2-render.log
            homepage-complete-v2-render-check.json
            homepage-complete-v2-desktop.png
            homepage-complete-v2-mobile.png
          if-no-files-found: warn
