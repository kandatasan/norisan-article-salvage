name: National river-fish official code candidate review v05
on:
  pull_request:
    branches: [main]
    paths:
      - 'river-fish/research-20261021/build_official_river_code_candidates_v05.py'
      - 'river-fish/research-20261021/test_official_river_code_candidates_v05.py'
      - '.github/workflows/river-fish-national-code-join-v05.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-code-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        region: [hokkaido, tohoku, kanto, hokuriku, chubu, kinki, chugoku, shikoku, kyushu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate official code list and fail-closed join tests
        run: python -m unittest discover -s river-fish/research-20261021 -p 'test_official_river_code_candidates_v05.py' -v
      - name: Re-extract pinned original official regional fish survey (read-only)
        run: python river-fish/research-20261021/extract_official_named_river_fish_nationwide_v04.py --region "${{ matrix.region }}" --out "$RUNNER_TEMP/official-river-fish-v05"
      - name: Triangulate official river names against 35,449 national river codes
        run: python river-fish/research-20261021/build_official_river_code_candidates_v05.py --region "${{ matrix.region }}" --source-csv "$RUNNER_TEMP/official-river-fish-v05/official_direct_river_fish_v04.csv" --out "$RUNNER_TEMP/official-river-fish-v05/code_candidate_review_v05.json"
      - name: Validate no publication approval or fish label leakage in candidate JSON
        run: |
          python - <<'PY'
          import json, os, pathlib, collections
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"official-river-fish-v05"
          s=json.loads((p/"manifest_review_only_v04.json").read_text())
          d=json.loads((p/"code_candidate_review_v05.json").read_text())
          assert d["status"]=="REVIEW_ONLY_DO_NOT_UPLOAD"
          assert d["source_river_name_groups"]==s["river_name_groups"]
          assert d["source_fish_year_records"]==s["source_fish_year_records"]
          assert all(not x["approved_for_publication"] and not x["code_identity_verified"]
                     and not x["prefecture_verified"] for x in d["river_name_groups"])
          assert all("recorded_name" not in x and "survey_year" not in x
                     for x in d["river_name_groups"])
          c=collections.Counter(x["status"] for x in d["river_name_groups"])
          assert sum(c.values())==d["source_river_name_groups"]
          print("CODE_REVIEW_V05_VALIDATED",json.dumps({"region":d["region"],
              "river_groups":d["source_river_name_groups"],
              "fish_year_records":d["source_fish_year_records"],
              "statuses":dict(sorted(c.items())),
              "published":False},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: river-fish-national-code-review-v05-${{ matrix.region }}
          path: |
            ${{ runner.temp }}/official-river-fish-v05/manifest_review_only_v04.json
            ${{ runner.temp }}/official-river-fish-v05/code_candidate_review_v05.json
          retention-days: 30
