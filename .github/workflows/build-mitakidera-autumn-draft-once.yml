name: Build Mitakidera autumn draft once
on:
  push:
    paths:
      - 'scripts/build_mitakidera_autumn_draft_once.py'
      - '.github/workflows/build-mitakidera-autumn-draft-once.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m py_compile scripts/build_mitakidera_autumn_draft_once.py
      - name: Build draft
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          python scripts/build_mitakidera_autumn_draft_once.py | tee /tmp/mitakidera.json
      - uses: actions/upload-artifact@v4
        with:
          name: mitakidera-audit
          path: /tmp/mitakidera.json
