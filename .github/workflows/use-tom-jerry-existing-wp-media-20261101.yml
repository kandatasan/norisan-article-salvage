name: Insert existing Tom and Jerry photos in WP draft 4282
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/use_tom_jerry_existing_media_20261101.py'
      - '.github/workflows/use-tom-jerry-existing-wp-media-20261101.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/use_tom_jerry_existing_media_20261101.py'
      - '.github/workflows/use-tom-jerry-existing-wp-media-20261101.yml'
permissions:
  contents: read
jobs:
  match-existing-media:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-matching library
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"
      - name: Read-only verify existing WP draft and 15 original photos
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/use_tom_jerry_existing_media_20261101.py check
      - name: Insert verified photo IDs in existing unpublished draft
        if: github.event_name == 'push'
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/use_tom_jerry_existing_media_20261101.py apply
      - name: Save WordPress audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tom-jerry-existing-photo-audit
          path: reports/tom-jerry-existing-media/
          if-no-files-found: warn
