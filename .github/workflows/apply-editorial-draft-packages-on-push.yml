name: Apply editorial draft packages on push

on:
  push:
    branches: [main]
    paths:
      - 'editorial/**'
  workflow_dispatch:
    inputs:
      config_path:
        description: 'Editorial config path, e.g. editorial/tottori-drive/config.json'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  apply-editorial-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run generic safety tests
        run: python -m unittest tests/test_apply_editorial_draft_once.py -v
      - name: Resolve configs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            printf '%s\n' '${{ inputs.config_path }}' > /tmp/configs.txt
          else
            git diff --name-only HEAD^ HEAD -- 'editorial/*/config.json' 'editorial/*/content.html' \
              | awk -F/ 'NF>=3 {print $1 "/" $2 "/config.json"}' \
              | sort -u > /tmp/configs.txt
          fi
          test -s /tmp/configs.txt
          cat /tmp/configs.txt
      - name: Apply only guarded draft packages
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r config; do
            python scripts/apply_editorial_draft_once.py --config "$config"
          done < /tmp/configs.txt
      - name: Record results on salvage audit issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Editorial draft update: SUCCESS'
            echo
            find reports -name summary.md -print -exec cat {} \;
          } > /tmp/editorial-comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/editorial-comment.md
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-draft-update
          path: reports/
          if-no-files-found: warn
