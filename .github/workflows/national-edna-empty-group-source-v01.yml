name: National eDNA empty-river source schema (read-only)
on:
  pull_request:
    branches: [main]
    paths: ['river-fish/national-edna-empty-group-v01/**', '.github/workflows/national-edna-empty-group-source-v01.yml']
  push:
    branches: [main]
    paths: ['river-fish/national-edna-empty-group-v01/**', '.github/workflows/national-edna-empty-group-source-v01.yml']
permissions:
  contents: read
jobs:
  inspect-public-table-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect publisher supplement without emitting source records
        run: |
          python -m pip install openpyxl==3.1.5
          python -m unittest discover -s river-fish/national-edna-empty-group-v01 -p 'test_*.py' -v
          python river-fish/national-edna-empty-group-v01/inspect_supplement.py
