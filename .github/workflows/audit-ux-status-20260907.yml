name: Audit UX publish draft state

on:
  push:
    branches:
      - main
    paths:
      - scripts/audit_ux_status_20260907.py
      - .github/workflows/audit-ux-status-20260907.yml

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run GET-only WordPress audit
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/audit_ux_status_20260907.py
      - name: Record audit result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### UX publish/draft state audit'
            echo
            cat reports/audit-ux-status-20260907/summary.md
          } > /tmp/comment.md
          gh issue comment 370 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-ux-status-20260907
          path: reports/audit-ux-status-20260907/
          if-no-files-found: warn
