name: Inspect outing hero CSS once
on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_outing_hero_css.py'
      - '.github/workflows/inspect-outing-hero-css-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --disable-pip-version-check selenium
      - name: Inspect rendered hero CSS
        shell: bash
        run: |
          set -o pipefail
          python scripts/inspect_outing_hero_css.py | tee /tmp/outing-hero-css.json
      - uses: actions/upload-artifact@v4
        with:
          name: outing-hero-css
          path: /tmp/outing-hero-css.json
