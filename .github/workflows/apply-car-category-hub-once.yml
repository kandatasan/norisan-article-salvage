name: Apply car category hub once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-car-category-hub-once.yml']
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/car-category-hub-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate source
        run: |
          python -m py_compile category-hubs/car/deploy.py
          grep -q 'tsurikue-category-hub:v1:car-blocks' category-hubs/car/content.html
          grep -q '__CAR_HERO_URL__' category-hubs/car/content.html
          grep -q '__CAR_HERO_ID__' category-hubs/car/content.html
          grep -q '__CAR_CATEGORY_FILTER__' category-hubs/car/content.html
          grep -q 'HERO_MEDIA_ID = 2507' category-hubs/car/deploy.py
          grep -q 'CAR_CATEGORY_IDS = (10, 11)' category-hubs/car/deploy.py
          python - <<'PY'
          from pathlib import Path
          source = Path('category-hubs/car/content.html').read_text(encoding='utf-8')
          assert source.count('<!-- wp:group') == source.count('<!-- /wp:group -->')
          assert source.count('<!-- wp:cover') == source.count('<!-- /wp:cover -->')
          assert source.count('<!-- wp:html -->') == source.count('<!-- /wp:html -->')
          assert source.count('__CAR_CATEGORY_FILTER__') == 1
          assert source.count('__CAR_HERO_URL__') == 2
          assert source.count('__CAR_HERO_ID__') == 2
          assert '"categories":__CAR_CATEGORY_FILTER__' in source
          forbidden = (
              'tq-global-site-nav-ref',
              'TQ HEADER DRAWER PROTOTYPE',
              'TQ HEADER NAV PROTOTYPE',
              'TQ SITEWIDE HOLIDAY MENU',
          )
          assert not any(marker in source for marker in forbidden)
          print('CAR_SOURCE_VALID')
          PY
      - name: Create or update car draft
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            echo "car deploy attempt ${attempt}/3"
            if python category-hubs/car/deploy.py; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep 10
            fi
          done
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop verifier
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Verify 1024px and 1440px desktop layouts
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: node category-hubs/car/verify_desktop.js
      - name: Save desktop preview
        uses: actions/upload-artifact@v4
        with:
          name: car-desktop-preview
          path: car-desktop-1440.png
          if-no-files-found: error
          retention-days: 7
      - name: Success
        run: echo 'CAR_CATEGORY_HUB_DRAFT_AND_DESKTOP_VERIFIED'
# refine-car-hero-copy-position
