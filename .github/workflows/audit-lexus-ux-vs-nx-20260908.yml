name: Audit Lexus UX vs NX draft once

on:
  push:
    branches: [main]
    paths:
      - scripts/audit_lexus_ux_vs_nx_draft_20260908.py
      - .github/workflows/audit-lexus-ux-vs-nx-20260908.yml

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit live WordPress
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile scripts/audit_lexus_ux_vs_nx_draft_20260908.py
          python scripts/audit_lexus_ux_vs_nx_draft_20260908.py > /tmp/audit.md
          cat /tmp/audit.md
          gh issue comment 435 --repo "${{ github.repository }}" --body-file /tmp/audit.md
