name: Apply outing standalone hero v8 20260903
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-outing-standalone-hero-v8-20260903.yml'
      - 'category-hubs/outing-v8/**'
permissions:
  contents: read
jobs:
  deploy-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Backup published outing
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          TQ_OUTING_BACKUP_PATH: /tmp/outing-v8-backup.json
        run: |
          set -euo pipefail
          python category-hubs/outing-v3/live_backup.py backup
      - name: Make hero a standalone Gutenberg block
        id: deploy
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: |
          set -euo pipefail
          python category-hubs/outing-v8/patch_standalone_hero.py | tee /tmp/outing-v8-deploy.log
      - name: Install render audit dependencies
        if: steps.deploy.outcome == 'success'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet selenium
      - name: Verify public render and block structure
        id: verify
        if: steps.deploy.outcome == 'success'
        run: |
          set -euo pipefail
          python category-hubs/outing-v8/verify_standalone_hero.py | tee /tmp/outing-v8-render.log
      - name: Roll back on render failure
        if: failure() && steps.deploy.outcome == 'success' && steps.verify.outcome == 'failure'
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          TQ_OUTING_BACKUP_PATH: /tmp/outing-v8-backup.json
        run: |
          set -euo pipefail
          python category-hubs/outing-v3/live_backup.py rollback
          exit 1
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outing-v8-standalone-hero-audit
          path: |
            /tmp/outing-v8-result.json
            /tmp/outing-v8-deploy.log
            /tmp/outing-v8-render.json
            /tmp/outing-v8-render.log
          if-no-files-found: warn
