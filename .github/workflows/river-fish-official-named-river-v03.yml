name: Official direct river fish extraction v03 (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'river-fish/research-20261021/extract_official_named_river_fish_v03.py'
      - 'river-fish/research-20261021/test_official_named_river_fish_v03.py'
      - 'river-fish/research-20261021/build_official_atlas_candidates_v03.py'
      - 'river-fish/research-20261021/test_official_atlas_candidates_v03.py'
      - '.github/workflows/river-fish-official-named-river-v03.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-direct-river-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline fail-closed source extraction tests
        run: |
          python -m unittest discover -s river-fish/research-20261021 -p 'test_official_named_river_fish_v03.py' -v
          python -m unittest discover -s river-fish/research-20261021 -p 'test_official_atlas_candidates_v03.py' -v
      - name: Extract pinned original China-region river/fish source (no site writes)
        run: python river-fish/research-20261021/extract_official_named_river_fish_v03.py --out "$RUNNER_TEMP/direct-named-river-fish-v03"
      - name: Compare with known official source inventory and forbid site-ready output
        run: |
          python - <<'PY'
          import csv, json, pathlib, os
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"direct-named-river-fish-v03"
          m=json.loads((root/"direct_named_river_fish_summary_v03.json").read_text())
          with (root/"direct_named_river_fish_review_v03.csv").open(encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          assert m["counts"]["source_rows"]==42143, "Official workbook changed"
          assert m["aggregated_records"]==len(rows)
          assert 0<m["river_name_groups"]<=42143
          assert 0<m["watershed_groups"]<=13
          assert m["source_sha256"]=="1fd6a7201f3100164bc9921002b2723c04a9b6d1f55e0e773b957f6d97205f4e"
          assert m["prefecture"] is None and m["national_river_code"] is None
          assert m["status"]=="STAGED_REVIEW_ONLY_NOT_FOR_PUBLICATION"
          assert set(rows[0])=={"region","watershed","river_name","survey_year","recorded_name","source_url","source_sha256","review_status"}
          assert all(r["review_status"]=="unapproved_requires_conservation_and_identity_review" for r in rows)
          assert all(r["source_sha256"]==m["source_sha256"] for r in rows)
          print("OFFICIAL_DIRECT_RIVER_V03_VALIDATED", json.dumps({
              "source_rows":m["counts"]["source_rows"],
              "named_river_fish_year_records":m["aggregated_records"],
              "river_groups":m["river_name_groups"],
              "watersheds":m["watershed_groups"],
              "fish_labels":m["fish_name_labels"],
              "site_updated":False},ensure_ascii=False))
          PY
      - name: Compare direct river names against current atlas (GET only)
        run: python river-fish/research-20261021/build_official_atlas_candidates_v03.py --source-csv "$RUNNER_TEMP/direct-named-river-fish-v03/direct_named_river_fish_review_v03.csv" --out "$RUNNER_TEMP/direct-named-river-fish-v03/atlas_direct_river_review_v03.json"
      - uses: actions/upload-artifact@v4
        with:
          name: official-direct-named-river-fish-v03-review-only
          path: ${{ runner.temp }}/direct-named-river-fish-v03
          retention-days: 30
