name: Finalize Karato Market three fixes once

on:
  push:
    branches: [main]
    paths:
      - scripts/finalize_karato_three_fixes_20260909.py
      - .github/workflows/finalize-karato-three-fixes-20260909.yml

permissions:
  contents: read
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only the agreed three 唐戸市場 fixes and verify
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile scripts/finalize_karato_three_fixes_20260909.py
          python scripts/finalize_karato_three_fixes_20260909.py > /tmp/result.md
          cat /tmp/result.md
          gh issue comment 22 --repo "${{ github.repository }}" --body-file /tmp/result.md
