name: Audit 3104 affiliate 20260915

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit_3104_affiliate_20260915.py'
      - '.github/workflows/audit-3104-affiliate-20260915.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile scripts/audit_3104_affiliate_20260915.py
      - name: Audit WordPress read-only
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/audit_3104_affiliate_20260915.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-3104-affiliate-20260915-${{ github.run_id }}
          path: reports/3104-affiliate-audit-20260915/
          if-no-files-found: warn
      - name: Comment audit summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f reports/3104-affiliate-audit-20260915/summary.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file reports/3104-affiliate-audit-20260915/summary.md
          fi
