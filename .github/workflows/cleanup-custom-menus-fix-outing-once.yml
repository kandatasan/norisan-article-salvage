name: Cleanup custom menus and fix outing desktop
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-custom-menus-fix-outing-once.yml']
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Remove all synced custom nav references
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python sitewide-nav/deploy.py rollback-all
      - name: Remove top custom nav and fix outing desktop cards
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python maintenance/cleanup_custom_menus_fix_outing.py
      - name: Verify no synced nav refs remain
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import base64,json,os,urllib.parse,urllib.request
          base='https://tsurikue.com/wp-json/wp/v2'
          tok=base64.b64encode(f"{os.environ['TSURIKUE_WP_USER']}:{os.environ['TSURIKUE_WP_APP_PASSWORD']}".encode()).decode()
          h={'Authorization':'Basic '+tok,'Accept':'application/json','User-Agent':'tsurikue-nav-cleanup-verify/1.0'}
          def get(path):
              r=urllib.request.Request(base+path,headers=h)
              with urllib.request.urlopen(r,timeout=45) as x:return json.loads(x.read().decode())
          bad=[]
          for kind in ('posts','pages'):
              for status in ('publish','draft'):
                  page=1
                  while True:
                      q=urllib.parse.urlencode({'context':'edit','status':status,'per_page':100,'page':page,'_fields':'id,slug,content'})
                      try: items=get('/'+kind+'?'+q)
                      except Exception:
                          if page>1: break
                          raise
                      for item in items:
                          c=((item.get('content') or {}).get('raw') or '')
                          if 'tq-global-site-nav-ref:v1 start' in c: bad.append((kind,item['id'],item.get('slug')))
                      if len(items)<100: break
                      page+=1
          if bad: raise SystemExit('CUSTOM_NAV_REFS_REMAIN '+repr(bad[:20]))
          print('NO_CUSTOM_NAV_REFS_REMAIN')
          PY
      - name: Success
        run: echo 'CUSTOM_MENUS_REMOVED_AND_OUTING_PC_FIX_APPLIED'