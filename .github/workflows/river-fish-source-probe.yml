name: River fish official source inspection

on:
  pull_request:
    paths:
      - '.github/workflows/river-fish-source-probe.yml'
      - 'river-fish/inspect_official_zip.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect publicly available NILIM data index (no imports)
        run: python river-fish/inspect_official_index.py
      - name: Inspect ZIP contents and public CSV headers (no record-level locations)
        run: python river-fish/inspect_official_zip.py
