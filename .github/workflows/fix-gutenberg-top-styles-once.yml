name: Move family above hero and center Gutenberg top

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gutenberg-top-styles-once.yml'

permissions:
  contents: write

jobs:
  center-and-move-family:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update verified top page only
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.parse, urllib.request

          PAGE_ID=2983
          MARKER='<!-- tsurikue-experimental-page:v1:top-design-lab -->'
          FIX_TAG='/* GUTENBERG CENTER + FAMILY TOP FIX v1 */'
          HERO_URL='https://tsurikue.com/wp-content/uploads/2026/05/img_4588.jpg'

          user=os.environ['TSURIKUE_WP_USER']
          pw=os.environ['TSURIKUE_WP_APP_PASSWORD']
          token=base64.b64encode(f'{user}:{pw}'.encode()).decode()
          headers={
              'Authorization':'Basic '+token,
              'Accept':'application/json',
              'Content-Type':'application/json; charset=utf-8',
              'User-Agent':'tsurikue-center-family/1.6',
          }

          def get_page():
              q=urllib.parse.urlencode({'context':'edit','_fields':'id,slug,status,title,content'})
              req=urllib.request.Request(f'https://tsurikue.com/wp-json/wp/v2/pages/{PAGE_ID}?{q}',headers=headers)
              with urllib.request.urlopen(req,timeout=45) as r:
                  return json.loads(r.read().decode())

          def raw_content(page):
              return (page.get('content') or {}).get('raw') or ''

          page=get_page()
          original=raw_content(page)
          original_status=page.get('status')
          if page.get('id') != PAGE_ID or original_status not in ('draft','publish'):
              raise SystemExit('BLOCKED_WRONG_PAGE_STATE')
          if MARKER not in original:
              raise SystemExit('BLOCKED_MARKER_MISSING')
          if original.count('<!-- wp:cover') < 5 or original.count('<!-- wp:group') < 20:
              raise SystemExit('BLOCKED_NOT_GUTENBERG_VERSION')
          if '休日、<br>なにして遊ぶ？' not in original or 'ラーメン・ご当地グルメ' not in original:
              raise SystemExit('BLOCKED_EXPECTED_TOP_CONTENT_MISSING')
          if FIX_TAG in original:
              raise SystemExit('BLOCKED_FIX_ALREADY_PRESENT')

          media_pos=original.find('"id":2992')
          if media_pos < 0:
              media_pos=original.find('wp-image-2992')
          if media_pos < 0:
              raise SystemExit('BLOCKED_MEDIA_2992_MISSING')

          family_start=original.rfind('<!-- wp:group ',0,media_pos)
          if family_start < 0:
              raise SystemExit('BLOCKED_FAMILY_GROUP_START_MISSING')
          family_open_end=original.find('-->',family_start)
          if family_open_end < 0 or 'tq4-party' not in original[family_start:family_open_end+3]:
              raise SystemExit('BLOCKED_FAMILY_GROUP_CLASS_MISSING')
          family_end_marker='<!-- /wp:group -->'
          family_end=original.find(family_end_marker,media_pos)
          if family_end < 0:
              raise SystemExit('BLOCKED_FAMILY_GROUP_END_MISSING')
          family_end += len(family_end_marker)
          family=original[family_start:family_end]
          if '2992' not in family or 'tq4-party-image' not in family:
              raise SystemExit('BLOCKED_FAMILY_BLOCK_MISMATCH')

          hero_comment_start=original.rfind('<!-- wp:cover ',0,original.find(HERO_URL)+1)
          if hero_comment_start < 0 or HERO_URL not in original[hero_comment_start:original.find('-->',hero_comment_start)+3]:
              raise SystemExit('BLOCKED_HERO_START_MISSING')
          if family_start < hero_comment_start:
              raise SystemExit('BLOCKED_FAMILY_ALREADY_ABOVE_HERO')

          content=original[:family_start] + original[family_end:]
          hero_after_remove=content.rfind('<!-- wp:cover ',0,content.find(HERO_URL)+1)
          if hero_after_remove < 0:
              raise SystemExit('BLOCKED_HERO_RELOCATE_POINT_MISSING')
          content=content[:hero_after_remove] + family + '\n\n' + content[hero_after_remove:]

          css='\n'.join([
              '',
              '/* GUTENBERG CENTER + FAMILY TOP FIX v1 */',
              '.tq4{width:100%!important;max-width:none!important;margin-left:auto!important;margin-right:auto!important;box-sizing:border-box!important}',
              'body.page-id-2983 .post_content>.tq4,body.page-id-2983 .post_content>.wp-block-group.tq4{margin-left:auto!important;margin-right:auto!important}',
              '.tq4>.alignfull,.tq4>.wp-block-cover.alignfull,.tq4>.wp-block-group.alignfull{width:100%!important;max-width:none!important;margin-left:auto!important;margin-right:auto!important}',
              '.tq4 .tq4-party{padding:12px 0 8px!important;background:#fff!important;border-bottom:0!important}',
              '.tq4 .tq4-party>.wp-block-group__inner-container{width:min(1080px,91vw)!important;margin-left:auto!important;margin-right:auto!important}',
              '.tq4 .tq4-party-image{width:100%!important;max-width:560px!important;margin:0 auto!important}',
              '.tq4 .tq4-party-image img{display:block!important;width:100%!important;max-width:560px!important;max-height:180px!important;height:auto!important;object-fit:contain!important;margin:0 auto!important}',
              '.tq4 .tq4-hero-inner,.tq4 .tq4-section>.wp-block-group__inner-container,.tq4 .tq4-final>.wp-block-group__inner-container,.tq4 .tq4-wrap{width:min(1080px,91vw)!important;margin-left:auto!important;margin-right:auto!important}',
              '@media(max-width:560px){.tq4 .tq4-party{padding:8px 0 4px!important}.tq4 .tq4-party-image{max-width:360px!important}.tq4 .tq4-party-image img{max-width:360px!important;max-height:132px!important}}',
              '',
          ])
          if '</style>' not in content:
              raise SystemExit('BLOCKED_STYLE_END_MISSING')
          content=content.replace('</style>',css+'</style>',1)

          latest=get_page()
          latest_content=raw_content(latest)
          if latest.get('status') != original_status or hashlib.sha256(latest_content.encode()).hexdigest() != hashlib.sha256(original.encode()).hexdigest():
              raise SystemExit('BLOCKED_PAGE_CHANGED_DURING_RUN')

          payload=json.dumps({'content':content},ensure_ascii=False).encode('utf-8')
          req=urllib.request.Request(f'https://tsurikue.com/wp-json/wp/v2/pages/{PAGE_ID}',data=payload,headers=headers,method='POST')
          with urllib.request.urlopen(req,timeout=45) as r:
              json.loads(r.read().decode())

          after=get_page()
          after_content=raw_content(after)
          if after.get('status') != original_status:
              raise SystemExit('VERIFY_STATUS_CHANGED')
          if FIX_TAG not in after_content:
              raise SystemExit('VERIFY_FIX_MISSING')
          after_media=after_content.find('"id":2992')
          if after_media < 0:
              after_media=after_content.find('wp-image-2992')
          after_hero=after_content.find(HERO_URL)
          if after_media < 0 or after_hero < 0 or after_media > after_hero:
              raise SystemExit('VERIFY_FAMILY_NOT_ABOVE_HERO')
          if MARKER not in after_content:
              raise SystemExit('VERIFY_MARKER_MISSING')

          pathlib.Path('experimental-pages/top-design-lab/content.html').write_text(after_content,encoding='utf-8')
          cfg_path=pathlib.Path('experimental-pages/top-design-lab/config.json')
          cfg=json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['expected_current_content_sha256']=hashlib.sha256(after_content.encode()).hexdigest()
          cfg_path.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('SUCCESS_CENTER_AND_FAMILY_TOP')
          print('slug='+str(after.get('slug')))
          print('status='+str(after.get('status')))
          print('family_media_pos='+str(after_media))
          print('hero_pos='+str(after_hero))
          print('content_sha256='+cfg['expected_current_content_sha256'])
          PY
      - name: Commit synchronized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experimental-pages/top-design-lab/content.html experimental-pages/top-design-lab/config.json
          if git diff --cached --quiet; then
            echo 'No source diff to commit.'
            exit 0
          fi
          git commit -m 'Move family above hero and center Gutenberg top'
          git push origin HEAD:main
