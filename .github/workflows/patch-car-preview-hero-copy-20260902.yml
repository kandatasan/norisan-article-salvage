name: Patch car preview hero copy 20260902
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-car-preview-hero-copy-20260902.yml']
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch draft 3350 hero copy only
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          BASE='https://tsurikue.com/wp-json/wp/v2'
          PREVIEW=3350
          LIVE=3294
          tok=base64.b64encode(f"{os.environ['TSURIKUE_WP_USER']}:{os.environ['TSURIKUE_WP_APP_PASSWORD']}".encode()).decode()
          H={'Authorization':'Basic '+tok,'Accept':'application/json','Content-Type':'application/json; charset=utf-8','User-Agent':'tsurikue-car-hero-copy-patch/1.0'}
          def req(method,path,data=None):
              body=None if data is None else json.dumps(data,ensure_ascii=False).encode()
              r=urllib.request.Request(BASE+path,data=body,headers=H,method=method)
              with urllib.request.urlopen(r,timeout=50) as x:
                  raw=x.read().decode(); return (json.loads(raw) if raw else None),dict(x.headers)
          def get(path): return req('GET',path)[0]
          def post(path,data): return req('POST',path,data)[0]
          def raw(p): return ((p.get('content') or {}).get('raw') or '')
          def sha(s): return hashlib.sha256(s.encode()).hexdigest()
          def count(kind):
              _,h=req('GET',f'/{kind}?status=publish&per_page=1&_fields=id'); return int(h.get('X-WP-Total','0'))
          public_before={'posts':count('posts'),'pages':count('pages')}
          live_before=get(f'/pages/{LIVE}?context=edit&_fields=id,slug,status,content')
          live_sha=sha(raw(live_before))
          if (live_before['slug'],live_before['status'])!=('car-guide','publish'): raise SystemExit('LIVE_IDENTITY_FAILED')
          p=get(f'/pages/{PREVIEW}?context=edit&_fields=id,slug,status,title,content')
          if (p['slug'],p['status'])!=('car-guide-v2-preview','draft'): raise SystemExit('PREVIEW_IDENTITY_FAILED')
          s=raw(p)
          if 'tsurikue-category-hub:v3:car-current-improved' not in s: raise SystemExit('MARKER_MISSING')
          old_lead='<p class="tq-hero-lead">レクサスUXを買って、1万km以上走って、最後は売却。<br>買う前に気になることから、乗って初めて分かったことまで、元オーナー目線でまとめています。</p>'
          old_note='<p class="tq-hero-note">カタログより、実際に使った話を。</p>'
          new_lead='<p class="tq-hero-lead">海まで走る。山へ行く。<br>目的もなく、ちょっと遠回りする。<br><br>クルマがあると、休日の遊べる範囲はけっこう広がる。</p>'
          new_note='<p class="tq-hero-note">ここでは、1万km以上いっしょに走ったレクサスUXを中心に、買って、乗って、遊んで、最後に手放すまでの話を残しています。</p>'
          if old_lead in s and old_note in s:
              s=s.replace(old_lead,new_lead,1).replace(old_note,new_note,1)
              post(f'/pages/{PREVIEW}',{'content':s,'status':'draft'})
          elif new_lead in s and new_note in s:
              pass
          else:
              raise SystemExit('EXPECTED_COPY_NOT_FOUND')
          p2=get(f'/pages/{PREVIEW}?context=edit&_fields=id,slug,status,content')
          s2=raw(p2)
          checks={
              'draft':p2['status']=='draft',
              'hero_title':'クルマで、<br>どこまで行こう。' in s2,
              'sea_mountain':'海まで走る。山へ行く。' in s2,
              'detour':'目的もなく、ちょっと遠回りする。' in s2,
              'holiday':'休日の遊べる範囲はけっこう広がる。' in s2,
              'ux_bridge':'1万km以上いっしょに走ったレクサスUXを中心に' in s2,
              'old_lead_gone':'レクサスUXを買って、1万km以上走って、最後は売却。' not in s2,
              'old_note_gone':'カタログより、実際に使った話を。' not in s2,
              'no_fj':'ランドクルーザーFJ' not in s2,
          }
          if not all(checks.values()): raise SystemExit('VERIFY_FAILED '+json.dumps(checks,ensure_ascii=False))
          live_after=get(f'/pages/{LIVE}?context=edit&_fields=id,slug,status,content')
          if sha(raw(live_after))!=live_sha: raise SystemExit('LIVE_PAGE_CHANGED')
          public_after={'posts':count('posts'),'pages':count('pages')}
          if public_before!=public_after: raise SystemExit('PUBLIC_COUNTS_CHANGED')
          print(json.dumps({'ok':True,'preview':PREVIEW,'status':p2['status'],'checks':checks,'live_unchanged':True,'public_before':public_before,'public_after':public_after},ensure_ascii=False))
          PY
