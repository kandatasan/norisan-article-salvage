name: Verify live LBX link state once

on:
  push:
    branches: [main]
    paths:
      - scripts/verify_live_lbx_links_state_20260928.py
      - .github/workflows/verify-live-lbx-links-state-20260928.yml

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify live WordPress state
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile scripts/verify_live_lbx_links_state_20260928.py
          python scripts/verify_live_lbx_links_state_20260928.py > /tmp/state.md
          cat /tmp/state.md
          gh issue comment 561 --repo "${{ github.repository }}" --body-file /tmp/state.md
