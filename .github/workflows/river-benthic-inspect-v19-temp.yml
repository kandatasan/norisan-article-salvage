name: TEMP inspect official nationwide benthic source schema

on:
  push:
    branches: [feat/national-benthic-survey-v19-20261018]
    paths: [.github/workflows/river-benthic-inspect-v19-temp.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect source links and one region sheet headers, no locations or station metadata
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          import hashlib,json,io,re
          from zipfile import ZipFile
          from inspect_nationwide_source_v06 import sheet_header
          page='https://www.nilim.go.jp/lab/fbg/ksnkankyo/dl_00_index.html'
          class P(HTMLParser):
              def __init__(self):super().__init__();self.urls=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':
                      href=dict(attrs).get('href')
                      if href:self.urls.append(urljoin(page,href))
          with urlopen(Request(page,headers={'User-Agent':'TsurikueOfficialAudit/1.0'}),timeout=80) as r: body=r.read(600000)
          x=P();x.feed(body.decode('utf-8','replace'))
          urls=sorted(u for u in x.urls if any(u.endswith('RT8'+str(n)+'_B02.zip') for n in range(1,10)))
          print('BENTHIC_URLS',json.dumps(urls,ensure_ascii=False))
          if len(urls)!=9:raise ValueError('Expected 9 bottom-animal official downloadable archives')
          target=next(u for u in urls if 'RT87_B02.zip' in u)
          with urlopen(Request(target,headers={'User-Agent':'TsurikueOfficialAudit/1.0'}),timeout=120) as r: data=r.read(150000001)
          if len(data)>150000000:raise ValueError('archive over cap')
          z=ZipFile(io.BytesIO(data));files=[(o.filename,o.file_size) for o in z.infolist() if not o.is_dir()]
          print('CHUGOKU_ARCHIVE',len(data),hashlib.sha256(data).hexdigest(),json.dumps(files,ensure_ascii=False))
          xlsx=[x for x in z.namelist() if x.lower().endswith('.xlsx')]
          if len(xlsx)!=1:raise ValueError('Unexpected Excel member count')
          header=sheet_header(z.read(xlsx[0]))
          print('CHUGOKU_HEADERS',json.dumps(header,ensure_ascii=False))
          print('CHUGOKU_MEMBER',xlsx[0])
          PY
        working-directory: river-fish
