name: Audit Tottori prefecture detailed river lists (3 PDFs)

on:
  pull_request:
    paths:
      - 'river-fish/import_tottori_river_pdfs_v11.py'
      - 'river-fish/test_tottori_river_pdfs_v11.py'
      - '.github/workflows/river-fish-tottori-pdf-stage-v11.yml'
permissions:
  contents: write
jobs:
  river-list-extract:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/tottori-river-pdf-inventory-v11-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pdf text extractor (no OCR)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftotext -v
      - name: Test source date, class, serial and no-species safeguards
        run: python -m unittest discover -s river-fish -p 'test_tottori_river_pdfs_v11.py' -v
      - name: Download 3 official PDF lists and stage names only
        run: python river-fish/import_tottori_river_pdfs_v11.py --out river-fish/tottori-pdf-staged
      - name: Validate staging is research-only
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('river-fish/tottori-pdf-staged')
          m=json.loads((root/'tottori_river_pdf_manifest_v11.json').read_text())
          with (root/'tottori_river_pdf_mentions_v11.csv').open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==m['pdf_text_source_mention_rows']>=220
          assert len({r['document_mention_id'] for r in rows})==len(rows)
          assert set(r['district_as_published'] for r in rows)=={'東部圏域','中部圏域','西部圏域'}
          assert set(r['river_class_page_heading'] for r in rows)=={'一級河川','二級河川','準用河川'}
          assert all(r['ten_digit_code_status']=='unlinked' and r['specific_river_ecology_status']=='not_examined' for r in rows)
          assert all(r['text_extraction_review_status']=='pdf_text_machine_extracted_requires_visual_review' for r in rows)
          assert all(r['website_publication_status']=='research_only' for r in rows)
          assert m['no_geolocation_or_species_inferred'] and m['all_codes_unlinked']
          print('TOTTORI_SOURCE_RECORDS',len(rows),'LABELS',m['distinct_printed_name_labels'])
          for region,info in sorted(m['districts'].items()):
              print('SOURCE_REGION',region,'ROWS',info['records'],'TYPE_COUNTS',info['category_counts'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tottori-2023-river-list-names-v11
          path: river-fish/tottori-pdf-staged/
          retention-days: 30
          if-no-files-found: error
      - name: Commit only sanitized research CSV/manifest to PR branch
        env:
          PR_HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add river-fish/tottori-pdf-staged/
          if git diff --staged --quiet; then
            echo 'No change to extracted data'
          else
            git commit -m 'Stage 2023 Tottori three-district river-list names for visual review'
            git fetch origin "$PR_HEAD"
            git rebase FETCH_HEAD
            git push origin "HEAD:refs/heads/$PR_HEAD"
          fi
