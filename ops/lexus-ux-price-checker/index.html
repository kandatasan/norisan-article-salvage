<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>レクサスUX 中古相場チェックツール｜つりくえ！</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#21333e;background:#fff;font-size:14px}
*{box-sizing:border-box}body{margin:0}
main{max-width:560px;margin:auto;padding:8px}
.ux{border:1px solid #d9e1e5;border-radius:13px;padding:16px;background:#fff}
.ux h1{font-size:17px;line-height:1.4;margin:0 0 3px}
.intro{font-size:11px;color:#60747f;margin:0 0 16px}
.field{margin:0 0 14px}
.label-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
label{font-size:13px;font-weight:750;color:#344d5b}
.value{font-size:14px;font-weight:800;color:#244e66;font-variant-numeric:tabular-nums}
select{width:100%;height:44px;padding:0 10px;font-size:14px;color:#21333e;background:#fff;border:1px solid #cbd8df;border-radius:8px}
input[type=range]{display:block;width:100%;height:28px;margin:0;accent-color:#315c74;cursor:pointer;touch-action:pan-y}
.range-ends{display:flex;justify-content:space-between;color:#718692;font-size:10px;margin-top:-1px}
select:focus-visible,input:focus-visible{outline:3px solid #a5c9dc;outline-offset:2px}
.result{margin:17px 0 0;padding:13px 14px;background:#f0f5f7;border-radius:11px}
.kicker{font-size:11px;color:#516d7b;font-weight:700;margin:0 0 8px}
.market{padding:9px 0}
.market+.market{border-top:1px solid #d6e2e8}
.market-title{font-size:12px;font-weight:800;color:#355567;margin:0}
.market-title small{font-size:10px;font-weight:500;color:#6d818c}
.amount{font-size:24px;font-weight:850;letter-spacing:-.035em;line-height:1.35;margin:1px 0;color:#203f52;font-variant-numeric:tabular-nums}
.detail{font-size:10.5px;line-height:1.5;color:#5c7280;margin:0}
.note{font-size:10.5px;line-height:1.6;color:#70828e;margin:10px 1px 0}
@media(max-width:340px){.ux{padding:12px}.amount{font-size:22px}}
</style>
</head>
<body>
<main><section class="ux" aria-label="レクサスUX中古車のざっくり価格チェック">
<h1>レクサスUX 中古相場チェックツール</h1>
<p class="intro">※価格は参考程度です。</p>
<div class="field">
<label for="grade">グレード</label>
<select id="grade" aria-label="UXのモデルとグレード"></select>
</div>
<div class="field">
<div class="label-row"><label for="year">年式</label><output class="value" id="yearValue" for="year">2021年</output></div>
<input type="range" id="year" min="2018" max="2023" step="1" value="2021">
<div class="range-ends"><span id="yearMin">2018年</span><span id="yearMax">2023年</span></div>
</div>
<div class="field">
<div class="label-row"><label for="km">走行距離</label><output class="value" id="kmValue" for="km">3万km</output></div>
<input type="range" id="km" min="0" max="150000" step="10000" value="30000">
<div class="range-ends"><span>0km</span><span>15万km</span></div>
</div>
<div class="result" role="status" aria-live="polite">
<p class="kicker">ざっくり購入価格（支払総額の目安）</p>
<div class="market">
<p class="market-title">一般中古車</p>
<p class="amount" id="general-price">価格を読み込み中</p>
<p class="detail" id="general-note">一般中古車の掲載例から計算します。</p>
</div>
<div class="market">
<p class="market-title">レクサスCPO <small>認定中古車</small></p>
<p class="amount" id="cpo-price">価格を読み込み中</p>
<p class="detail" id="cpo-note">CPOの掲載例から計算します。</p>
</div>
</div>
<p class="note" id="price-note">年式・走行距離は簡易計算。装備、修復歴、保証などで価格は変わります。購入前に実際の掲載価格を確認してください。</p>
</section></main>
<script>
(()=>{'use strict';
const models=[
 ['200','UX200',2018,[['base','標準仕様',2018],['c','version C',2018],['fs','F SPORT',2018],['l','version L',2018],['blue','Blue Edition',2020],['urban','Urban Elegance',2020],['style-blue','F SPORT Style Blue',2021],['emotional','F SPORT Emotional Explorer',2022],['graceful','Graceful Explorer',2022]]],
 ['250h','UX250h',2018,[['base','標準仕様',2018],['c','version C',2018],['fs','F SPORT',2018],['l','version L',2018],['brown','Brown Edition',2020],['urban','Urban Elegance',2020],['style-blue','F SPORT Style Blue',2021],['elegant','Elegant Black',2021],['emotional','F SPORT Emotional Explorer',2022],['graceful','Graceful Explorer',2022]]],
 ['300h','UX300h',2024,[['base','標準仕様',2024],['c','version C',2024],['fs','F SPORT',2024],['l','version L',2024],['emotional','F SPORT Emotional Explorer',2024],['graceful','Graceful Explorer',2024],['shining','Shining Essence',2026]]],
 ['300e','UX300e',2020,[['c','version C',2020],['l','version L',2020]]]
];
const $=id=>document.getElementById(id);
const grade=$('grade'),year=$('year'),km=$('km');
let bands=[],sampleDate='',isReady=false;
for(const [model,name,,grades] of models){
  const group=document.createElement('optgroup');group.label=name;
  for(const [id,caption] of grades){
    const opt=document.createElement('option');
    opt.value=model+':'+id;opt.textContent=name+' '+caption;group.append(opt);
  }
  grade.append(group);
}
const params=new URLSearchParams(location.search);
const initGrade=(params.get('model')||'250h')+':'+(params.get('grade')||'c');
grade.value=[...grade.options].some(o=>o.value===initGrade)?initGrade:'250h:c';
year.value=params.get('year')||'2021';
km.value=params.get('mileage')||'30000';
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function syncYear(){
  const [model,id]=grade.value.split(':');
  const m=models.find(m=>m[0]===model);
  const start=m[3].find(g=>g[0]===id)[2];
  const finish=({200:2023,'250h':2023,'300h':2026,'300e':2026})[model];
  year.min=String(start);year.max=String(finish);
  year.value=String(clamp(Number(year.value)||start,start,finish));
  $('yearMin').textContent=start+'年';$('yearMax').textContent=finish+'年';
}
function formatKm(n){return (n===0?'0km':(n/10000)+'万km')}
function labels(){
  $('yearValue').textContent=year.value+'年';
  $('kmValue').textContent=formatKm(Number(km.value));
}
// This is an explicitly rough calculation, not a grade/year/mileage matched listing price.
// Only previously reviewed UX cohorts may anchor a result; never fabricate a listing or trim premium.
function estimate(model,trim,targetYear,targetKm,cohorts,segment){
  const sameMarketModel=cohorts.filter(b=>
    b.market_segment===segment&&b.model===model&&b.grade!=='all'&&b.sample_size>=5
  );
  // No CPO sample for a model => no invented CPO price. Never use general prices as CPO evidence.
  if(!sameMarketModel.length)return null;
  const exact=sameMarketModel.filter(b=>b.grade===trim);
  const pool=exact.length?exact:sameMarketModel;
  const gradeMatched=exact.length>0;
  // Use only published observed bands; trim and mileage shifts are deliberately rough, not appraisals.
  const median=values=>{
    const a=[...values].sort((x,y)=>x-y);
    return a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2;
  };
  const adjusted=pool.map(b=>b.median_man+14*(targetYear-b.year));
  const center=median(adjusted);
  const kmValues=pool.map(b=>(b.observed_km_span[0]+b.observed_km_span[1])/2);
  const referenceKm=median(kmValues);
  const mileageShift=clamp((referenceKm-targetKm)/10000*5,-35,35);
  const spreads=pool.map(b=>(b.upper_man-b.lower_man)/2);
  const nearestYear=Math.min(...pool.map(b=>Math.abs(targetYear-b.year)));
  const halfWidth=Math.min(115,Math.max(35,median(spreads)+18)+(gradeMatched?0:20)+Math.max(0,nearestYear-1)*8);
  const low=Math.max(80,Math.floor((center+mileageShift-halfWidth)/10)*10);
  const high=Math.max(low+20,Math.ceil((center+mileageShift+halfWidth)/10)*10);
  return {low,high,gradeMatched,nearestYear};
}
function render(){
  syncYear();labels();
  if(!isReady)return;
  const [model,trim]=grade.value.split(':');
  const show=(segment,priceId,noteId)=>{
    const res=estimate(model,trim,Number(year.value),Number(km.value),bands,segment);
    if(!res){
      $(priceId).textContent='集計中';
      $(noteId).textContent='このモデルの掲載例が不足しています';
      return;
    }
    $(priceId).textContent='約'+res.low.toLocaleString('ja-JP')+'万〜'+res.high.toLocaleString('ja-JP')+'万円';
    $(noteId).textContent=(res.gradeMatched?'同じグレード':'他グレードも参考')+'の少数掲載例／'+sampleDate+'調査';
  };
  show('general_market','general-price','general-note');
  show('lexus_cpo','cpo-price','cpo-note');
}
grade.addEventListener('change',render);
year.addEventListener('input',render);
km.addEventListener('input',render);
syncYear();labels();
const isLocalTest=['localhost','127.0.0.1'].includes(location.hostname);
fetch('./data/reference_price_bands.json',{cache:'no-store'}).then(r=>{
  if(!r.ok)throw Error('data unavailable');return r.json();
}).then(data=>{
  const checked=new Date(data.updated_at+'T00:00:00+09:00');
  const age=(Date.now()-checked.getTime())/86400000;
  const approved=data.publication_reviewed===true&&data.research_preview_only===false&&data.limited_sample_release===true;
  const localPreview=isLocalTest&&params.get('preview')==='1';
  if((!approved&&!localPreview)||data.price_basis!=='total'||data.market_segment!=='segmented_general_and_cpo'||!Array.isArray(data.cohorts)||!Number.isFinite(age)||age<0||age>60)throw Error('review or freshness gate failed');
  bands=data.cohorts.filter(b=>
    b.grade!=='all'&&Number.isInteger(b.year)&&Number.isInteger(b.sample_size)&&b.sample_size>=5&&
    models.some(m=>m[0]===b.model&&m[3].some(g=>g[0]===b.grade))&&
    Array.isArray(b.observed_km_span)&&b.observed_km_span.length===2&&b.observed_km_span.every(Number.isFinite)&&
    Number.isFinite(b.lower_man)&&Number.isFinite(b.median_man)&&Number.isFinite(b.upper_man)&&
    b.lower_man<=b.median_man&&b.median_man<=b.upper_man&&
    ['general_market','lexus_cpo'].includes(b.market_segment));
  if(!bands.length)throw Error('no verified cohorts');
  sampleDate=data.updated_at;
  isReady=true;
  render();
}).catch(()=>{
  for(const [priceId,noteId] of [['general-price','general-note'],['cpo-price','cpo-note']]){
    $(priceId).textContent='価格データを更新中';
    $(noteId).textContent='実際の掲載価格をご確認ください。';
  }
});
})();
</script>
</body></html>
