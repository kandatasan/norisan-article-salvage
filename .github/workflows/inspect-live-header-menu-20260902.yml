name: Inspect live header menu 20260902

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-live-header-menu-20260902.yml'

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Inspect current WordPress top page and reusable nav refs (GET only)
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee header-wp-audit.json
          import base64, hashlib, json, os, re, urllib.request
          base='https://tsurikue.com/wp-json/wp/v2'
          auth='Basic '+base64.b64encode(f"{os.environ['TSURIKUE_WP_USER']}:{os.environ['TSURIKUE_WP_APP_PASSWORD']}".encode()).decode()
          def get(path):
              r=urllib.request.Request(base+path,headers={'Authorization':auth,'User-Agent':'tsurikue-header-inspect/1.0'})
              with urllib.request.urlopen(r,timeout=45) as x:return json.load(x)
          p=get('/pages/2983?context=edit&_fields=id,slug,status,title,content')
          raw=p['content']['raw']
          blocks=get('/blocks?context=edit&per_page=100&_fields=id,title,status,content')
          nav=[]
          for b in blocks:
              br=(b.get('content') or {}).get('raw','')
              title=(b.get('title') or {}).get('raw','')
              if 'tq-global-site-nav:v1' in br or title=='つりくえ！共通ナビ（自動管理）':
                  nav.append({'id':b['id'],'status':b['status'],'title':title,'sha256':hashlib.sha256(br.encode()).hexdigest(),'has_style':'<style>' in br,'has_tq_site_nav':'tq-site-nav' in br})
          print(json.dumps({
            'page':{'id':p['id'],'slug':p['slug'],'status':p['status'],'sha256':hashlib.sha256(raw.encode()).hexdigest()},
            'top_markers':{
              'header_start':raw.count('TQ HEADER NAV PROTOTYPE v1 START'),
              'header_end':raw.count('TQ HEADER NAV PROTOTYPE v1 END'),
              'drawer_css':raw.count('TQ HEADER DRAWER PROTOTYPE v1'),
              'mobile_quick_css':raw.count('TQ MOBILE QUICK NAV PRIVACY v1'),
              'tq_site_nav':raw.count('tq-site-nav'),
              'global_ref':raw.count('tq-global-site-nav-ref:v1 start')
            },
            'reusable_nav_blocks':nav,
            'wordpress_write_count':0
          },ensure_ascii=False))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Inspect live DOM and computed styles
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/header-inspect.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const out={};
            for (const [label,width,height] of [['mobile',390,1000],['desktop',1440,1000]]) {
              const page=await browser.newPage({viewport:{width,height}});
              await page.goto('https://tsurikue.com/',{waitUntil:'networkidle',timeout:60000});
              await page.waitForTimeout(1000);
              out[label]=await page.evaluate(()=>{
                const info=(sel)=>{
                  const e=document.querySelector(sel); if(!e)return null;
                  const s=getComputedStyle(e),r=e.getBoundingClientRect();
                  return {tag:e.tagName,id:e.id,class:e.className,text:(e.innerText||'').trim().slice(0,500),display:s.display,position:s.position,color:s.color,background:s.backgroundColor,width:Math.round(r.width),height:Math.round(r.height),top:Math.round(r.top),left:Math.round(r.left)};
                };
                const links=(sel)=>{
                  const e=document.querySelector(sel); if(!e)return [];
                  return [...e.querySelectorAll('a')].map(a=>({text:(a.innerText||'').trim(),href:a.getAttribute('href'),display:getComputedStyle(a).display,color:getComputedStyle(a).color,textDecoration:getComputedStyle(a).textDecorationLine}));
                };
                return {
                  bodyClass:document.body.className,
                  header:info('#header'),
                  gnav:info('#gnav'),gnavLinks:links('#gnav'),
                  tqSiteNav:info('.tq-site-nav'),tqSiteNavLinks:links('.tq-site-nav'),
                  tqMenu:info('.tq-site-menu'),
                  customRoot:info('.tq-global-site-nav-root'),
                  headerPrototypeStarts:(document.documentElement.innerHTML.match(/TQ HEADER NAV PROTOTYPE v1 START/g)||[]).length,
                  globalNavRoots:document.querySelectorAll('.tq-global-site-nav-root').length,
                  scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth
                };
              });
              await page.screenshot({path:`header-${label}.png`,fullPage:false});
              await page.close();
            }
            await browser.close();
            console.log(JSON.stringify(out,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/header-inspect.js | tee header-dom-audit.json

      - uses: actions/upload-artifact@v4
        with:
          name: live-header-menu-inspection-20260902
          path: |
            header-wp-audit.json
            header-dom-audit.json
            header-mobile.png
            header-desktop.png

      - name: Log inspection to Issue 22
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Read-only live header inspection — 2026-09-02'
            echo
            echo 'WordPress writes: 0'
            echo
            echo '```json'
            cat header-wp-audit.json
            echo '```'
            echo
            echo '```json'
            cat header-dom-audit.json
            echo '```'
          } >/tmp/header-inspect.md
          gh issue comment 22 --body-file /tmp/header-inspect.md
