name: Final GET-only audit UX resale

on:
  push:
    branches:
      - main
    paths:
      - scripts/audit_ux_resale_current.py
      - .github/workflows/apply-ux-koukai-final-polish.yml

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile GET-only audit
        run: python -m py_compile scripts/audit_ux_resale_current.py
      - name: Run GET-only audit
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/audit_ux_resale_current.py
      - name: Record audit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### ux-resale final GET-only audit'
            echo
            if [ -f reports/ux-resale-current-audit/summary.md ]; then
              cat reports/ux-resale-current-audit/summary.md
            else
              echo '- result: **BLOCKED**'
              echo '- wordpress_write_count: **0**'
            fi
          } > /tmp/comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-resale-final-get-only-audit
          path: reports/ux-resale-current-audit/
          if-no-files-found: warn
