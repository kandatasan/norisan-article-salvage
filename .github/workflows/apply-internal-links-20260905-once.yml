name: Apply internal links 2026-09-05 once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_internal_links_20260905_once.py'
      - '.github/workflows/apply-internal-links-20260905-once.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Syntax check
        run: python -m py_compile scripts/apply_internal_links_20260905_once.py
      - name: Apply guarded internal-link cleanup
        id: apply
        continue-on-error: true
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/apply_internal_links_20260905_once.py
      - name: Record result on audit issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Internal-link cleanup 2026-09-05'
            echo
            if [[ -f reports/internal-links-20260905/summary.md ]]; then
              cat reports/internal-links-20260905/summary.md
            else
              echo 'No summary file was produced.'
            fi
          } > /tmp/comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-links-20260905
          path: reports/internal-links-20260905/
          if-no-files-found: error
      - name: Fail if cleanup blocked
        if: steps.apply.outcome != 'success'
        run: exit 1
