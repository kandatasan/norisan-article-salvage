name: Apply outing v4 hero fix 20260903
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-outing-v4-hero-fix-20260903.yml'
      - 'category-hubs/outing-v4/**'
permissions:
  contents: read
jobs:
  deploy-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('category-hubs/outing-v4/patch_live.py').read_text(encoding='utf-8')
          required=[
            "EXPECTED_SHA='8df6d9b039fba9ad05d5b85851e4b6ef388a527de21adbe7ca3461827318402b'",
            "img_2419.jpg",
            "今日は、<br>どこ行く？",
            "tq-outing-hero-fix:v4:dolphin-centered",
            ".tq-outing-v3.alignfull{",
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('OUTING_V4_SOURCE_MISSING='+repr(missing))
          print('OUTING_V4_SOURCE_OK')
          PY
      - name: Backup published outing page
        id: backup
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          TQ_OUTING_BACKUP_PATH: /tmp/outing-v4-live-backup.json
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4; do
            if python category-hubs/outing-v3/live_backup.py backup; then ok=1; break; fi
            echo "Backup attempt ${attempt}/4 failed; retrying..." >&2
            sleep $((attempt * 5))
          done
          test "$ok" -eq 1
      - name: Apply dolphin hero, centered layout, and forced heading
        id: deploy
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          TQ_OUTING_V4_RESULT_PATH: /tmp/outing-v4-result.json
        run: |
          set -euo pipefail
          python category-hubs/outing-v4/patch_live.py | tee /tmp/outing-v4-deploy.log
      - name: Install render audit dependencies
        if: steps.deploy.outcome == 'success'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet selenium
      - name: Verify desktop and mobile
        id: verify
        if: steps.deploy.outcome == 'success'
        run: |
          set -euo pipefail
          python category-hubs/outing-v4/verify_render.py | tee /tmp/outing-v4-render.log
      - name: Roll back if render audit fails
        if: failure() && steps.deploy.outcome == 'success' && steps.verify.outcome == 'failure'
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          TQ_OUTING_BACKUP_PATH: /tmp/outing-v4-live-backup.json
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            if python category-hubs/outing-v3/live_backup.py rollback; then ok=1; break; fi
            sleep $((attempt * 5))
          done
          test "$ok" -eq 1
          echo 'Outing v4 render audit failed; published page restored.' >&2
          exit 1
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outing-v4-hero-fix-audit
          path: |
            /tmp/outing-v4-result.json
            /tmp/outing-v4-deploy.log
            /tmp/outing-v4-render.log
            outing-v4-render.json
            outing-v4-desktop.png
            outing-v4-mobile.png
          if-no-files-found: warn
