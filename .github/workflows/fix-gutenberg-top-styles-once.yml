name: Measure mobile top layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gutenberg-top-styles-once.yml'

permissions:
  contents: read

jobs:
  measure-mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Measure live page at iPhone width
        shell: bash
        run: |
          cat > /tmp/measure.js <<'JS'
          const { chromium } = require('playwright');
          (async() => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}, deviceScaleFactor:1});
            await page.goto('https://tsurikue.com/', {waitUntil:'networkidle', timeout:90000});
            await page.waitForTimeout(1500);
            const data = await page.evaluate(() => {
              const sels = [
                'html','body','.l-content','.l-container','.l-mainContent','.l-mainContent__inner',
                '.post_content','.post_content>.tq4','.post_content>.wp-block-group.tq4',
                '.tq4','.tq4-party','.tq4-hero','.tq4-cats'
              ];
              const out = {innerWidth:window.innerWidth, docClientWidth:document.documentElement.clientWidth, scrollWidth:document.documentElement.scrollWidth};
              out.rects = {};
              for (const s of sels) {
                const el = document.querySelector(s);
                if (!el) { out.rects[s] = null; continue; }
                const r = el.getBoundingClientRect();
                const cs = getComputedStyle(el);
                out.rects[s] = {
                  left:+r.left.toFixed(2), right:+r.right.toFixed(2), width:+r.width.toFixed(2),
                  marginLeft:cs.marginLeft, marginRight:cs.marginRight,
                  paddingLeft:cs.paddingLeft, paddingRight:cs.paddingRight,
                  maxWidth:cs.maxWidth, position:cs.position, transform:cs.transform,
                  overflowX:cs.overflowX
                };
              }
              const all = [...document.querySelectorAll('body *')].map(el => {
                const r=el.getBoundingClientRect();
                return {tag:el.tagName, cls:(el.className||'').toString().slice(0,160), left:r.left, right:r.right, width:r.width};
              }).filter(x => x.width>0 && (x.left < -1 || x.right > window.innerWidth+1)).sort((a,b)=>Math.max(Math.abs(b.left),Math.abs(b.right-window.innerWidth))-Math.max(Math.abs(a.left),Math.abs(a.right-window.innerWidth))).slice(0,20);
              out.overflowers = all;
              return out;
            });
            console.log('---MOBILE_LAYOUT_MEASURE---');
            console.log(JSON.stringify(data,null,2));
            console.log('---END_MOBILE_LAYOUT_MEASURE---');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          node /tmp/measure.js
