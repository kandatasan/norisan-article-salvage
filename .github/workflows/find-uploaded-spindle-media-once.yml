name: Find uploaded spindle media once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/find_uploaded_spindle_media_once.py'
      - '.github/workflows/find-uploaded-spindle-media-once.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Syntax check
        run: python -m py_compile scripts/find_uploaded_spindle_media_once.py
      - name: Read-only WordPress media lookup
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/find_uploaded_spindle_media_once.py
      - name: Record result on issue 22
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file reports/spindle-media-filename-lookup/summary.md
      - name: Upload lookup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spindle-media-filename-lookup
          path: reports/spindle-media-filename-lookup/
          if-no-files-found: warn
