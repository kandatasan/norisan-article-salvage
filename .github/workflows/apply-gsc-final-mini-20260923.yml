name: Apply GSC final mini rewrite 20260923

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_gsc_final_mini_20260923.py
      - .github/workflows/apply-gsc-final-mini-20260923.yml

permissions:
  contents: read
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile scripts/apply_gsc_final_mini_20260923.py
      - name: Apply guarded final mini rewrite
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: |\n          set -o pipefail\n          python scripts/apply_gsc_final_mini_20260923.py | tee /tmp/summary.md
      - name: Record audit result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### GSC final mini rewrite 2026-09-23'
            echo
            cat /tmp/summary.md 2>/dev/null || echo '- result: **BLOCKED_OR_FAILED_BEFORE_SUMMARY**'
          } > /tmp/comment.md
          gh issue comment 22 --repo "${{ github.repository }}" --body-file /tmp/comment.md
