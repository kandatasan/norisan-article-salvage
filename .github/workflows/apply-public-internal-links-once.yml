name: Apply public internal links once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_public_internal_links_once.py'
      - '.github/workflows/apply-public-internal-links-once.yml'

permissions:
  contents: read
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply exact-hash guarded public internal links
        id: apply
        continue-on-error: true
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/apply_public_internal_links_once.py
      - name: Record result on audit issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Public internal-link optimization'
            echo
            if [[ -f reports/public-internal-links-apply/summary.md ]]; then
              cat reports/public-internal-links-apply/summary.md
            else
              echo 'No summary file was produced.'
            fi
          } > /tmp/comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-internal-links-apply
          path: reports/public-internal-links-apply/
          if-no-files-found: error
      - name: Fail if optimization blocked
        if: steps.apply.outcome != 'success'
        run: exit 1
