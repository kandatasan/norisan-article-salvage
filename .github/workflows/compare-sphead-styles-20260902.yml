name: Compare SWELL mobile header styles 20260902

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compare-sphead-styles-20260902.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Compare computed styles and matching CSS rules
        shell: bash
        run: |
          set -euo pipefail
          cat > sphead-compare.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const sites={tsurikue:'https://tsurikue.com/',security:'https://my-keibi-career.com/'};
            const out={};
            for (const [name,url] of Object.entries(sites)) {
              const page=await browser.newPage({viewport:{width:390,height:1000}});
              await page.goto(url,{waitUntil:'networkidle',timeout:60000});
              await page.waitForTimeout(800);
              out[name]=await page.evaluate(()=>{
                const props=['display','position','width','height','overflow','overflow-x','white-space','flex-direction','justify-content','align-items','gap','padding-top','padding-right','padding-bottom','padding-left','margin-top','margin-right','margin-bottom','margin-left','list-style-type','color','background-color','font-size','line-height','text-align','text-decoration-line','border-top-width','border-bottom-width','border-bottom-color'];
                const snap=(el)=>{
                  if(!el)return null; const s=getComputedStyle(el),r=el.getBoundingClientRect(),o={tag:el.tagName,id:el.id,class:el.className,text:(el.innerText||'').trim().slice(0,120),rect:{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}};
                  for(const p of props)o[p]=s.getPropertyValue(p); return o;
                };
                const root=document.querySelector('.l-header__spNav');
                const ul=document.querySelector('.p-spHeadMenu');
                const li=ul?.querySelector('li');
                const a=li?.querySelector('a');
                const matched=[];
                const walk=(rules,href)=>{for(const rule of rules||[]){try{if(rule.cssRules){walk(rule.cssRules,href)}else if(rule.selectorText && (rule.selectorText.includes('p-spHeadMenu')||rule.selectorText.includes('l-header__spNav'))){matched.push({href,selector:rule.selectorText,css:rule.cssText})}}catch(e){}}};
                for(const sh of [...document.styleSheets]){try{walk(sh.cssRules,sh.href||'inline')}catch(e){}}
                return {root:snap(root),ul:snap(ul),li:snap(li),a:snap(a),matchedRules:matched,stylesheets:[...document.styleSheets].map(x=>x.href||'inline')};
              });
              await page.screenshot({path:`sphead-${name}.png`,fullPage:false});
              await page.close();
            }
            await browser.close();
            console.log(JSON.stringify(out,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node sphead-compare.js | tee sphead-style-diff.json
      - uses: actions/upload-artifact@v4
        with:
          name: sphead-style-diff-20260902
          path: |
            sphead-style-diff.json
            sphead-tsurikue.png
            sphead-security.png
