name: National bottom-animal survey archive QA v1.9

on:
  pull_request:
    paths:
      - 'river-fish/biota/import_national_benthic_v19.py'
      - 'river-fish/biota/audit_aquatic_insect_names_v29.py'
      - 'river-fish/biota/benthic_sources_v19.json'
      - 'river-fish/biota/build_biota_with_benthic_v19.py'
      - 'river-fish/biota/test_benthic_v19.py'
      - 'river-fish/biota/three_axis_search_v20.py'
      - 'river-fish/biota/test_three_axis_v20.py'
      - 'river-fish/biota/compact_search_v22.py'
      - 'river-fish/biota/test_compact_search_v22.py'
      - 'river-fish/biota/build_dataset_v23.py'
      - 'river-fish/biota/dataset_sources_v23.json'
      - 'river-fish/biota/engine_v23.py'
      - 'river-fish/biota/test_dataset_engine_v23.py'
      - 'river-fish/biota/bird_sources_v25.json'
      - 'river-fish/biota/import_national_birds_v25.py'
      - 'river-fish/biota/build_bird_dataset_v25.py'
      - 'river-fish/biota/test_bird_import_v25.py'
      - 'river-fish/biota/plant_sources_v27.json'
      - 'river-fish/biota/import_national_plants_v27.py'
      - 'river-fish/biota/build_four_group_dataset_v27.py'
      - 'river-fish/biota/test_plant_import_v27.py'
      - 'river-fish/wp-plugin/tsurikue-biota-search/**'
      - 'river-fish/build_wp_biota_plugin_v28.py'
      - 'river-fish/test_wp_biota_runtime_v28.php'
      - '.github/workflows/river-benthic-v19.yml'
  push:
    branches: [main]
    paths:
      - 'river-fish/biota/import_national_benthic_v19.py'
      - 'river-fish/biota/audit_aquatic_insect_names_v29.py'
      - 'river-fish/biota/benthic_sources_v19.json'
      - 'river-fish/biota/build_biota_with_benthic_v19.py'
      - 'river-fish/biota/test_benthic_v19.py'
      - 'river-fish/biota/three_axis_search_v20.py'
      - 'river-fish/biota/test_three_axis_v20.py'
      - 'river-fish/biota/compact_search_v22.py'
      - 'river-fish/biota/test_compact_search_v22.py'
      - 'river-fish/biota/build_dataset_v23.py'
      - 'river-fish/biota/dataset_sources_v23.json'
      - 'river-fish/biota/engine_v23.py'
      - 'river-fish/biota/test_dataset_engine_v23.py'
      - 'river-fish/biota/bird_sources_v25.json'
      - 'river-fish/biota/import_national_birds_v25.py'
      - 'river-fish/biota/build_bird_dataset_v25.py'
      - 'river-fish/biota/test_bird_import_v25.py'
      - 'river-fish/biota/plant_sources_v27.json'
      - 'river-fish/biota/import_national_plants_v27.py'
      - 'river-fish/biota/build_four_group_dataset_v27.py'
      - 'river-fish/biota/test_plant_import_v27.py'
      - 'river-fish/wp-plugin/tsurikue-biota-search/**'
      - 'river-fish/build_wp_biota_plugin_v28.py'
      - 'river-fish/test_wp_biota_runtime_v28.php'
      - '.github/workflows/river-benthic-v19.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regional-source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        region: [hokkaido, tohoku, kanto, hokuriku, chubu, kinki, chugoku, shikoku, kyushu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import officially listed source using audited SHA256 with no station columns
        run: |
          python river-fish/biota/import_national_benthic_v19.py --region "${{ matrix.region }}" --out "$RUNNER_TEMP/benthic-data"
      - uses: actions/upload-artifact@v4
        with:
          name: official-benthic-${{ matrix.region }}
          path: ${{ runner.temp }}/benthic-data/
          retention-days: 14
          if-no-files-found: error

  regional-bird-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        region: [hokkaido, tohoku, kanto, hokuriku, chubu, kinki, chugoku, shikoku, kyushu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Only import authenticated bird labels without site or precise-coordinate columns
        run: |
          python river-fish/biota/import_national_birds_v25.py \
            --region "${{ matrix.region }}" --out "$RUNNER_TEMP/bird-data"
      - uses: actions/upload-artifact@v4
        with:
          name: official-river-bird-${{ matrix.region }}
          path: ${{ runner.temp }}/bird-data/
          retention-days: 14
          if-no-files-found: error

  regional-plant-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        region: [hokkaido, tohoku, kanto, hokuriku, chubu, kinki, chugoku, shikoku, kyushu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage real SHA-256 authenticated official plant labels, not precise locations
        run: |
          python river-fish/biota/import_national_plants_v27.py \
            --region "${{ matrix.region }}" --out "$RUNNER_TEMP/plant-data"
      - uses: actions/upload-artifact@v4
        with:
          name: official-river-plant-${{ matrix.region }}
          path: ${{ runner.temp }}/plant-data/
          retention-days: 14
          if-no-files-found: error

  consolidated-biological-search:
    needs: [regional-source-validation, regional-bird-validation, regional-plant-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: official-benthic-*
          merge-multiple: true
          path: river-fish/biota/benthic-staged/
      - uses: actions/download-artifact@v4
        with:
          pattern: official-river-bird-*
          merge-multiple: true
          path: river-fish/biota/birds-staged/
      - name: Verify exact original bird source pins and staged CSV checksum contract
        run: |
          python -m unittest discover -s river-fish/biota -p 'test_bird_source_audit_v24.py' -v
          python -m unittest discover -s river-fish/biota -p 'test_bird_import_v25.py' -v
      - uses: actions/download-artifact@v4
        with:
          pattern: official-river-plant-*
          merge-multiple: true
          path: river-fish/biota/plants-staged/
      - name: Verify nationwide audited plant ZIP source pins and CSV safety
        run: |
          python -m unittest discover -s river-fish/biota -p 'test_plant_source_audit_v26.py' -v
          python -m unittest discover -s river-fish/biota -p 'test_plant_import_v27.py' -v
      - name: Test all 9 staged benthic datasets and verify no direct river or prefecture attribution
        run: |
          python -m unittest discover -s river-fish/biota -p 'test_benthic_v19.py' -v
      - name: Combine 2025 official taxonomy, nine-region benthic and old fish survey records
        run: |
          python river-fish/biota/build_biota_with_benthic_v19.py --build --db "$RUNNER_TEMP/national-biota-v19.sqlite" > "$RUNNER_TEMP/v19-status.json"
          python river-fish/biota/build_biota_with_benthic_v19.py --db "$RUNNER_TEMP/national-biota-v19.sqlite" --benthic-name カワゲラ --region chugoku --limit 6 > "$RUNNER_TEMP/benthic-results.json"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          stats=json.loads((p/"v19-status.json").read_text())
          assert stats["benthic_regions"]==9
          assert stats["national_taxonomic_reference_names"]==37648
          assert stats["existing_national_fish_watershed_records"]==18814
          assert stats["verified_individual_river_locations"]==0
          assert stats["wordpress_updated"] is False
          print("NATIONAL_BENTHIC_SEARCH_PASS",stats["benthic_watershed_year_name_records"])
          PY
      - name: Verify three-axis search against all real official fish and benthic evidence
        run: |
          python river-fish/biota/three_axis_search_v20.py --db "$RUNNER_TEMP/national-biota-v19.sqlite" --direction organism_to_watershed --organism アユ --region chugoku > "$RUNNER_TEMP/v20-organism-to-watershed.json"
          python river-fish/biota/three_axis_search_v20.py --db "$RUNNER_TEMP/national-biota-v19.sqlite" --direction watershed_to_organism --watershed 太田川 > "$RUNNER_TEMP/v20-watershed-to-organism.json"
          python river-fish/biota/three_axis_search_v20.py --db "$RUNNER_TEMP/national-biota-v19.sqlite" --direction region_explore --region chugoku --group benthic_animals > "$RUNNER_TEMP/v20-region-explore.json"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          for file in ("v20-organism-to-watershed.json","v20-watershed-to-organism.json","v20-region-explore.json"):
              data=json.loads((root/file).read_text())
              assert data["total"]>0, f"Empty real-data search: {file}"
              assert data["wordpress_modified"] is False
              assert data["specific_river_presence_verified"] is False
              assert data["prefecture_presence_verified"] is False
              assert data["taxonomy_identity_verified"] is False
              assert all(row["verified_individual_river"] is None for row in data["results"])
              assert all(row["approved_2025_taxon_code"] is None for row in data["results"])
              print("THREE_AXIS_REAL_DATA_PASS",file,data["total"])
          PY
      - name: Verify grouped name and watershed results against real 9-region research data
        run: |
          python river-fish/biota/compact_search_v22.py --db "$RUNNER_TEMP/national-biota-v19.sqlite" --direction region_explore --region chugoku > "$RUNNER_TEMP/v22-region-summary.json"
          python river-fish/biota/compact_search_v22.py --db "$RUNNER_TEMP/national-biota-v19.sqlite" --direction watershed_to_organism --region chugoku --watershed 太田川 --watershed-match exact > "$RUNNER_TEMP/v22-watershed-labels.json"
          python river-fish/biota/compact_search_v22.py --db "$RUNNER_TEMP/national-biota-v19.sqlite" --direction organism_to_watershed --region chugoku --organism アユ --group fish > "$RUNNER_TEMP/v22-fish-to-watersheds.json"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          checks=[
              ("v22-region-summary.json","watershed_summary"),
              ("v22-watershed-labels.json","distinct_source_labels_by_watershed"),
              ("v22-fish-to-watersheds.json","distinct_source_labels_by_watershed")]
          for filename,typ in checks:
              x=json.loads((root/filename).read_text())
              assert x["result_type"]==typ
              assert x["total"]>0
              assert x["wordpress_modified"] is False
              assert x["individual_river_verified"] is False
              assert x["prefecture_presence_verified"] is False
              assert x["current_distribution_verified"] is False
              assert x["aquatic_insect_subgroup_available"] is False
              assert x["birds_survey_records_available"] is False
              assert len(x["results"])<=x["per_page"]
              print("COMPACT_REAL_DATA_PASS",filename,x["total"])
          import sqlite3
          db=sqlite3.connect(str(root/"national-biota-v19.sqlite"))
          try:
              raw=sum(db.execute(
                  "SELECT COUNT(*) FROM "+table+" WHERE region=? AND watershed_name=?",
                  ("chugoku","太田川")).fetchone()[0] for table in
                  ("watershed_year_fish_evidence","watershed_year_benthic_evidence"))
          finally:
              db.close()
          grouped=json.loads((root/"v22-watershed-labels.json").read_text())["total"]
          assert grouped <= raw, "Same region and exact watershed grouped names cannot exceed raw rows"
          print("COMPACT_REDUCTION_SAME_REGION_WATERSHED",raw,grouped)
          PY
      - name: Build immutable 2-group v2.3 contract data snapshot
        run: |
          python river-fish/biota/build_dataset_v23.py \
            --legacy-db "$RUNNER_TEMP/national-biota-v19.sqlite" \
            --db "$RUNNER_TEMP/biota-snapshot-v23.sqlite" \
            --manifest "$RUNNER_TEMP/biota-snapshot-v23.json" > "$RUNNER_TEMP/biota-v23-status.json"
          python river-fish/biota/engine_v23.py \
            --db "$RUNNER_TEMP/biota-snapshot-v23.sqlite" \
            --manifest "$RUNNER_TEMP/biota-snapshot-v23.json" \
            --direction region_explore --region chugoku > "$RUNNER_TEMP/biota-v23-chugoku.json"
          python river-fish/biota/engine_v23.py \
            --db "$RUNNER_TEMP/biota-snapshot-v23.sqlite" \
            --manifest "$RUNNER_TEMP/biota-snapshot-v23.json" \
            --direction watershed_to_organism --region chugoku \
            --watershed 太田川 --watershed-match exact > "$RUNNER_TEMP/biota-v23-ota.json"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          m=json.loads((root/"biota-snapshot-v23.json").read_text())
          assert m["group_counts"]=={"fish":18814,"benthic_animals":74949}
          assert m["total_survey_rows"]==93763
          assert m["publication_status"]=="research_only_not_wordpress"
          assert m["individual_river_verified"] is False
          assert m["wordpress_modified"] is False
          for file,total in (("biota-v23-chugoku.json",13),("biota-v23-ota.json",623)):
              r=json.loads((root/file).read_text())
              assert r["total"]==total,(file,r["total"])
              assert r["taxonomy_identity_verified"] is False
              assert r["individual_river_verified"] is False
              assert len(r["results"])<=20
              print("V23_DYNAMIC_ENGINE_REAL_DATA_PASS",file,r["total"])
          print("V23_DATASET_SIGNATURE_VERIFIED",m["database_sha256"],m["total_survey_rows"])
          PY
      - name: Upload v2.3 immutable data + SHA catalog, not the search program or WordPress
        uses: actions/upload-artifact@v4
        with:
          name: research-only-biota-data-v23
          path: |
            ${{ runner.temp }}/biota-snapshot-v23.sqlite
            ${{ runner.temp }}/biota-snapshot-v23.json
            ${{ runner.temp }}/biota-v23-status.json
            ${{ runner.temp }}/biota-v23-chugoku.json
            ${{ runner.temp }}/biota-v23-ota.json
          retention-days: 14
          if-no-files-found: error
      - name: Build combined national 3-group immutable snapshot from SHA-pinned historical bird evidence
        run: |
          python river-fish/biota/build_bird_dataset_v25.py \
            --legacy-db "$RUNNER_TEMP/national-biota-v19.sqlite" \
            --staged-dir "river-fish/biota/birds-staged" \
            --db "$RUNNER_TEMP/biota-snapshot-v25.sqlite" \
            --manifest "$RUNNER_TEMP/biota-snapshot-v25.json" \
            --generated-dir "$RUNNER_TEMP/bird-v25-generated" > "$RUNNER_TEMP/biota-v25-status.json"
          python river-fish/biota/engine_v23.py \
            --db "$RUNNER_TEMP/biota-snapshot-v25.sqlite" \
            --manifest "$RUNNER_TEMP/biota-snapshot-v25.json" \
            --direction region_explore --region chugoku --group birds > "$RUNNER_TEMP/biota-v25-bird-regions.json"
          python river-fish/biota/engine_v23.py \
            --db "$RUNNER_TEMP/biota-snapshot-v25.sqlite" \
            --manifest "$RUNNER_TEMP/biota-snapshot-v25.json" \
            --direction watershed_to_organism --region chugoku \
            --watershed 太田川 --watershed-match exact --group birds > "$RUNNER_TEMP/biota-v25-ota-birds.json"
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          data=json.loads((root/"biota-snapshot-v25.json").read_text())
          assert data["group_counts"]=={"fish":18814,"benthic_animals":74949,"birds":44093}
          assert data["total_survey_rows"]==137856
          assert data["publication_status"]=="research_only_not_wordpress"
          assert data["wordpress_modified"] is False
          assert data["individual_river_verified"] is False
          assert data["taxonomy_identity_verified"] is False
          assert "birds" not in data["unavailable_separate_groups"]
          for file in ("biota-v25-bird-regions.json","biota-v25-ota-birds.json"):
              result=json.loads((root/file).read_text())
              assert result["total"]>0
              assert result["selected_groups"]==["birds"]
              assert result["individual_river_verified"] is False
              assert result["current_distribution_verified"] is False
              assert result["taxonomy_identity_verified"] is False
              assert len(result["results"])<=20
              print("REAL_BIRD_3AXIS_SEARCH_PASS",file,result["total"])
          print("NATIONAL_REAL_BIRD_ROWS_CONFIRMED",data["group_counts"]["birds"])
          print("NATIONAL_THREE_GROUP_SURVEY_ROWS",data["total_survey_rows"])
          PY
      - name: Upload research-only bird+fish+benthic dataset and manifest (never WordPress)
        uses: actions/upload-artifact@v4
        with:
          name: research-only-national-biota-with-birds-v25
          path: |
            ${{ runner.temp }}/biota-snapshot-v25.sqlite
            ${{ runner.temp }}/biota-snapshot-v25.json
            ${{ runner.temp }}/biota-v25-status.json
            ${{ runner.temp }}/biota-v25-bird-regions.json
            ${{ runner.temp }}/biota-v25-ota-birds.json
          retention-days: 14
          if-no-files-found: error
      - name: Build complete 4-group research snapshot using unchanged dynamic v2.3 engine
        run: |
          python river-fish/biota/build_four_group_dataset_v27.py \
            --legacy-db "$RUNNER_TEMP/national-biota-v19.sqlite" \
            --birds-staged "river-fish/biota/birds-staged" \
            --plants-staged "river-fish/biota/plants-staged" \
            --db "$RUNNER_TEMP/biota-snapshot-v27.sqlite" \
            --manifest "$RUNNER_TEMP/biota-snapshot-v27.json" \
            --generated-dir "$RUNNER_TEMP/four-group-generated-v27" > "$RUNNER_TEMP/four-group-status-v27.json"
          python river-fish/biota/engine_v23.py \
            --db "$RUNNER_TEMP/biota-snapshot-v27.sqlite" \
            --manifest "$RUNNER_TEMP/biota-snapshot-v27.json" \
            --direction region_explore --region chugoku --group plants > "$RUNNER_TEMP/chugoku-plants-v27.json"
          python river-fish/biota/engine_v23.py \
            --db "$RUNNER_TEMP/biota-snapshot-v27.sqlite" \
            --manifest "$RUNNER_TEMP/biota-snapshot-v27.json" \
            --direction watershed_to_organism --region chugoku \
            --watershed 太田川 --watershed-match exact --group plants > "$RUNNER_TEMP/ota-plants-v27.json"
          python - <<'PY'
          import json,os,pathlib,sys
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          m=json.loads((root/"biota-snapshot-v27.json").read_text())
          assert m["group_counts"]=={"fish":18814,"benthic_animals":74949,"birds":44093,"plants":270180}
          assert m["total_survey_rows"]==408036
          assert m["publication_status"]=="research_only_not_wordpress"
          assert m["wordpress_modified"] is False
          assert m["individual_river_verified"] is False
          assert m["taxonomy_identity_verified"] is False
          assert {x["id"] for x in m["groups"]}=={"fish","benthic_animals","birds","plants"}
          for path in ("chugoku-plants-v27.json","ota-plants-v27.json"):
              r=json.loads((root/path).read_text())
              assert r["total"]>0
              assert r["selected_groups"]==["plants"]
              assert r["taxonomy_identity_verified"] is False
              assert r["individual_river_verified"] is False
              assert r["current_distribution_verified"] is False
              assert len(r["results"])<=20
              print("PLANT_FOUR_GROUP_SEARCH_PASS",path,r["total"])
          print("NATIONAL_FOUR_GROUP_RESEARCH_SURVEY_RECORDS",m["total_survey_rows"])
          PY
      - name: Audit aquatic-insect literal-name candidates without publishing a subgroup
        run: |
          python river-fish/biota/audit_aquatic_insect_names_v29.py --self-test
          python river-fish/biota/audit_aquatic_insect_names_v29.py \
            --db "$RUNNER_TEMP/biota-snapshot-v27.sqlite" \
            --manifest "$RUNNER_TEMP/biota-snapshot-v27.json" \
            --out "$RUNNER_TEMP/aquatic-insect-name-screening-v29.json"
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"aquatic-insect-name-screening-v29.json"
          x=json.loads(p.read_text())
          assert x["benthic_survey_records"]==74949
          assert sum(x["records_by_screening_status"].values())==74949
          assert x["aquatic_insect_group_can_be_published"] is False
          assert x["survey_names_identified_as_species"]==0
          assert x["records_assigned_to_individual_river"]==0
          assert x["wordpress_modified"] is False
          print("AQUATIC_INSECT_AUDIT_BOUNDARY_PASS")
          PY
      - name: Upload research-only aquatic-insect name screening counts
        uses: actions/upload-artifact@v4
        with:
          name: aquatic-insect-name-screening-v29
          path: ${{ runner.temp }}/aquatic-insect-name-screening-v29.json
          retention-days: 30
          if-no-files-found: error
      - name: Upload 4-group verified research-only SQLite and manifest, not WordPress
        uses: actions/upload-artifact@v4
        with:
          name: research-only-biota-four-groups-v27
          path: |
            ${{ runner.temp }}/biota-snapshot-v27.sqlite
            ${{ runner.temp }}/biota-snapshot-v27.json
            ${{ runner.temp }}/four-group-status-v27.json
            ${{ runner.temp }}/chugoku-plants-v27.json
            ${{ runner.temp }}/ota-plants-v27.json
          retention-days: 14
          if-no-files-found: error
      - name: Package separately verified 408,036-row biota WordPress ZIP (never deploy)
        run: |
          python river-fish/build_wp_biota_plugin_v28.py \
            --db "$RUNNER_TEMP/biota-snapshot-v27.sqlite" \
            --manifest "$RUNNER_TEMP/biota-snapshot-v27.json" \
            --out "$RUNNER_TEMP/biota-wp-package-v28" \
            --zip "$RUNNER_TEMP/tsurikue-biota-search.zip" > "$RUNNER_TEMP/biota-wp-zip-status.json"
          python - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"tsurikue-biota-search.zip"
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              m=json.loads(z.read("tsurikue-biota-search/data/manifest.json"))
              assert m["total"]==408036
              assert m["counts"]=={"fish":18814,"benthic_animals":74949,"birds":44093,"plants":270180}
              assert m["publication_status"]=="not_imported_until_manual_admin_action"
              c=z.read("tsurikue-biota-search/data/survey_evidence.csv")
              assert hashlib.sha256(c).hexdigest()==m["sha256_csv"]
          print("WORDPRESS_BIOTA_INSTALLABLE_ZIP_TEST_PASS",p.stat().st_size)
          PY
      - name: Upload manually installable, non-deployed biota WordPress plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tsurikue-biota-wordpress-preview-v28
          path: ${{ runner.temp }}/tsurikue-biota-search.zip
          retention-days: 30
          if-no-files-found: error
      - name: Upload independently audited regional context and research SQLite, not WordPress
        uses: actions/upload-artifact@v4
        with:
          name: national-biota-benthic-research-v19
          path: |
            ${{ runner.temp }}/national-biota-v19.sqlite
            ${{ runner.temp }}/v19-status.json
            ${{ runner.temp }}/benthic-results.json
          retention-days: 14
          if-no-files-found: error

  isolated-wordpress-biota-acceptance:
    needs: consolidated-biological-search
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: biota_test_password_only
          MYSQL_DATABASE: biota_wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pbiota_test_password_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, curl, zip
          coverage: none
      - uses: actions/download-artifact@v4
        with:
          name: tsurikue-biota-wordpress-preview-v28
          path: ${{ runner.temp }}
      - name: Install fresh disposable WP and 4-group biota ZIP, no user website
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/wp-cli.phar" https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          mkdir -p "$RUNNER_TEMP/test-wordpress"
          php "$RUNNER_TEMP/wp-cli.phar" core download --path="$RUNNER_TEMP/test-wordpress" --quiet
          php "$RUNNER_TEMP/wp-cli.phar" config create --path="$RUNNER_TEMP/test-wordpress" \
            --dbname=biota_wordpress_test --dbuser=root --dbpass=biota_test_password_only \
            --dbhost=127.0.0.1 --skip-check --quiet
          php "$RUNNER_TEMP/wp-cli.phar" core install --path="$RUNNER_TEMP/test-wordpress" \
            --url=https://biota-wp-isolated.example.test --title="Biota isolated QA" \
            --admin_user=admin --admin_password=test_admin_only \
            --admin_email=qa@example.test --skip-email --quiet
          php "$RUNNER_TEMP/wp-cli.phar" plugin install "$RUNNER_TEMP/tsurikue-biota-search.zip" \
            --path="$RUNNER_TEMP/test-wordpress" --activate --quiet
      - name: Actually import 408k official survey names, test REST and old generation protection
        run: |
          php "$RUNNER_TEMP/wp-cli.phar" eval-file \
            "$GITHUB_WORKSPACE/river-fish/test_wp_biota_runtime_v28.php" \
            --path="$RUNNER_TEMP/test-wordpress"
