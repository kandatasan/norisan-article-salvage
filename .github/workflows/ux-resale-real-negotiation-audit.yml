name: UX real negotiation preflight read-only
on:
  push:
    branches: [ux-resale-real-negotiation-20261113]
    paths:
      - '.github/workflows/ux-resale-real-negotiation-audit.yml'
      - 'scripts/add_ux_resale_actual_negotiation_20261113.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Read live WordPress post, simulate change (zero writes)
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,sys,urllib.request
          sys.path.insert(0,'scripts')
          from add_ux_resale_actual_negotiation_20261113 import transform
          auth=base64.b64encode((os.environ['TSURIKUE_WP_USER']+':'+os.environ['TSURIKUE_WP_APP_PASSWORD']).encode()).decode()
          url='https://tsurikue.com/wp-json/wp/v2/posts/2222?context=edit&_fields=id,status,slug,featured_media,title,content'
          req=urllib.request.Request(url,headers={'Authorization':'Basic '+auth,'Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=40) as res:row=json.loads(res.read())
          body=row['content']['raw']
          new=transform(body)
          print('POST_META',row['id'],row['status'],row['slug'],row['featured_media'])
          print('PREFLIGHT_SOURCE_SHA',hashlib.sha256(body.encode()).hexdigest())
          print('PREFLIGHT_TARGET_SHA',hashlib.sha256(new.encode()).hexdigest())
          print('PREFLIGHT_COUNTS',{'paragraphs_before':body.count('<!-- wp:paragraph'),'paragraphs_after':new.count('<!-- wp:paragraph'),'headings_before':body.count('<!-- wp:heading'),'headings_after':new.count('<!-- wp:heading'),'photos':new.count('<!-- wp:image'),'ctn':new.count('[blog_parts id="4521"]')})
          print('PREFLIGHT_SUCCESS_NO_WRITE')
          PY