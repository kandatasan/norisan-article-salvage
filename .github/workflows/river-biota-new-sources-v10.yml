name: Discover prefectural river-biota evidence v10 (research only)
on:
  push:
    branches: [research/river-biota-new-sources-20261020]
    paths:
      - 'river-fish/research-individual-v10/*.py'
      - '.github/workflows/river-biota-new-sources-v10.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: extra-prefecture-biota-v10
  cancel-in-progress: true
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate read-only source probes
        run: python -m py_compile river-fish/research-individual-v10/*.py
      - name: Inspect public Kanagawa prefectural eDNA spreadsheet evidence
        run: |
          mkdir -p river-fish/research-individual-v10/outputs
          python river-fish/research-individual-v10/probe_kanagawa_edna_source_v10.py \
            --out river-fish/research-individual-v10/outputs/kanagawa_edna_public_source_probe_v10.json
      - name: Install PDF table extraction engine
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Cross-verify Hiroshima City four small rivers from two official reports
        continue-on-error: true
        run: |
          python river-fish/research-individual-v10/probe_hiroshima_small_rivers_v10.py \
            --out river-fish/research-individual-v10/outputs/hiroshima_municipal_smallstream_source_probe_v10.json
      - name: Inspect actual 2025 eDNA sheet layout (method-separated)
        run: |
          python river-fish/research-individual-v10/inspect_kanagawa_sheet_columns_v10.py \
            --out river-fish/research-individual-v10/outputs/kanagawa_sheet_layout_v10.json
      - name: Measure read-positive eDNA records with explicit stream names
        run: |
          python river-fish/research-individual-v10/audit_kanagawa_edna_matrix_v10.py \
            river-fish/research-individual-v10/outputs/kanagawa_named_tributary_edna_audit_v10.json
      - name: Extract official 2025 Kanagawa fish eDNA river-name candidates
        run: |
          python river-fish/research-individual-v10/extract_kanagawa_fish_edna_v10.py \
            --out river-fish/research-individual-v10/outputs
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('river-fish/research-individual-v10/outputs')
          d=json.loads((p/'kanagawa_2025_edna_fish_provenance_audit_v10.json').read_text())
          assert d['recorded_name_rivers_from_prefecture_eDNA']>=20
          assert d['new_name_pairs_not_in_base_428']>=15
          assert d['fish_live_capture_observations_added']==0
          assert d['source_method_separate_from_existing_553351_survey_contexts']
          assert d['no_coordinates_or_detailed_sites_saved']
          with (p/'kanagawa_2025_tributary_fish_edna_candidate_labels_v10.csv').open() as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==d['read_positive_unique_manual_labels_with_river']
          assert all(r['survey_method']=='environmental_DNA_positive_sequence_reads' for r in rows)
          assert all(r['source_taxon_confidence'] in ('高','中') for r in rows)
          assert all(r['survey_year']=='2025' for r in rows)
          print('EXTERNAL_EDNA_NAME_FIRST_CANDIDATES',d['new_name_pairs_not_in_base_428'])
          PY
      - name: Reassess all 47 former river-code holds at source-name granularity
        run: |
          python river-fish/research-individual-v10/review_47_held_river_names_v10.py \
            river-fish/research-individual-v10/outputs/review_47_held_river_names_v10.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('river-fish/research-individual-v10/outputs/review_47_held_river_names_v10.json').read_text())
          assert j["source_held_name_labels"]==47
          assert j["source_held_contexts"]==101210
          assert j["baseline_428_rivers_unchanged"]
          assert j["nonriver_lakes_not_adopted"]
          assert all(not x["current_physical_river_approval"] for x in j["items"])
          print("HELD_RIVER_NAME_REVIEW",j["classification"])
          PY
      - name: Restore verified original v05 river-name research SQLite
        run: |
          python river-fish/research-individual-v05/snapshot_parts_v05.py verify \
            --parts-dir river-fish/research-individual-v05/outputs \
            --db /tmp/river_individual_research_v05.sqlite
      - name: Export held historical biota as explicitly non-geocoded river NAME groups
        run: |
          python river-fish/research-individual-v10/export_held_name_group_biota_v10.py \
            --db /tmp/river_individual_research_v05.sqlite \
            --review river-fish/research-individual-v10/outputs/review_47_held_river_names_v10.json \
            --out river-fish/research-individual-v10/outputs
          python - <<'PY'
          from pathlib import Path
          import json,zipfile
          p=Path('river-fish/research-individual-v10/outputs')
          d=json.loads((p/'held_name_only_review_v10.json').read_text())
          assert d['existing_428_river_identities_unchanged']
          assert d['existing_553351_river_contexts_unchanged']
          assert d['eligible_additional_river_label_groups']==40
          assert d['new_qualified_name_group_historical_contexts']==98084
          assert d['new_four_category_panels']==160
          assert d['does_not_identify_legal_river_segment']
          with zipfile.ZipFile(p/'held_river_name_biology_v10.zip') as z:
              assert len(z.namelist())==160
              for name in z.namelist():
                  info=json.loads(z.read(name))
                  assert info['ten_digit_river_code'] is None
                  assert info['physical_river_or_segment_identification']=='UNRESOLVED'
          print('NAMED_RIVER_UNRESOLVED_SEGMENT_BIOTA',40,98084)
          PY
      - name: Construct provenance-preserving combined research index
        run: |
          python river-fish/research-individual-v10/merge_biological_evidence_layers_v10.py \
            --out river-fish/research-individual-v10/outputs/research_biological_method_layers_v10.json
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('river-fish/research-individual-v10/outputs')
          x=json.loads((p/'research_biological_method_layers_v10.json').read_text())
          d=x['audit']
          assert len(x['entries'])==492
          assert d['combined_source_named_river_label_groups']==492
          assert d['provisional_same_name_segment_ambiguous_labels']==40
          assert d['new_official_prefectural_edna_only_river_names']==24
          assert d['sum_of_historic_named_survey_contexts']==651435
          assert d['edna_2025_distinct_taxon_source_labels']==265
          assert d['fish_capture_records_from_edna']==0
          assert d['wordPress_and_production_database_unchanged'] is True
          print('HISTORICAL_NAMED_RIVER_EVIDENCE',d['sum_of_historic_named_survey_contexts'])
          print('NEW_EDNA_RIVERS',d['new_official_prefectural_edna_only_river_names'])
          PY
      - name: Check acquisition honesty
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("river-fish/research-individual-v10/outputs/kanagawa_edna_public_source_probe_v10.json").read_text())
          assert j["survey_method"]=="environmental_DNA_detection_not_capture_or_visual_sighting"
          assert j["new_rivers_approved"]==0
          assert j["promoted_as_direct_fish_capture"] is False
          assert len(j["sheet_structure"]["sheets"])>0
          assert j["source_file_candidates"]
          assert j["precise_sampling_locations_collected"] is False
          print("VALIDATED_OFFICIAL_PREFECTURAL_EDNA_SOURCE",len(j["sheet_structure"]["sheets"]))
          PY
      - name: Upload source audits
        uses: actions/upload-artifact@v4
        with:
          name: biota-prefecture-source-inventory-v10
          path: river-fish/research-individual-v10/outputs/
          if-no-files-found: error
      - name: Commit source audits in research branch only
        run: |
          test "$GITHUB_REF_NAME" = "research/river-biota-new-sources-20261020"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add river-fish/research-individual-v10/outputs/
          if ! git diff --cached --quiet; then
            git commit -m "research: store new Kanagawa eDNA official source structures and reuse conditions"
            git push origin HEAD:refs/heads/research/river-biota-new-sources-20261020
          fi
