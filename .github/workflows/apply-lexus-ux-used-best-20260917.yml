name: Apply UX used best rewrite 20260917

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply_lexus_ux_used_best_20260917.py'
      - '.github/workflows/apply-lexus-ux-used-best-20260917.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/apply_lexus_ux_used_best_20260917.py'
      - '.github/workflows/apply-lexus-ux-used-best-20260917.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-or-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile scripts/apply_lexus_ux_used_best_20260917.py
      - name: Preflight
        if: github.event_name == 'pull_request'
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/apply_lexus_ux_used_best_20260917.py --mode preflight
      - name: Apply
        if: github.event_name == 'push'
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/apply_lexus_ux_used_best_20260917.py --mode apply
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-used-best-20260917-${{ github.run_id }}
          path: reports/lexus-ux-used-best-20260917/
          if-no-files-found: warn
