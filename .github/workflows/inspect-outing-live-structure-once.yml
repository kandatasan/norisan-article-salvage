name: Inspect outing live structure once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_outing_live_structure.py'
      - '.github/workflows/inspect-outing-live-structure-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Inspect published outing page
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          python scripts/inspect_outing_live_structure.py | tee /tmp/outing-structure.json
      - uses: actions/upload-artifact@v4
        with:
          name: outing-live-structure
          path: /tmp/outing-structure.json
