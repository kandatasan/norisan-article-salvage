name: Apply outing v3 live 20260902

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-outing-v3-live-20260902.yml'
      - 'category-hubs/outing-v3/**'

permissions:
  contents: read
  issues: write

jobs:
  deploy-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate final outing v3 template
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('category-hubs/outing-v3/content.template.html').read_text(encoding='utf-8')
          required=[
            'tsurikue-category-hub:v3:outing-region-accordion-final',
            'tq-outing-auto-index:v3',
            '今日は、どこ行く？','ちょっと遠くへ',
            '{{OUTING_CATEGORY_ID}}','{{HIROSHIMA_TAG_ID}}','{{ETAJIMA_TAG_ID}}','{{YAMAGUCHI_TAG_ID}}','{{SANIN_TAG_ID}}','{{FAR_TAG_ID}}',
            '{{HIROSHIMA_COUNT}}','{{ETAJIMA_COUNT}}','{{YAMAGUCHI_COUNT}}','{{SANIN_COUNT}}','{{FAR_COUNT}}',
            '{{HIROSHIMA_ITEMS}}','{{ETAJIMA_ITEMS}}','{{YAMAGUCHI_ITEMS}}','{{SANIN_ITEMS}}','{{FAR_ITEMS}}',
            '<!-- wp:loos/post-list {"catID":"7"',
            'https://tsurikue.com/category/sightseeing-leisure/'
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('MISSING_REQUIRED='+repr(missing))
          if s.count('<!-- wp:html -->') != 1: raise SystemExit('CUSTOM_HTML_COUNT='+str(s.count('<!-- wp:html -->')))
          if s.count('<!-- wp:details ') != 5: raise SystemExit('DETAILS_COUNT='+str(s.count('<!-- wp:details ')))
          if '100vw' in s or '50% - 50vw' in s or 'margin-left:calc(50%' in s: raise SystemExit('VIEWPORT_WIDTH_HACK_FOUND')
          if re.search('[\U0001F300-\U0001FAFF]',s): raise SystemExit('ARTICLE_EMOJI_FOUND')
          print('OUTING_V3_TEMPLATE_OK bytes=',len(s.encode('utf-8')))
          PY

      - name: Backup published outing page
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          TQ_OUTING_BACKUP_PATH: /tmp/outing-v3-live-backup.json
        shell: bash
        run: |
          set -euo pipefail
          python category-hubs/outing-v3/live_backup.py backup

      - name: Update preview and published outing page
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          TQ_OUTING_RESULT_PATH: /tmp/outing-v3-result.json
        shell: bash
        run: |
          set -euo pipefail
          python category-hubs/outing-v3/deploy_live.py | tee /tmp/outing-v3-deploy.log

      - name: Install render audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet selenium

      - name: Verify published desktop and mobile render
        id: render
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python category-hubs/outing-v3/verify_render.py | tee /tmp/outing-v3-render.log

      - name: Roll back live page if render audit fails
        if: steps.render.outcome == 'failure'
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          TQ_OUTING_BACKUP_PATH: /tmp/outing-v3-live-backup.json
        shell: bash
        run: |
          set -euo pipefail
          python category-hubs/outing-v3/live_backup.py rollback
          echo 'Render audit failed; published outing page was restored.' >&2
          exit 1

      - name: Record success audit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Outing v3 live: SUCCESS'
            echo '```json'
            cat /tmp/outing-v3-result.json
            echo '```'
            echo '```json'
            cat outing-v3-render-check.json
            echo '```'
          } >/tmp/outing-v3-comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/outing-v3-comment.md

      - name: Upload outing v3 audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outing-v3-live-audit
          path: |
            /tmp/outing-v3-result.json
            /tmp/outing-v3-deploy.log
            /tmp/outing-v3-render.log
            outing-v3-render-check.json
            outing-v3-desktop-closed.png
            outing-v3-desktop-far-open.png
            outing-v3-mobile-closed.png
          if-no-files-found: warn
