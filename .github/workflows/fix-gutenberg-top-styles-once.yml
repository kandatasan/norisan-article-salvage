name: Fix Gutenberg category card alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gutenberg-top-styles-once.yml'

permissions:
  contents: write

jobs:
  align-category-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Add category card alignment override
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('experimental-pages/top-design-lab/content.html')
          s = p.read_text(encoding='utf-8')
          tag = '/* GUTENBERG CARD ALIGN FIX v2 */'
          if tag in s:
              raise SystemExit('card alignment fix already present')
          css = (
              '\n/* GUTENBERG CARD ALIGN FIX v2 */\n'
              '.tq4 .tq4-cat .wp-block-cover__inner-container{width:100%!important;display:flex!important;align-items:flex-end!important;justify-content:flex-start!important;text-align:left!important}\n'
              '.tq4 .tq4-cat-body{width:100%!important;max-width:none!important;margin-left:0!important;margin-right:0!important;text-align:left!important}\n'
              '.tq4 .tq4-cat-body>*{max-width:none!important;margin-left:0!important;margin-right:0!important;text-align:left!important}\n'
              '.tq4 .tq4-cat-body>.tq4-card-label,.tq4 .tq4-cat-body>h3,.tq4 .tq4-cat-body>.tq4-card-desc{width:100%!important}\n'
              '.tq4 .tq4-cat-body>.tq4-pill-text{display:inline-block!important;width:max-content!important;max-width:100%!important}\n'
              '@media(max-width:560px){.tq4 .tq4-cat-body{padding-left:14px!important;padding-right:14px!important}}\n'
          )
          s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Sync only guarded draft page
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/create_experimental_page_once.py --config experimental-pages/top-design-lab/config.json

      - name: Adopt new exact draft hash and commit source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          content_path = Path('experimental-pages/top-design-lab/content.html')
          config_path = Path('experimental-pages/top-design-lab/config.json')
          content = content_path.read_text(encoding='utf-8')
          cfg = json.loads(config_path.read_text(encoding='utf-8'))
          cfg['expected_current_content_sha256'] = hashlib.sha256(content.encode()).hexdigest()
          config_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experimental-pages/top-design-lab/content.html experimental-pages/top-design-lab/config.json
          git commit -m 'Align Gutenberg category card text'
          git push origin HEAD:main
