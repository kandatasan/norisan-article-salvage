name: Inspect tsurikue header and mobile menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-tsurikue-header-menu-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Inspect live header and mobile menu
        shell: bash
        run: |
          cat > inspect.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('https://tsurikue.com/?headerinspect=1',{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(1000);
            const before=await page.evaluate(()=>{
              const pick=s=>{const e=document.querySelector(s);if(!e)return null; return {tag:e.tagName,cls:e.className,id:e.id,html:e.outerHTML.slice(0,7000)}};
              return {
                bodyClass:document.body.className,
                header:pick('#header')||pick('.l-header')||pick('header'),
                menuButton:pick('.c-iconBtn.-menuBtn')||pick('[aria-label*="メニュー"]')||pick('.menu-toggle'),
                spMenu:pick('.p-spMenu'),
                navs:[...document.querySelectorAll('nav')].map(n=>({cls:n.className,id:n.id,text:n.innerText.slice(0,1200),html:n.outerHTML.slice(0,5000)})).slice(0,12)
              };
            });
            console.log('---HEADER_BEFORE---');
            console.log(JSON.stringify(before,null,2));
            const btn=page.locator('.c-iconBtn.-menuBtn').first();
            if(await btn.count()){
              await btn.click();
              await page.waitForTimeout(700);
            }
            const after=await page.evaluate(()=>{
              const pick=s=>{const e=document.querySelector(s);if(!e)return null; const cs=getComputedStyle(e); const r=e.getBoundingClientRect(); return {tag:e.tagName,cls:e.className,id:e.id,text:e.innerText.slice(0,2500),html:e.outerHTML.slice(0,12000),display:cs.display,visibility:cs.visibility,left:+r.left.toFixed(1),right:+r.right.toFixed(1),width:+r.width.toFixed(1)}};
              return {
                bodyClass:document.body.className,
                spMenu:pick('.p-spMenu'),
                spMenuBody:pick('.p-spMenu__body'),
                spMenuInner:pick('.p-spMenu__inner'),
                spMenuNav:pick('.p-spMenu__nav'),
                widgetTitles:[...document.querySelectorAll('.p-spMenu .c-widget__title')].map(e=>e.innerText),
                links:[...document.querySelectorAll('.p-spMenu a')].map(a=>({text:a.innerText.trim(),href:a.href,cls:a.className})).filter(x=>x.text).slice(0,80)
              };
            });
            console.log('---HEADER_AFTER_OPEN---');
            console.log(JSON.stringify(after,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node inspect.js
