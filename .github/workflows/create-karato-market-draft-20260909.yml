name: Create Karato Market draft once

on:
  push:
    branches: [main]
    paths:
      - packages/karato-market/content.html
      - scripts/create_karato_market_draft_20260909.py
      - scripts/verify_karato_market_draft_20260909.py
      - .github/workflows/create-karato-market-draft-20260909.yml

permissions:
  contents: read
  issues: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create draft and verify with separate GET
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile scripts/create_karato_market_draft_20260909.py scripts/verify_karato_market_draft_20260909.py
          python scripts/create_karato_market_draft_20260909.py > /tmp/create.md
          python scripts/verify_karato_market_draft_20260909.py > /tmp/verify.md
          {
            cat /tmp/create.md
            echo
            cat /tmp/verify.md
          } > /tmp/comment.md
          cat /tmp/comment.md
          gh issue comment 22 --repo "${{ github.repository }}" --body-file /tmp/comment.md
