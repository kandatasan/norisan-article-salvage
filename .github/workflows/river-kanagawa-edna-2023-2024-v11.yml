name: Audit Kanagawa 2023-24 eDNA v11 (research only)
on:
  push:
    branches:
      - research/kanagawa-edna-2023-2024-v11
    paths:
      - 'river-fish/research-individual-v11/*.py'
      - '.github/workflows/river-kanagawa-edna-2023-2024-v11.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kanagawa-edna-2023-2024-v11
  cancel-in-progress: false
jobs:
  audit-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate read-only scanner
        run: python -m py_compile river-fish/research-individual-v11/*.py
      - name: Fetch five official Kanagawa eDNA XLSX originals and inspect structure
        run: python river-fish/research-individual-v11/scan_kanagawa_edna_2023_2024_v11.py
      - name: Audit that no ecological presence or coordinates were invented
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('river-fish/research-individual-v11/outputs/kanagawa_2023_2024_source_schema_scout_v11.json')
          x=json.loads(p.read_text())
          assert x['successful_original_workbooks']>=3
          assert x['not_a_direct_capture_survey'] and x['2025_baseline_undisturbed']
          assert all(v['capture_observations_added']==0 and not v['exact_sites_exported'] for v in x['files'])
          print('OFFICIAL_2023_2024_WORKBOOKS_VERIFIED',x['successful_original_workbooks'])
          PY
      - name: Extract historical eDNA detections (method separated, never capture)
        run: python river-fish/research-individual-v11/extract_kanagawa_edna_2023_2024_v11.py
      - name: Validate source method, deduplication, and unchanged v10 baseline
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('river-fish/research-individual-v11/outputs')
          q=json.loads((p/'kanagawa_2023_2024_edna_provenance_qa_v11.json').read_text())
          rows=list(csv.DictReader((p/'kanagawa_2023_2024_edna_evidence_v11.csv').open()))
          assert len(rows)==q['read_positive_source_rows']
          assert q['source_originals_verified_by_sha']==5
          assert q['v10_base_label_groups_preserved']==492
          assert q['v10_2025_edna_counts_preserved_separately']==265
          assert q['new_direct_fish_capture_records']==0
          assert q['all_10_digit_river_codes_optional']
          assert q['all_precise_sampling_sites_and_personal_details_excluded']
          assert all(x['survey_year'] in ('2023','2024') for x in rows)
          assert all(x['survey_method']=='environmental_DNA_positive_sequence_reads_not_capture' for x in rows)
          assert all(x['identification_confidence_verbatim'] in ('高','中','not_reported') for x in rows)
          assert all(not x['river_code_optional'] for x in rows)
          print('YEAR_SEPARATED_OFFICIAL_EDNA_RECORDS',len(rows))
          print('NEW_NAMED_RIVER_GROUP_CANDIDATES',q['new_candidate_name_groups_not_in_v10_492'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kanagawa-2023-24-edna-scout-v11
          path: river-fish/research-individual-v11/outputs/
      - name: Save research-only audit results to this branch
        if: always()
        run: |
          test "$GITHUB_REF_NAME" = "research/kanagawa-edna-2023-2024-v11"
          if [ -f river-fish/research-individual-v11/outputs/kanagawa_2023_2024_source_schema_scout_v11.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add river-fish/research-individual-v11/outputs/
            if ! git diff --cached --quiet; then
              git commit -m "research: record original Kanagawa 2023-24 XLSX schema and SHA"
              git push origin HEAD:refs/heads/research/kanagawa-edna-2023-2024-v11
            fi
          fi
