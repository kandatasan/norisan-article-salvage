name: Apply editorial draft packages on push

on:
  pull_request:
    branches: [main]
    paths:
      - 'editorial/**'
      - 'scripts/apply_editorial_draft_once.py'
      - 'scripts/apply_en_travel_20261113.py'
      - 'tests/test_en_travel_20261113.py'
      - 'tests/test_english_travel_wave2_20261113.py'
      - 'tests/test_english_travel_copy_cleanup_20261113.py'
      - 'tests/test_en_rabbit_karato_photos_20261113.py'
      - 'scripts/update_english_travel_refresh_20261113.py'
      - 'tests/test_english_travel_refresh_20261113.py'
      - 'tests/test_apply_editorial_published_insert.py'
      - 'tests/test_gulliver_cta_20261104.py'
      - 'tests/test_gulliver_context_20261104.py'
      - 'tests/test_gulliver_extra_buttons_20261104.py'
      - 'tests/test_gulliver_benefit_copy_20261104.py'
      - 'tests/test_ux_purchase_funnel_20261111.py'
      - 'tests/test_rewrite_ux_used_20261113.py'
      - 'tests/test_refine_ux_used_voice_breaks_20261113.py'
      - 'tests/test_add_ux_used_owner_photos_20261113.py'
      - 'tests/test_rewrite_ux_resale_20261113.py'
      - 'tests/test_ux_resale_actual_negotiation_20261113.py'
      - 'tests/test_ux_resale_light_touch_20261113.py'
      - 'tests/test_lexus_goodbuy_light_20261113.py'
      - 'tests/test_replace_goodbuy_ctn_gulliver_20261113.py'
      - 'tests/test_migrate_all_gulliver_native_counted_20261113.py'
      - 'tests/test_revise_lbx_cheap_light_20261114.py'
      - 'scripts/revise_lbx_cheap_light_20261114.py'
      - 'scripts/migrate_all_gulliver_native_counted_20261113.py'
      - 'scripts/replace_goodbuy_ctn_gulliver_outlets_20261113.py'
      - 'scripts/lexus_goodbuy_light_20261113.py'
      - 'scripts/add_ux_resale_light_touch_20261113.py'
      - 'scripts/add_ux_resale_actual_negotiation_20261113.py'
      - 'scripts/rewrite_ux_resale_20261113.py'
      - 'scripts/add_ux_used_owner_photos_20261113.py'
      - 'scripts/refine_ux_used_voice_breaks_20261113.py'
      - 'scripts/rewrite_ux_used_20261113.py'
  push:
    branches: [main]
    paths:
      - 'editorial/**'
  workflow_dispatch:
    inputs:
      config_path:
        description: 'Editorial config path, e.g. editorial/tottori-drive/config.json'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  apply-editorial-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run generic safety tests
        run: python -m unittest tests/test_apply_editorial_draft_once.py tests/test_apply_editorial_draft_create.py tests/test_apply_editorial_published_insert.py tests/test_nx_hud_table_patch_20261026.py tests/test_gulliver_cta_20261104.py tests/test_gulliver_context_20261104.py tests/test_gulliver_extra_buttons_20261104.py tests/test_gulliver_benefit_copy_20261104.py tests/test_ux_purchase_funnel_20261111.py tests/test_rewrite_ux_used_20261113.py tests/test_refine_ux_used_voice_breaks_20261113.py tests/test_add_ux_used_owner_photos_20261113.py tests/test_rewrite_ux_resale_20261113.py tests/test_ux_resale_actual_negotiation_20261113.py tests/test_ux_resale_light_touch_20261113.py tests/test_lexus_goodbuy_light_20261113.py tests/test_replace_goodbuy_ctn_gulliver_20261113.py tests/test_migrate_all_gulliver_native_counted_20261113.py tests/test_revise_lbx_cheap_light_20261114.py tests/test_english_travel_refresh_20261113.py tests/test_en_travel_20261113.py tests/test_english_travel_wave2_20261113.py tests/test_english_travel_copy_cleanup_20261113.py tests/test_en_rabbit_karato_photos_20261113.py -v
      - name: Resolve configs
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/configs.txt
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            config='${{ inputs.config_path }}'
            test -f "$config"
            printf '%s\n' "$config" > /tmp/configs.txt
          else
            git diff --name-only HEAD^ HEAD -- 'editorial/*/config.json' 'editorial/*/content.html' \
              | awk -F/ 'NF>=3 {print $1 "/" $2 "/config.json"}' \
              | sort -u > /tmp/config-candidates.txt
            while IFS= read -r config; do
              [[ -z "$config" ]] && continue
              if [[ -f "$config" ]]; then
                printf '%s\n' "$config" >> /tmp/configs.txt
              else
                echo "Skipping editorial package without generic config: $config"
              fi
            done < /tmp/config-candidates.txt
          fi
          if [[ -s /tmp/configs.txt ]]; then
            cat /tmp/configs.txt
          else
            echo 'No generic editorial configs to apply.'
          fi
      - name: Apply guarded editorial packages
        if: github.event_name != 'pull_request'
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r config; do
            [[ -z "$config" ]] && continue
            python scripts/apply_editorial_draft_once.py --config "$config"
          done < /tmp/configs.txt
      - name: Record results on salvage audit issue
        if: github.event_name != 'pull_request' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Editorial draft update: SUCCESS'
            echo
            if find reports -name summary.md -print -quit | grep -q .; then
              find reports -name summary.md -print -exec cat {} \;
            else
              echo 'No generic editorial package was applicable for this push.'
            fi
          } > /tmp/editorial-comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/editorial-comment.md
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-draft-update
          path: reports/
          if-no-files-found: warn
