name: Inspect recent WordPress media once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-recent-wp-media-once.yml'

permissions:
  contents: read
  issues: write

jobs:
  inspect-media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Read current experimental draft state
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/recent-media.md
          import base64, hashlib, json, os, urllib.parse, urllib.request
          user=os.environ['TSURIKUE_WP_USER']
          pw=os.environ['TSURIKUE_WP_APP_PASSWORD']
          token=base64.b64encode(f'{user}:{pw}'.encode()).decode()
          headers={'Authorization':'Basic '+token,'Accept':'application/json','User-Agent':'tsurikue-block-inspector/1.3'}
          q=urllib.parse.urlencode({'context':'edit','_fields':'id,slug,status,title,content'})
          req=urllib.request.Request('https://tsurikue.com/wp-json/wp/v2/pages/2983?'+q,headers=headers)
          with urllib.request.urlopen(req,timeout=45) as r:
              page=json.loads(r.read().decode())
          content=(page.get('content') or {}).get('raw') or (page.get('content') or {}).get('rendered') or ''
          sha=hashlib.sha256(content.encode()).hexdigest()
          encoded=base64.b64encode(content.encode()).decode()
          print('### Current top-design-lab Gutenberg draft (read-only)')
          print('')
          print(f"- page_id: **{page.get('id')}**")
          print(f"- slug: **{page.get('slug')}**")
          print(f"- status: **{page.get('status')}**")
          print(f"- content_sha256: `{sha}`")
          print(f"- block_comments: **{content.count('<!-- wp:')}**")
          print(f"- cover_blocks: **{content.count('<!-- wp:cover')}**")
          print(f"- group_blocks: **{content.count('<!-- wp:group')}**")
          print(f"- image_blocks: **{content.count('<!-- wp:image')}**")
          print(f"- custom_html_blocks: **{content.count('<!-- wp:html')}**")
          print(f"- has_marker: **{'tsurikue-experimental-page:v1:top-design-lab' in content}**")
          print('')
          print('content_b64:')
          print(encoded)
          PY
      - name: Record on audit issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/recent-media.md
