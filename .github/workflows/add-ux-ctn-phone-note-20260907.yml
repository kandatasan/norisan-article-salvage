name: Add UX CTN phone-volume notes once

on:
  push:
    branches: [main]
    paths:
      - scripts/add_ux_ctn_phone_note_20260907.py
      - .github/workflows/add-ux-ctn-phone-note-20260907.yml

permissions:
  contents: read
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile scripts/add_ux_ctn_phone_note_20260907.py
      - name: Apply guarded notes
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/add_ux_ctn_phone_note_20260907.py | tee /tmp/summary.md
      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### UX CTN phone-volume note'
            echo
            cat /tmp/summary.md 2>/dev/null || echo '- result: **BLOCKED_BEFORE_APPLY**'
          } > /tmp/comment.md
          gh issue comment 380 --repo "${{ github.repository }}" --body-file /tmp/comment.md
