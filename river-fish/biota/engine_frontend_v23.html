<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>つりくえ！生物×水系図鑑 — 集約検索プレビュー v2.3</title>
<style>
  :root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;color:#183730;background:#f2f8f5;line-height:1.6}
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;padding:18px 12px}
  main{max-width:980px;margin:0 auto}
  h1{font-size:clamp(22px,3.4vw,30px);margin:0}
  h2{font-size:19px;margin:0}
  p{margin:8px 0 16px}
  button,input,select{font:inherit;min-height:44px}
  button{cursor:pointer;border:1px solid #b6d2c7;border-radius:10px;padding:9px 13px}
  button:disabled{opacity:.45;cursor:not-allowed}
  button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #77b6a1;outline-offset:2px}
  .panel{background:white;padding:clamp(16px,3vw,26px);border:1px solid #d9e9df;border-radius:18px;margin-bottom:15px;box-shadow:0 3px 14px #214f3c09}
  .muted{font-size:14px;color:#536a61}
  .tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}
  .tabs button{flex:1;min-width:142px;background:#eef6f2;color:#174c39}
  .tabs button[aria-pressed=true]{background:#14624b;color:white;border-color:#14624b;font-weight:700}
  .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
  .field{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600}
  input:not([type=checkbox]),select{border:1px solid #91b7a6;border-radius:9px;padding:10px;background:white;min-width:0;width:100%}
  fieldset{border:1px solid #d6e8e0;border-radius:11px;margin:17px 0 0;padding:13px}
  legend{font-weight:700;font-size:15px;padding:0 7px}
  .group-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .check{display:flex;gap:9px;align-items:center;min-height:40px}
  .check input{width:20px;height:20px;accent-color:#14624b;flex-shrink:0}
  .check.unavailable{color:#7c8884}
  .hint{font-size:12px;color:#64796f;font-weight:400}
  .submit{margin-top:16px;width:100%;background:#14624b;border:0;color:white;font-weight:700}
  .results{display:grid;gap:11px}
  .card{border:1px solid #d9e9df;border-radius:12px;padding:15px;background:#fcfefd}
  .card h3{font-size:17px;margin:0 0 5px;overflow-wrap:anywhere}
  .meta{font-size:14px;color:#405e53}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .chip{background:#e7f3ec;border-radius:40px;padding:4px 10px;font-size:13px}
  .drill{margin-top:10px;background:#14624b;color:white;border:0}
  details{margin-top:10px;font-size:14px}
  details summary{cursor:pointer;font-weight:600}
  details p{overflow-wrap:anywhere}
  .source{color:#14543e;font-size:14px;overflow-wrap:anywhere;display:inline-block;margin-top:7px}
  .paging{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
  .paging button{background:#eef5f1;color:#14543e}
  .notice{border-left:4px solid #ac9854;padding:11px 13px;background:#fbf9ee;color:#635524;margin-top:17px;font-size:13px;line-height:1.7}
  @media(max-width:620px){.fields{grid-template-columns:1fr}.tabs{display:grid;grid-template-columns:1fr}.group-options{grid-template-columns:1fr}.tabs button{width:100%}}
</style>
</head>
<body>
<main>
  <section class="panel">
    <h1>全国生物×水系図鑑</h1>
    <p class="muted">研究用プレビュー v2.3。過去の国土交通省調査を、重複年度をまとめて探せます。現在の生息分布・個々の支流の記録ではありません。</p>
    <div class="tabs" role="group" aria-label="検索する方向">
      <button type="button" data-direction="region_explore" aria-pressed="true">地域 → 水系一覧</button>
      <button type="button" data-direction="watershed_to_organism" aria-pressed="false">水系 → 生物</button>
      <button type="button" data-direction="organism_to_watershed" aria-pressed="false">生物 → 水系</button>
    </div>
    <form id="lookup" novalidate>
      <div class="fields">
        <label class="field">地方（9地方）
          <select name="region">
            <option value="">地方を選択</option>
            <option value="hokkaido">北海道</option><option value="tohoku">東北</option>
            <option value="kanto">関東</option><option value="hokuriku">北陸</option>
            <option value="chubu">中部</option><option value="kinki">近畿</option>
            <option value="chugoku">中国</option><option value="shikoku">四国</option>
            <option value="kyushu">九州</option>
          </select>
        </label>
        <label class="field">水系名（個々の支流とは異なります）
          <input name="watershed" placeholder="例：太田川" autocomplete="off">
        </label>
        <label class="field">生物名（当時の調査記録名）
          <input name="organism" placeholder="例：アユ・モクズガニ" autocomplete="off">
        </label>
        <label class="field">調査年度（任意）
          <input name="year" maxlength="4" inputmode="numeric" placeholder="例：2020">
        </label>
      </div>
      <fieldset>
        <legend>表示する生物（複数選択できます）</legend>
        <div class="group-options" id="available-groups" aria-live="polite"><span class="hint">検証済み分類を読み込んでいます…</span></div>
        <div id="pending-groups" class="group-options"></div>
        <div class="hint">分類はデータセットで検証された区分だけが選べます。掲載名数は正式な種数ではありません。</div>
      </fieldset>
      <button class="submit" type="submit">過去の調査記録を検索</button>
    </form>
  </section>
  <section class="panel" aria-live="polite" aria-atomic="false">
    <h2>検索結果</h2>
    <p class="muted" id="status">地域や水系を選んでください。</p>
    <div class="results" id="records"></div>
    <div class="paging" id="paging" hidden>
      <button type="button" id="previous">前の20件</button>
      <span id="page-indicator" class="muted"></span>
      <button type="button" id="next">次の20件</button>
    </div>
    <div class="notice">
      <b>掲載名数 ≠ 生物の種類数。</b> 当時の表記を調査年度でまとめただけです。
      生息が確認された支流・県、現在の分布、釣りに適した場所、正式な分類同定を示すものではありません。
      検索に出ない生物が存在しないという意味でもありません。
    </div>
  </section>
</main>
<script>
(() => {
  "use strict";
  const form=document.getElementById("lookup");
  const records=document.getElementById("records");
  const status=document.getElementById("status");
  const paging=document.getElementById("paging");
  const previous=document.getElementById("previous");
  const next=document.getElementById("next");
  const indicator=document.getElementById("page-indicator");
  const selectGroups=document.getElementById("available-groups");
  const pendingGroups=document.getElementById("pending-groups");
  const tabs=[...document.querySelectorAll("[data-direction]")];
  const regions={hokkaido:"北海道",tohoku:"東北",kanto:"関東",hokuriku:"北陸",chubu:"中部",kinki:"近畿",chugoku:"中国",shikoku:"四国",kyushu:"九州"};
  let direction="region_explore",page=1,total=0,requestId=0,watershedMatch="contains",catalog=null;
  const node=(tag,text,cls)=>{
    const el=document.createElement(tag);
    if(text!==undefined)el.textContent=text;
    if(cls)el.className=cls;
    return el;
  };
  function countLabel(id){return catalog?.groups.find(g=>g.id===id)?.label||id;}
  function reset(message){
    requestId++;
    records.replaceChildren();paging.hidden=true;page=1;total=0;
    status.textContent=message;
  }
  function switchDirection(to,isDrill=false){
    direction=to;
    for(const tab of tabs)tab.setAttribute("aria-pressed",String(tab.dataset.direction===to));
    if(!isDrill){
      if(to==="region_explore"){form.elements.watershed.value="";form.elements.organism.value="";}
      if(to==="watershed_to_organism")form.elements.organism.value="";
      if(to==="organism_to_watershed")form.elements.watershed.value="";
      watershedMatch="contains";
    }
    reset("検索条件を入力してください。");
  }
  for(const tab of tabs)tab.addEventListener("click",()=>switchDirection(tab.dataset.direction));
  form.elements.watershed.addEventListener("input",()=>{watershedMatch="contains";});
  function addGroup(g,enabled){
    const label=node("label",undefined,"check"+(enabled?"":" unavailable"));
    const check=node("input");check.type="checkbox";check.name="group";check.value=g.id;
    check.disabled=!enabled;check.checked=enabled;
    label.append(check,node("span",g.label));
    if(!enabled)label.append(node("span",g.note||"調査資料の審査待ち","hint"));
    (enabled?selectGroups:pendingGroups).append(label);
  }
  async function loadCatalog(){
    const response=await fetch("/api/catalog",{cache:"no-store"});
    if(!response.ok)throw Error("分類カタログを読み込めません");
    const result=await response.json();
    if(!Array.isArray(result.groups)||!result.groups.length)throw Error("利用できる分類がありません");
    catalog=result;
    selectGroups.replaceChildren();
    pendingGroups.replaceChildren();
    result.groups.forEach(g=>addGroup(g,true));
    for(const [id,note] of Object.entries(result.unavailable_groups||{})){
      addGroup({id,label:id==="birds"?"🐦 鳥類":id==="aquatic_insects"?"🪲 水生昆虫（単独）":id,note},false);
    }
    status.textContent="検索する地方・水系・生物名を選択してください。";
  }
  function sourceLink(card,url){
    if(!/^https:\/\/www\.nilim\.go\.jp\/lab\/fbg\/ksnkankyo\//.test(url||""))return;
    const a=node("a","原資料（国交省）を開く","source");
    a.href=url;a.target="_blank";a.rel="noopener noreferrer";
    card.append(a);
  }
  function showWatershed(row){
    const card=node("article",undefined,"card");
    card.append(node("h3",row.watershed_name+"水系"));
    card.append(node("div",(regions[row.region]||row.region)+"の水系調査記録","meta"));
    const chips=node("div",undefined,"chips");
    for(const [id,n] of Object.entries(row.group_label_counts||{})){
      chips.append(node("span",countLabel(id)+" "+n+"掲載名","chip"));
    }
    card.append(chips);
    card.append(node("div","調査年度の範囲："+row.first_year+"～"+row.last_year+"年（延べ掲載記録 "+row.historical_records+"件）","meta"));
    const drill=node("button","この水系の生物を見る →","drill");drill.type="button";
    drill.addEventListener("click",()=>{
      form.elements.region.value=row.region;
      form.elements.watershed.value=row.watershed_name;
      form.elements.organism.value="";form.elements.year.value="";
      switchDirection("watershed_to_organism",true);
      watershedMatch="exact";
      query();
    });
    card.append(drill);records.append(card);
  }
  function showLabel(row){
    const card=node("article",undefined,"card");
    card.append(node("h3",row.recorded_name+" ／ "+row.watershed_name+"水系"));
    card.append(node("div",(regions[row.region]||row.region)+"・"+countLabel(row.survey_group),"meta"));
    card.append(node("div","過去の掲載 "+row.survey_year_count+"調査年度（延べ "+row.historical_records+"件）","meta"));
    const details=node("details");
    details.append(node("summary","調査年度を確認"));
    details.append(node("p",(row.survey_years||[]).join("年、")+"年","meta"));
    card.append(details);
    sourceLink(card,row.source_url);
    if(row.source_count>1)card.append(node("div","出典は複数資料にまたがります（代表資料へのリンク）。","hint"));
    records.append(card);
  }
  async function query(){
    if(!catalog){reset("データセットの確認がまだ済んでいません。");return;}
    const params=new URLSearchParams(new FormData(form));
    params.set("direction",direction);
    params.set("watershed_match",watershedMatch);
    params.set("page",String(page));params.set("per_page","20");
    if(!params.has("group")){reset("生物分類を1つ以上選んでください。");return;}
    if(direction==="region_explore"&&!params.get("region")){reset("地方を選んでください。");return;}
    if(direction==="watershed_to_organism"&&!params.get("watershed")?.trim()){reset("水系名を入力してください。");return;}
    if(direction==="organism_to_watershed"&&!params.get("organism")?.trim()){reset("生物名を入力してください。");return;}
    const id=++requestId;
    records.replaceChildren();paging.hidden=true;status.textContent="検索中…";
    try{
      const response=await fetch("/api/compact?"+params.toString(),{cache:"no-store"});
      const result=await response.json();
      if(id!==requestId)return;
      if(!response.ok)throw Error(result.error||"検索できませんでした");
      total=result.total;
      const unit=result.result_type==="watershed_summary"?"水系":"水系ごとの掲載名";
      status.textContent=total.toLocaleString()+"件の"+unit+"が見つかりました。";
      for(const r of result.results){
        if(result.result_type==="watershed_summary")showWatershed(r);
        else showLabel(r);
      }
      if(!result.results.length)records.append(node("p","資料上の掲載記録が見つかりませんでした（生息しないという意味ではありません）。"));
      paging.hidden=!total;
      previous.disabled=page<=1;next.disabled=page*20>=total;
      indicator.textContent=page+" / "+Math.ceil(total/20)+"ページ";
    }catch(e){if(id===requestId)status.textContent=e.message||"検索エラー";}
  }
  form.addEventListener("submit",e=>{e.preventDefault();page=1;query();});
  previous.addEventListener("click",()=>{if(page>1){page--;query();}});
  next.addEventListener("click",()=>{if(page*20<total){page++;query();}});
  loadCatalog().catch(e=>{selectGroups.replaceChildren();status.textContent=e.message||"データの確認に失敗しました";});
})();
</script>
</body>
</html>
