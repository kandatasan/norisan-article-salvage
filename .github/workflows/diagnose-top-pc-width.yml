name: Diagnose top PC width

on:
  push:
    branches: [diag/top-pc-width]
    paths:
      - '.github/workflows/diagnose-top-pc-width.yml'
      - 'experimental-pages/top-design-lab/diagnose_pc_width.js'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - run: node experimental-pages/top-design-lab/diagnose_pc_width.js
