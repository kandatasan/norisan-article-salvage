name: River fish data tests

on:
  pull_request:
    paths:
      - 'river-fish/**'
      - '.github/workflows/river-fish-data-tests.yml'
  push:
    branches: [main]
    paths:
      - 'river-fish/**'
      - '.github/workflows/river-fish-data-tests.yml'

permissions:
  contents: read

jobs:
  check-fish-search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source-backed search and alien classification
        run: |
          python -m unittest discover -s river-fish -p 'test_search_v04.py' -v
          python -m unittest discover -s river-fish -p 'test_*v05.py' -v
          python -m unittest discover -s river-fish -p 'test_nationwide_v06.py' -v
          python -m unittest discover -s river-fish -p 'test_national_registry_v06.py' -v
          python -m unittest discover -s river-fish -p 'test_nationwide_search_v06.py' -v
          python -m unittest discover -s river-fish -p 'test_national_river_codes_v07.py' -v
          python -m unittest discover -s river-fish -p 'test_national_river_catalog_v07.py' -v
          python -m unittest discover -s river-fish -p 'test_river_identity_ecology_v08.py' -v
          python -m unittest discover -s river-fish -p 'test_historical_ledger_v09.py' -v
          python -m unittest discover -s river-fish -p 'test_municipality_sources_v09.py' -v
          python -m unittest discover -s river-fish -p 'test_chugoku_registry_v10.py' -v
          python -m unittest discover -s river-fish -p 'test_tottori_river_pdfs_v11.py' -v
          python -m unittest discover -s river-fish -p 'test_tottori_detailed_registry_v11.py' -v
          python -m unittest discover -s river-fish -p 'test_japan_unified_registry_v12.py' -v

      - name: Verify real nine-region fish search when staged data is present
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'river-fish')
          from pathlib import Path
          from search_nationwide_v06 import search
          stage=Path('river-fish/nationwide-staged')
          if not stage.exists():
              print('No national staging data in this revision; no claims about nationwide readiness.')
          else:
              result=search(limit=5)
              assert result['total']==18814, result['total']
              assert len(result['loaded_regions'])==9
              assert all(x['prefecture'] is None for x in result['records'])
              assert all(x['river_name'] is None for x in result['records'])
              assert all(x['direct_tributary_evidence'] is False for x in result['records'])
              fish=search(region='kyushu',name='アユ',limit=5)
              assert fish['total']>0
              assert all(x['source_region']=='kyushu' for x in fish['records'])
              print('Nationwide fish search passed:',result['total'],'records over',len(result['loaded_regions']),'source regions')
          PY
