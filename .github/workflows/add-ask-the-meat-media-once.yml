name: Add Ask the Meat media once
on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_ask_the_meat_media_once.py'
      - '.github/workflows/add-ask-the-meat-media-once.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m py_compile scripts/add_ask_the_meat_media_once.py
      - name: Add existing WordPress media to Ask the Meat
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          python scripts/add_ask_the_meat_media_once.py | tee /tmp/ask-meat-media.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ask-the-meat-media-audit
          path: /tmp/ask-meat-media.json
          if-no-files-found: warn
