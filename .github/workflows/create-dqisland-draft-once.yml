name: Create Dragon Quest Island draft once

on:
  push:
    branches: [main]
    paths:
      - 'editorial/dqisland/content.html'
      - 'editorial/dqisland/img_3122.jpg.b64'
      - 'scripts/create_dqisland_draft_once.py'
      - '.github/workflows/create-dqisland-draft-once.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Syntax check
        run: python -m py_compile scripts/create_dqisland_draft_once.py
      - name: Normalize and verify embedded mug payload settings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          image_path = Path('editorial/dqisland/img_3122.jpg.b64')
          image_path.write_text(''.join(image_path.read_text(encoding='utf-8').split()), encoding='utf-8')
          script_path = Path('scripts/create_dqisland_draft_once.py')
          text = script_path.read_text(encoding='utf-8')
          old_sha = 'e5ca43b121cd565b1783422835f35665587decc965a5917bf275f2e6a079903b'
          new_sha = 'fd9c357b980417eb131b1d554a6abbad4218eb3a950e381baf25ca8472465c45'
          if old_sha not in text:
              raise SystemExit('expected original mug SHA marker missing')
          script_path.write_text(text.replace(old_sha, new_sha, 1), encoding='utf-8')
          PY
      - name: Create guarded WordPress draft
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/create_dqisland_draft_once.py
      - name: Record result on salvage audit issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Dragon Quest Island draft: SUCCESS'
            echo
            cat reports/dqisland-create/summary.md
          } > /tmp/dqisland-comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/dqisland-comment.md
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dqisland-draft-create
          path: reports/dqisland-create/
          if-no-files-found: warn
