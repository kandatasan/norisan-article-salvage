name: Discover prefectural river-biota evidence v10 (research only)
on:
  push:
    branches: [research/river-biota-new-sources-20261020]
    paths:
      - 'river-fish/research-individual-v10/*.py'
      - '.github/workflows/river-biota-new-sources-v10.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: extra-prefecture-biota-v10
  cancel-in-progress: true
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate read-only source probes
        run: python -m py_compile river-fish/research-individual-v10/*.py
      - name: Inspect public Kanagawa prefectural eDNA spreadsheet evidence
        run: |
          mkdir -p river-fish/research-individual-v10/outputs
          python river-fish/research-individual-v10/probe_kanagawa_edna_source_v10.py \
            --out river-fish/research-individual-v10/outputs/kanagawa_edna_public_source_probe_v10.json
      - name: Install PDF table extraction engine
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Cross-verify Hiroshima City four small rivers from two official reports
        continue-on-error: true
        run: |
          python river-fish/research-individual-v10/probe_hiroshima_small_rivers_v10.py \
            --out river-fish/research-individual-v10/outputs/hiroshima_municipal_smallstream_source_probe_v10.json
      - name: Inspect actual 2025 eDNA sheet layout (method-separated)
        run: |
          python river-fish/research-individual-v10/inspect_kanagawa_sheet_columns_v10.py \
            --out river-fish/research-individual-v10/outputs/kanagawa_sheet_layout_v10.json
      - name: Check acquisition honesty
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("river-fish/research-individual-v10/outputs/kanagawa_edna_public_source_probe_v10.json").read_text())
          assert j["survey_method"]=="environmental_DNA_detection_not_capture_or_visual_sighting"
          assert j["new_rivers_approved"]==0
          assert j["promoted_as_direct_fish_capture"] is False
          assert len(j["sheet_structure"]["sheets"])>0
          assert j["source_file_candidates"]
          assert j["precise_sampling_locations_collected"] is False
          print("VALIDATED_OFFICIAL_PREFECTURAL_EDNA_SOURCE",len(j["sheet_structure"]["sheets"]))
          PY
      - name: Upload source audits
        uses: actions/upload-artifact@v4
        with:
          name: biota-prefecture-source-inventory-v10
          path: river-fish/research-individual-v10/outputs/
          if-no-files-found: error
      - name: Commit source audits in research branch only
        run: |
          test "$GITHUB_REF_NAME" = "research/river-biota-new-sources-20261020"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add river-fish/research-individual-v10/outputs/
          if ! git diff --cached --quiet; then
            git commit -m "research: store new Kanagawa eDNA official source structures and reuse conditions"
            git push origin HEAD:refs/heads/research/river-biota-new-sources-20261020
          fi
