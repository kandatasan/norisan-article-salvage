name: Style outing dark hero once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/style-outing-dark-hero-once.yml'
      - 'ops/outing-hero-dark/**'

jobs:
  style:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Backup current WordPress outing draft
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python ops/outing-hero-dark/guard.py backup

      - name: Patch canonical hero styling
        run: |
          python ops/outing-hero-dark/patch.py
          git diff --check

      - name: Deploy styled hero to WordPress draft only
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            echo "outing dark hero deploy attempt ${attempt}/3"
            if python category-hubs/outing/deploy.py; then exit 0; fi
            if [[ "$attempt" != 3 ]]; then sleep 8; fi
          done
          exit 1

      - name: Verify WordPress hero styling
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python ops/outing-hero-dark/guard.py verify

      - name: Commit canonical styled source
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add category-hubs/outing/content.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Style outing hero with dark overlay'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Restore previous draft if styling failed
        if: failure()
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python ops/outing-hero-dark/guard.py restore

      - name: Success summary
        if: success()
        run: echo 'OUTING_DARK_HERO_STYLE_COMPLETE'
