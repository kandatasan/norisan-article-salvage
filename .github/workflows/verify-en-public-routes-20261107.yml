name: Verify live English URL, canonical, and hreflang
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-en-public-routes-20261107.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check public URLs and SEO tags (read only)
        shell: bash
        run: |
          python - <<'PY'
          import re, ssl, urllib.request, urllib.error, json
          base='https://tsurikue.com'
          cases=[('JA_ORIZURU','/orizuru-tower/'),('EN_ORIZURU','/en/orizuru-tower/'),('EN_OLD_SLUG','/orizuru-tower-english/'),('JA_YAMAGUCHI','/yamaguchi-drive/'),('EN_YAMAGUCHI_DRAFT','/en/yamaguchi-road-trip/')]
          for label,path in cases:
              req=urllib.request.Request(base+path,headers={'User-Agent':'tsurikue-en-seo-readonly-check/1.0','Accept':'text/html','Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(req,timeout=35) as resp:
                      body=resp.read(600000).decode('utf-8','replace')
                      final=resp.geturl()
                      status=resp.status
              except urllib.error.HTTPError as exc:
                  body=exc.read(100000).decode('utf-8','replace')
                  final=exc.geturl()
                  status=exc.code
              except Exception as exc:
                  print('PROBE '+label+' network_error='+repr(exc))
                  continue
              from html.parser import HTMLParser
              class MetaTags(HTMLParser):
                  def __init__(self):
                      super().__init__()
                      self.lang=''
                      self.canonical=[]
                      self.hreflang=[]
                  def handle_starttag(self, tag, attrs):
                      attrs=dict(attrs)
                      if tag=='html': self.lang=attrs.get('lang','')
                      if tag=='link':
                          if 'canonical' in (attrs.get('rel') or '').split(): self.canonical.append(attrs.get('href',''))
                          if attrs.get('hreflang'): self.hreflang.append({'lang':attrs.get('hreflang'),'url':attrs.get('href')})
              meta=MetaTags()
              meta.feed(body)
              html_tag=meta.lang
              canon=meta.canonical
              langs=meta.hreflang
              switch='tsurikue-en-language-switch' in body
              print('PROBE '+json.dumps({'label':label,'status':status,'final_url':final,'html_lang':html_tag,'canonical':canon[:3],'hreflang':langs[:5],'language_switch_visible':switch,'body_bytes':len(body)},ensure_ascii=False))
          print('WORDPRESS_WRITE_COUNT=0')
          PY
