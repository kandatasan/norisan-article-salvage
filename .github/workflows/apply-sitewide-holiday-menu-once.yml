name: Apply sitewide holiday menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sitewide-holiday-menu-once.yml'
      - 'sitewide-nav/nav-block.html'
      - 'sitewide-nav/deploy.py'
      - 'sitewide-nav/verify_canary.js'
      - 'sitewide-nav/verify_rollout.js'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply synced navigation to one canary article
        id: canary_apply
        continue-on-error: true
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python sitewide-nav/deploy.py canary

      - name: Roll back canary if apply failed
        if: steps.canary_apply.outcome == 'failure'
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python sitewide-nav/deploy.py rollback-canary

      - name: Stop after canary apply failure
        if: steps.canary_apply.outcome == 'failure'
        run: exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser verifier
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Verify canary on mobile and desktop
        id: canary_verify
        continue-on-error: true
        run: node sitewide-nav/verify_canary.js

      - name: Roll back canary if browser verification failed
        if: steps.canary_verify.outcome == 'failure'
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python sitewide-nav/deploy.py rollback-canary

      - name: Stop after canary browser failure
        if: steps.canary_verify.outcome == 'failure'
        run: exit 1

      - name: Roll out synced navigation to all published and draft posts/pages except top
        id: rollout_apply
        continue-on-error: true
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python sitewide-nav/deploy.py rollout

      - name: Roll back current rollout if apply failed
        if: steps.rollout_apply.outcome == 'failure'
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python sitewide-nav/deploy.py rollback-rollout

      - name: Stop after rollout apply failure
        if: steps.rollout_apply.outcome == 'failure'
        run: exit 1

      - name: Verify representative pages after rollout
        id: rollout_verify
        continue-on-error: true
        run: node sitewide-nav/verify_rollout.js

      - name: Roll back current rollout if representative verification failed
        if: steps.rollout_verify.outcome == 'failure'
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python sitewide-nav/deploy.py rollback-rollout

      - name: Stop after rollout browser failure
        if: steps.rollout_verify.outcome == 'failure'
        run: exit 1

      - name: Success summary
        run: echo 'SITEWIDE_HOLIDAY_MENU_DEPLOYED_AND_VERIFIED'
