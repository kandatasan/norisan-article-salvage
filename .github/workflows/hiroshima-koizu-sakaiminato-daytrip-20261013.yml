name: New day-trip draft Hiroshima Koizu Sakaiminato
on:
  pull_request:
    branches: [main]
    paths:
      - 'content/drafts/hiroshima-koizu-sakaiminato-daytrip-20261013.json'
      - 'scripts/create_hiroshima_koizu_sakaiminato_daytrip_20261013.py'
      - '.github/workflows/hiroshima-koizu-sakaiminato-daytrip-20261013.yml'
  push:
    branches: [main]
    paths:
      - 'content/drafts/hiroshima-koizu-sakaiminato-daytrip-20261013.json'
      - 'scripts/create_hiroshima_koizu_sakaiminato_daytrip_20261013.py'
      - '.github/workflows/hiroshima-koizu-sakaiminato-daytrip-20261013.yml'
permissions:
  contents: read
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check live WP related articles, duplicate route, exact photo matches and draft text
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/create_hiroshima_koizu_sakaiminato_daytrip_20261013.py check
      - name: Create exactly one new DRAFT post and verify saved WP state
        if: github.event_name == 'push'
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/create_hiroshima_koizu_sakaiminato_daytrip_20261013.py apply
