name: CTN final microcopy polish and live QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ctn_microcopy_polish_20261012.py'
  push:
    branches: [main]
    paths:
      - 'scripts/ctn_microcopy_polish_20261012.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Preflight six copy-only adjustments
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/ctn_microcopy_polish_20261012.py ${{ github.event_name == 'pull_request' && 'inspect' || 'check' }}
      - name: Apply and independently audit all 23 CTN posts
        if: github.event_name == 'push'
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/ctn_microcopy_polish_20261012.py apply
