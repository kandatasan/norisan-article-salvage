name: Audit current unpublished WordPress inventory

on:
  push:
    branches: [main]
    paths:
      - scripts/audit_unpublished_inventory_20260927.py
      - .github/workflows/audit-unpublished-inventory-20260927.yml

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run GET-only WordPress inventory audit
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: |
          python -m py_compile scripts/audit_unpublished_inventory_20260927.py
          python scripts/audit_unpublished_inventory_20260927.py
      - name: Record audit in issue 22
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Current unpublished inventory audit 2026-09-27'
            echo
            cat reports/unpublished-inventory-20260927/summary.md
          } > /tmp/comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-inventory-20260927
          path: reports/unpublished-inventory-20260927/
          if-no-files-found: warn
