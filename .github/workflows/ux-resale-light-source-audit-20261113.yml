name: UX resale light additions audit (read-only)
on:
  push:
    branches: [ux-resale-light-touch-additions-20261113]
    paths: [.github/workflows/ux-resale-light-source-audit-20261113.yml, scripts/add_ux_resale_light_touch_20261113.py]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current original UX resale paragraphs, then preflight
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,base64,html,json,re,os,sys,urllib.request
          BASE="https://tsurikue.com/wp-json/wp/v2"
          auth="Basic "+base64.b64encode((os.environ["TSURIKUE_WP_USER"]+":"+os.environ["TSURIKUE_WP_APP_PASSWORD"]).encode()).decode()
          req=urllib.request.Request(BASE+"/posts/2222?context=edit&_fields=id,slug,status,title,content,featured_media,categories,author,modified",headers={"Authorization":auth,"Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=35) as f: post=json.load(f)
          body=post["content"]["raw"];print("POST_META",json.dumps({k:post[k] for k in ["id","slug","status","featured_media","categories","author","modified"]},ensure_ascii=False))
          print("POST_TITLE",post["title"]["raw"])
          print("BODY_SHA256",hashlib.sha256(body.encode()).hexdigest(),"CHARS",len(body))
          print("GUTENBERG_COUNTS","paragraphs",body.count("<!-- wp:paragraph"),"headings",body.count("<!-- wp:heading"),"images",body.count("<!-- wp:image"),"list",body.count("<!-- wp:list"),"table",body.count("<!-- wp:table"),"CTN",body.count('[blog_parts id="4521"]'))
          pattern=re.compile(r'<!-- wp:(paragraph|heading|table|list|image|shortcode)(?: [^\n]*?)? -->(.*?)<!-- /wp:\1 -->',re.S)
          for i,m in enumerate(pattern.finditer(body)):
              x=m.group(2)
              plain=html.unescape(re.sub(r'<[^>]+>','',x)).replace("\n"," ").strip()
              if m.group(1)=="paragraph":print("PARAGRAPH",i,plain[:600])
              elif m.group(1)=="heading":print("HEADING",i,plain[:300])
              elif m.group(1)=="list":print("LIST",i,plain[:500])
              elif m.group(1)=="image":print("IMAGE",i,re.findall(r'wp-image-\d+',x))
              elif m.group(1)=="shortcode":print("SHORTCODE",i,plain[:300])
              elif m.group(1)=="table":print("TABLE",i,plain[:700])
          try:
              sys.path.insert(0,'scripts')
              from add_ux_resale_light_touch_20261113 import transform
          except ImportError:
              print("PREFLIGHT_NO_SCRIPT_YET")
          else:
              after=transform(body)
              print("PREFLIGHT_NEW_SHA256",hashlib.sha256(after.encode()).hexdigest())
              print("PREFLIGHT_SUMMARY","old_len",len(body),"new_len",len(after),"new_heading_count",after.count("<!-- wp:heading"),"new_paragraph_count",after.count("<!-- wp:paragraph"),"new_list_count",after.count("<!-- wp:list"))
              print("PREFLIGHT_SUCCESS_ZERO_WRITES")
          PY