name: Fish editorial evidence prep v16
on:
  push:
    branches:
      - research/fish-editorial-v16-20261020
    paths:
      - 'river-fish/research-individual-v16/**'
      - '.github/workflows/river-fish-editorial-v16.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fish-editorial-v16
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original fish names and create editorial worksheet
        run: |
          python -m py_compile river-fish/research-individual-v16/export_fish_names_v16.py
          python river-fish/research-individual-v16/export_fish_names_v16.py
      - name: Build draft-marked fish cards and audit all classified names
        run: |
          set -o pipefail
          {
            python -m py_compile river-fish/research-individual-v16/build_fish_editorial_v16.py
            python river-fish/research-individual-v16/build_fish_editorial_v16.py
          } 2>&1 | tee /tmp/fish_v16_buildlog.txt
      - name: Validate JavaScript in the standalone fish UI
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('river-fish/research-individual-v16/viewer_fish_editorial_v16.html').read_text()
          assert page.count('<script>')==page.count('</script>')==1
          Path('/tmp/tsurikue_fish_v16.js').write_text(page.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/tsurikue_fish_v16.js
      - name: Preserve failure diagnostic
        if: failure()
        run: |
          mkdir -p river-fish/research-individual-v16/outputs/
          python - <<'PY'
          import json
          from pathlib import Path
          l=Path('/tmp/fish_v16_buildlog.txt')
          msg=l.read_text(errors='replace') if l.exists() else 'no build log'
          Path('river-fish/research-individual-v16/outputs/editorial_v16_failure.json').write_text(json.dumps({'status':'FAILED_NO_APPROVED_EDITORIAL_RATINGS','error_tail':msg[-7000:]},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Remove stale failure diagnostics on verified success
        if: success()
        run: rm -f river-fish/research-individual-v16/outputs/editorial_v16_failure.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsurikue-fish-draft-stars-v16-research-only
          path: river-fish/research-individual-v16/outputs/
      - name: Preserve inventory for editor review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add river-fish/research-individual-v16/outputs/
          if ! git diff --cached --quiet; then
            git commit -m "research: verified fish 639-name audit and explicitly provisional editorial v16"
            git push origin HEAD:refs/heads/research/fish-editorial-v16-20261020
          fi
