name: Audit UX300h affiliate state

on:
  push:
    branches:
      - main
    paths:
      - scripts/audit_ux300h_affiliate_current.py
      - .github/workflows/apply-ux-koukai-final-polish.yml

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile audit
        run: python -m py_compile scripts/audit_ux300h_affiliate_current.py
      - name: Audit current WordPress state
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/audit_ux300h_affiliate_current.py
      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          { echo '### ux300h fresh affiliate audit'; echo; cat reports/ux300h-affiliate-current/summary.md 2>/dev/null || echo '- result: **BLOCKED**'; } > /tmp/comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux300h-affiliate-current
          path: reports/ux300h-affiliate-current/
          if-no-files-found: warn
