name: Apply Phase 4 source rollback

on:
  push:
    branches: [main]
    paths:
      - 'phase4-restore-apply/**'
  workflow_dispatch:
    inputs:
      config_path:
        description: 'Phase 4 rollback config path'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  rollback-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Resolve config
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            printf '%s\n' '${{ inputs.config_path }}' > /tmp/configs.txt
          else
            git diff --name-only HEAD^ HEAD -- 'phase4-restore-apply/*.json' | sort -u > /tmp/configs.txt
          fi
          test -s /tmp/configs.txt
          cat /tmp/configs.txt
      - name: Apply guarded rollback to original Phase 4 source
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r config; do
            PYTHONPATH=scripts python scripts/rollback_editorial_draft_to_phase4_source.py --config "$config"
          done < /tmp/configs.txt
      - name: Record rollback on audit issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Phase 4 source rollback: SUCCESS'
            echo
            find reports/phase4-restore-apply -name summary.md -print -exec cat {} \;
          } > /tmp/comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Upload rollback result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-source-rollback
          path: reports/phase4-restore-apply/
          if-no-files-found: warn
