name: Full Gulliver legacy inventory with SHA guards
on:
  push:
    branches: [migrate-old-gulliver-tracked-buttons-20261113]
    paths: [.github/workflows/full-gulliver-inventory-20261113.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Inspect every published post for legacy Gulliver blocks and exact SHA
        env:
          WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          WP_PASS: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,html,json,os,re,urllib.request
          auth='Basic '+base64.b64encode((os.environ['WP_USER']+':'+os.environ['WP_PASS']).encode()).decode()
          req=urllib.request.Request('https://tsurikue.com/wp-json/wp/v2/posts?context=edit&status=publish&per_page=100&page=1&_fields=id,slug,status,title,content,featured_media,categories,author',headers={'Authorization':auth})
          def get(page):
              req=urllib.request.Request(f'https://tsurikue.com/wp-json/wp/v2/posts?context=edit&status=publish&per_page=100&page={page}&_fields=id,slug,status,title,content,featured_media,categories,author',headers={'Authorization':auth})
              with urllib.request.urlopen(req,timeout=45) as f:return json.load(f)
          posts=get(1)+get(2)
          for p in posts:
              b=p['content']['raw'];parts=re.findall(r'\[blog_parts id="(2843|4172)"\]',b);old_micro=b.count('tsq-gulliver-micro-20261014')
              if parts or old_micro:
                  item=dict(id=p['id'],slug=p['slug'],title=html.unescape(p['title']['raw']),
                    sha=hashlib.sha256(b.encode()).hexdigest(),chars=len(b),categories=p['categories'],featured_media=p['featured_media'],
                    old_parts=parts,old_micro=old_micro,
                    gulliver_affiliate_count=b.count('a8mat=4B65SD+8DUSHE+9QU+NVHCY'),
                    current_ctn=b.count('[blog_parts id="4521"]'),
                    current_gulliver_parts=b.count('[blog_parts id="4507"]'),
                    paragraphs=b.count('<!-- wp:paragraph'),images=b.count('<!-- wp:image'),tables=b.count('<!-- wp:table'),
                    headings=b.count('<!-- wp:heading'),buttons=b.count('<!-- wp:loos/button'),is_count=b.count('"isCount":true'))
                  print('LEGACY_POST',json.dumps(item,ensure_ascii=False),flush=True)
          print('TOTAL_ALL',len(posts))
          PY