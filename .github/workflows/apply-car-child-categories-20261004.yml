name: Apply car child categories 2026-10-04

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_car_child_categories_20261004.py'
      - '.github/workflows/apply-car-child-categories-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply guarded car child categories
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/apply_car_child_categories_20261004.py
      - name: Record result on audit issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Car child categories: SUCCESS'; echo; cat reports/car-child-categories/summary.md; } > /tmp/comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: car-child-categories-result
          path: reports/car-child-categories/
          if-no-files-found: warn
