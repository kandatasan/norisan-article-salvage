name: Rebuild outing clean v10 once
on:
  push:
    branches: [main]
    paths:
      - 'category-hubs/outing-v10/rebuild_and_swap.py'
      - '.github/workflows/rebuild-outing-clean-v10-once.yml'
permissions:
  contents: read
jobs:
  rebuild-swap-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Correct v10 source guards and add fresh-page diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('category-hubs/outing-v10/rebuild_and_swap.py')
          s=p.read_text(encoding='utf-8')
          replacements={
            "TEMP_SLUG='odekake-clean-v10-preview'":"TEMP_SLUG='odekake-clean-v10b-preview'",
            "'hero_first':s.find('<!-- wp:cover')<s.find('<!-- wp:html')<s.find('<!-- wp:group'),":"'hero_first':s.find('<!-- wp:cover')>=0 and s.find('<!-- wp:cover')<s.find('<!-- wp:html'),",
            "'no_alignfull':'alignfull' not in s,":"'root_no_alignfull':'<div class=\"wp-block-group tq-outing-clean\">' in s and '<div class=\"wp-block-group alignfull tq-outing-clean\">' not in s,",
            "farText:far?far.innerText:'',title:q('.c-pageTitle')?getComputedStyle(q('.c-pageTitle')).display:null,breadcrumb:q('.p-breadcrumb')?getComputedStyle(q('.p-breadcrumb')).display:null,auto:document.documentElement.dataset.tqOutingAuto||null};":
            "farText:far?far.textContent:'',content:r(q('#content')),main:r(q('#main_content')),inner:r(q('.l-mainContent__inner')),contentStyle:q('#content')?{marginTop:getComputedStyle(q('#content')).marginTop,paddingTop:getComputedStyle(q('#content')).paddingTop}:null,contentPrev:q('#content')&&q('#content').previousElementSibling?{tag:q('#content').previousElementSibling.tagName,cls:q('#content').previousElementSibling.className,display:getComputedStyle(q('#content').previousElementSibling).display,rect:r(q('#content').previousElementSibling)}:null,bodyChildren:q('#body_wrap')?Array.from(q('#body_wrap').children).map(e=>({tag:e.tagName,id:e.id,cls:e.className,display:getComputedStyle(e).display,marginTop:getComputedStyle(e).marginTop,paddingTop:getComputedStyle(e).paddingTop,rect:r(e)})):[],title:q('.c-pageTitle')?getComputedStyle(q('.c-pageTitle')).display:null,breadcrumb:q('.p-breadcrumb')?getComputedStyle(q('.p-breadcrumb')).display:null,auto:document.documentElement.dataset.tqOutingAuto||null};"
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('expected v10 diagnostic target not found: '+old[:90])
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check
        run: python -m py_compile category-hubs/outing-v10/rebuild_and_swap.py
      - name: Install render audit dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet selenium
      - name: Build fresh diagnostic page and verify
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: |
          set -euo pipefail
          python category-hubs/outing-v10/rebuild_and_swap.py | tee /tmp/outing-v10.log
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outing-v10-clean-rebuild-audit
          path: |
            /tmp/outing-v10-result.json
            /tmp/outing-v10.log
          if-no-files-found: warn
