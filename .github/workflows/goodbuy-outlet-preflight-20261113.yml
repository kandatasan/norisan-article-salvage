name: Goodbuy new outlet read-only preflight
on:
  push:
    branches: [goodbuy-new-ctn-gulliver-exits-20261113]
    paths:
      - '.github/workflows/goodbuy-outlet-preflight-20261113.yml'
      - 'scripts/replace_goodbuy_ctn_gulliver_outlets_20261113.py'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact WP current article and both published CTA blog parts (zero writes)
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,sys,urllib.request
          sys.path.insert(0,'scripts')
          from replace_goodbuy_ctn_gulliver_outlets_20261113 import transform
          base='https://tsurikue.com/wp-json/wp/v2'
          auth='Basic '+base64.b64encode((os.environ['TSURIKUE_WP_USER']+':'+os.environ['TSURIKUE_WP_APP_PASSWORD']).encode()).decode()
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':auth,'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=40) as f:return json.load(f)
          post=get('/posts/3835?context=edit&_fields=id,slug,status,title,content,featured_media')
          original=post['content']['raw']
          updated=transform(original)
          print('PREFLIGHT_POST',post['id'],post['slug'],post['status'],post['title']['raw'])
          print('PREFLIGHT_SHA',hashlib.sha256(original.encode()).hexdigest(),hashlib.sha256(updated.encode()).hexdigest())
          print('PREFLIGHT_SHORTCODES',original.count('[blog_parts id="4521"]'),updated.count('[blog_parts id="4521"]'),updated.count('[blog_parts id="4507"]'))
          print('PREFLIGHT_ORIGINAL_PHOTOS',original.count('<!-- wp:image'),updated.count('<!-- wp:image'))
          for part_id in (4521,4507):
              part=get(f'/blog_parts/{part_id}?context=edit&_fields=id,status,title,content')
              print('PREFLIGHT_PART',part['id'],part['status'],part['title']['raw'])
          print('PREFLIGHT_SUCCESS_ZERO_WRITES')
          PY