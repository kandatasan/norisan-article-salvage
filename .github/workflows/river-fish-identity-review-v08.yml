name: Verify Hiroshima river identity and fish narrative review v0.8

on:
  pull_request:
    paths:
      - 'river-fish/review_hiroshima_code_links_v08.py'
      - 'river-fish/river_review_catalog_v08.py'
      - 'river-fish/test_river_identity_ecology_v08.py'
      - 'river-fish/hiroshima_river_fish_narratives_v08.csv'
      - '.github/workflows/river-fish-identity-review-v08.yml'

permissions:
  contents: write

jobs:
  audit-identity-candidates:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/river-identity-ecology-review-v08-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test candidate mapping safety and ecology evidence scope
        run: python -m unittest discover -s river-fish -p 'test_river_identity_ecology_v08.py' -v
      - name: Export unapproved candidates from real national code source
        run: python river-fish/review_hiroshima_code_links_v08.py --out river-fish/review-staged
      - name: Check source records and nonapproved status
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('river-fish/review-staged')
          m=json.loads((root/'river_code_candidates_manifest_v08.json').read_text())
          with (root/'hiroshima_river_code_candidates_v08.csv').open(encoding='utf-8',newline='') as f:
              candidates=list(csv.DictReader(f))
          assert m['base_registry_evidence']==66
          assert m['municipality_mention_evidence']==98
          assert m['total_local_evidence']==164
          assert len(candidates)==m['candidate_rows_including_no_matches']
          assert len({x['local_evidence_id'] for x in candidates})==164
          assert all(x['identity_approved']=='false' and x['fish_attribution_approved']=='false'
                     and x['prefecture_attribution_approved']=='false' for x in candidates)
          assert any(x['river_name_in_source']=='諸木川' and
                     x['candidate_river_code']=='8707090023' for x in candidates)
          assert m['publication_status']=='research_only'
          print('REVIEW_SOURCE_COUNT',m['total_local_evidence'])
          print('REVIEW_CANDIDATE_ROWS',len(candidates))
          for key,val in m['candidate_counts_by_evidence_and_status'].items():
              print('MATCH_STATUS',key,val)
          print('NO_CODE_TO_PREFECTURE_OR_FISH_LINKS_APPROVED')
          PY
      - name: Check SQLite review catalog
        run: |
          python river-fish/river_review_catalog_v08.py --build --db /tmp/river-review-v08.sqlite
          python - <<'PY'
          import sqlite3
          c=sqlite3.connect('/tmp/river-review-v08.sqlite')
          assert c.execute('SELECT COUNT(*) FROM narrative_fish_mentions').fetchone()[0]==9
          assert c.execute('SELECT COUNT(*) FROM identity_candidates').fetchone()[0]>=164
          assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          print('REVIEW_DB_OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hiroshima-river-code-review-v08
          path: river-fish/review-staged/
          retention-days: 30
      - name: Save only reviewed research staging files on this PR branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add river-fish/review-staged/
          if git diff --staged --quiet; then
            echo 'Staging already unchanged'
          else
            git commit -m 'Stage Hiroshima river identity code candidates for manual review'
            git fetch origin "$HEAD_BRANCH"
            git rebase FETCH_HEAD
            git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          fi
