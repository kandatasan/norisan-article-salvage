name: UX used read-only paragraph audit
on:
  push:
    branches: [refine-lexus-ux-used-voice-breaks-20261113]
    paths:
      - '.github/workflows/ux-used-paragraph-audit-20261113.yml'
      - 'scripts/refine_ux_used_voice_breaks_20261113.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch article and print block structure (no WordPress writes)
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,hashlib,re,html,base64,urllib.request
          user=os.environ['TSURIKUE_WP_USER']; pwd=os.environ['TSURIKUE_WP_APP_PASSWORD']
          token=base64.b64encode((user+':'+pwd).encode()).decode()
          url='https://tsurikue.com/wp-json/wp/v2/posts/2948?context=edit&_fields=id,slug,status,title,featured_media,categories,author,content'
          req=urllib.request.Request(url,headers={'Authorization':'Basic '+token,'Accept':'application/json','User-Agent':'ux-used-readonly-breaks'})
          with urllib.request.urlopen(req,timeout=45) as res: row=json.loads(res.read())
          body=row['content']['raw']
          print('META',json.dumps({k:row[k] for k in ['id','slug','status','featured_media','categories','author']},ensure_ascii=False))
          print('BODY_SHA',hashlib.sha256(body.encode()).hexdigest(), 'LENGTH',len(body))
          ptn=re.compile(r'<!-- wp:(paragraph|heading)(?: [^\n]*?)? -->\s*<(?:p|h[23])[^>]*>(.*?)</(?:p|h[23])>\s*<!-- /wp:\1 -->',re.S)
          for i,m in enumerate(ptn.finditer(body)):
            inner=m.group(2)
            t=html.unescape(re.sub(r'<[^>]*?>','',inner)).strip()
            t=t.replace('\n',' ')
            print('BLOCK',i,m.group(1),'br='+str(len(re.findall(r'<br\b',inner))), 'text='+t[:400])
          print('TOTAL',i+1)
          import sys
          sys.path.insert(0,'scripts')
          from refine_ux_used_voice_breaks_20261113 import transform,PARA
          revised=transform(body)
          print('PREFLIGHT_NEW_SHA',hashlib.sha256(revised.encode()).hexdigest())
          print('PREFLIGHT_NEW_PARAS',len(PARA.findall(revised)),'SOFT',revised.count('<br'),'OLD_PARAS',len(PARA.findall(body)),'OLD_SOFT',body.count('<br'))
          for phrase in ['中古で良かったんじゃないか？','今なら中古UX250h','中古UXを探すなら、レクサス認定中古車のCPOも候補です','今の車を高く売る']:
            print('PREFLIGHT_PHRASE',phrase,revised.count(phrase))
          def summary(html_source):
            return {'a_hrefs': sorted(re.findall(r'<a[^>]+href=["\\']([^"\\']+)',html_source)), 'images': len(re.findall(r'<!-- wp:image',html_source)), 'figures': html_source.count('<figure'), 'paragraph_attrs': sorted(re.findall(r'<!-- wp:paragraph \\{[^\\n]*?\\} -->',html_source)), 'headings':len(re.findall(r'<!-- wp:heading',html_source)), 'blog_parts':sorted(re.findall(r'\\[blog_parts id="[0-9]+"\\]',html_source))}
          old_sig=summary(body)
          new_sig=summary(revised)
          for key in old_sig:
            print('STRUCTURE_CHECK',key,'SAME' if old_sig[key]==new_sig[key] else 'DIFFERENT', 'before',len(old_sig[key]) if isinstance(old_sig[key],list) else old_sig[key], 'after',len(new_sig[key]) if isinstance(new_sig[key],list) else new_sig[key])
          print('PREFLIGHT_SUCCESS_NO_WRITE')

          PY