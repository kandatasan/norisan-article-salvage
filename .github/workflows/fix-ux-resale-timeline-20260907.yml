name: Fix UX resale timeline once

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_ux_resale_timeline_20260907.py
      - .github/workflows/fix-ux-resale-timeline-20260907.yml

permissions:
  contents: read
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile scripts/fix_ux_resale_timeline_20260907.py
      - name: Apply guarded timeline correction
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/fix_ux_resale_timeline_20260907.py | tee /tmp/summary.md
      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### UX resale timeline correction'
            echo
            cat /tmp/summary.md 2>/dev/null || echo '- result: **BLOCKED_BEFORE_APPLY**'
          } > /tmp/comment.md
          gh issue comment 22 --repo "${{ github.repository }}" --body-file /tmp/comment.md
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-ux-resale-timeline-20260907
          path: reports/fix-ux-resale-timeline-20260907/
          if-no-files-found: ignore
