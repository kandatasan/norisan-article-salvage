<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日本の河川大図鑑｜水系から探す</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f7f7;color:#193e48;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.65}main{max-width:1050px;margin:auto;padding:15px}header{background:linear-gradient(120deg,#145369,#159b95);color:white;border-radius:23px;padding:29px 23px}h1{font-size:clamp(26px,6vw,40px);line-height:1.25;margin:5px 0}h2{font-size:22px;margin:0 0 10px}p{margin:7px 0 14px}.panel{background:white;border-radius:18px;padding:21px;margin-top:14px;box-shadow:0 4px 17px #163e4610}input{width:100%;padding:13px;border:1px solid #aac9cb;border-radius:11px;font-size:16px;color:#173c46;background:#fff}button{font:inherit;cursor:pointer;text-align:left}button:focus-visible,input:focus-visible{outline:3px solid #e2a139;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}.item{border:1px solid #d3e6e6;background:#f9fdfc;border-radius:13px;padding:12px;min-height:73px;color:#1a4650;width:100%}.item:hover{background:#eaf9f5;border-color:#31a79b}.item strong,.item small{display:block}.item small{color:#607880;font-size:12px}.active{background:#d6f2ec;border-color:#15877d}.meta{font-size:14px;color:#526f77}.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin:17px 0;flex-wrap:wrap}.pager button,.back{border:0;background:#145569;color:white;padding:10px 15px;border-radius:10px}.pager button:disabled{opacity:.35}.detail{border-left:4px solid #18978d;background:#edf9f6;padding:15px;margin-top:14px;border-radius:0 12px 12px 0}.note{font-size:13px;color:#4b6670}.hide{display:none}#rivers{scroll-margin-top:12px}@media(max-width:550px){main{padding:9px}header{padding:22px 16px;border-radius:17px}.panel{padding:16px 13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.item{padding:10px 9px;min-height:75px}}@media(max-width:340px){.grid{grid-template-columns:1fr}}
</style></head><body><main><header><p>TSURIKUE! · RIVER ATLAS</p><h1>日本の河川大図鑑</h1><p>水系を選ぶと、そこに登録された川がズラーッと出てくる。知らない川を探検しよう。</p></header>
<section class="panel"><h2>水系を選ぼう</h2><p class="meta" id="summary"></p><label for="wsq">水系名・6桁コードで検索</label><input id="wsq" type="search" placeholder="例：太田川、利根川、870709"><div id="wslist" class="grid" style="margin-top:14px"></div><div id="wspager" class="pager"></div></section>
<section class="panel" id="rivers"><h2 id="riverTitle">水系を選択してください</h2><p id="riverSummary" class="meta"></p><label for="rq">河川名・10桁コードで絞り込む</label><input id="rq" type="search" placeholder="例：三篠川" disabled><div id="riverlist" class="grid" style="margin-top:14px"></div><div id="riverpager" class="pager"></div><div id="detail" class="detail hide" aria-live="polite"></div></section>
<p class="note">国土交通省の河川コード・水系域コード一覧を加工した研究用試作品。河川コードの先頭6桁で所属水系を整理。所在地・合流先・生物の生息は推定していません。水系コードに照合できない19件は一覧に含めていません。</p></main><script src="data.js"></script><script>
(()=>{"use strict";const data=window.RIVER_ATLAS;const $=id=>document.getElementById(id);const pageSize=40;let selected=null,wp=0,rp=0;const ws=data?.watersheds||[];const text=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=String(value);if(cls)e.className=cls;return e};const clear=e=>e.replaceChildren();function pager(el,total,page,callback){clear(el);if(total<=pageSize)return;const prev=text("button","← 前へ"),next=text("button","次へ →");prev.disabled=page===0;next.disabled=(page+1)*pageSize>=total;prev.onclick=()=>callback(page-1);next.onclick=()=>callback(page+1);el.append(prev,text("span",`${page+1} / ${Math.ceil(total/pageSize)} ページ`),next)}
function wsDraw(){const q=$("wsq").value.trim();const list=ws.filter(w=>w[1].includes(q)||w[0].includes(q));const host=$("wslist");clear(host);for(const w of list.slice(wp*pageSize,(wp+1)*pageSize)){const b=text("button","", "item"+(selected?.[0]===w[0]?" active":""));b.append(text("strong",w[1]+"水系"),text("small",w[0]+" · "+w[2].length+"河川コード"));b.onclick=()=>{selected=w;rp=0;$("rq").value="";$("rq").disabled=false;riverDraw();wsDraw();$("rivers").scrollIntoView({behavior:"smooth",block:"start"})};host.append(b)}if(!list.length)host.append(text("p","該当する水系はありません"));pager($("wspager"),list.length,wp,n=>{wp=n;wsDraw()})}
function riverDraw(){const host=$("riverlist");clear(host);clear($("detail"));$("detail").classList.add("hide");if(!selected)return;$("riverTitle").textContent=selected[1]+"水系の川";const q=$("rq").value.trim();const list=selected[2].filter(r=>r[1].includes(q)||r[0].includes(q));$("riverSummary").textContent=`水系コード ${selected[0]} · 登録 ${selected[2].length} 件 · 表示 ${list.length} 件`;for(const r of list.slice(rp*pageSize,(rp+1)*pageSize)){const b=text("button","","item");b.append(text("strong",r[1]),text("small",r[0]));b.onclick=()=>{const d=$("detail");clear(d);d.append(text("h3",r[1]),text("p","河川コード： "+r[0]),text("p","所属水系： "+selected[1]+"水系（"+selected[0]+"）"),text("p","所在地・合流先・生物情報：未確認"));d.classList.remove("hide");d.scrollIntoView({behavior:"smooth",block:"nearest"})};host.append(b)}if(!list.length)host.append(text("p","該当する川はありません"));pager($("riverpager"),list.length,rp,n=>{rp=n;riverDraw()})}
$("summary").textContent=`収録 ${ws.length.toLocaleString("ja-JP")} 水系 · ${ws.reduce((a,w)=>a+w[2].length,0).toLocaleString("ja-JP")} 河川コード`;$("wsq").addEventListener("input",()=>{wp=0;wsDraw()});$("rq").addEventListener("input",()=>{rp=0;riverDraw()});const ota=ws.find(w=>w[0]==="870709");if(ota){selected=ota;$("rq").disabled=false;riverDraw()}wsDraw()})();
</script></body></html>
