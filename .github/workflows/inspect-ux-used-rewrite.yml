name: Read-only inspect UX used for guarded rewrite
on:
  push:
    branches: [rewrite-lexus-ux-used-20261113]
    paths:
      - '.github/workflows/inspect-ux-used-rewrite.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current WP post 2948 without modifications
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,base64,urllib.request,hashlib,re
          user=os.environ['TSURIKUE_WP_USER']; pwd=os.environ['TSURIKUE_WP_APP_PASSWORD']
          token=base64.b64encode(f"{user}:{pwd}".encode()).decode()
          url='https://tsurikue.com/wp-json/wp/v2/posts/2948?context=edit&_fields=id,slug,status,title,content,featured_media,categories,author'
          req=urllib.request.Request(url,headers={'Authorization':'Basic '+token,'Accept':'application/json','User-Agent':'tsurikue-ux-audit-readonly'})
          with urllib.request.urlopen(req,timeout=40) as r: row=json.loads(r.read())
          s=row['content']['raw']
          print('AUDIT_META',json.dumps({k:row.get(k) for k in ['id','slug','status','featured_media','categories','author']},ensure_ascii=False))
          print('AUDIT_TITLE',row.get('title'))
          print('AUDIT_SHA',hashlib.sha256(s.encode()).hexdigest())
          print('AUDIT_LENGTH',len(s))
          for term in ['結論｜中古UX','中古UXの「最強」','そして乗り換えなら','シエンタ','[blog_parts id="4521"]','ガリバーで中古のレクサスUXを探してみる','ガリバーで希望のUXを探してみる','まとめ｜200万円台']:
            inds=[m.start() for m in re.finditer(re.escape(term),s)]
            print('AUDIT_TERM',repr(term),inds)
            for j,ind in enumerate(inds[:2]):
              print('AUDIT_CONTEXT',repr(term),j,repr(s[max(0,ind-300):min(len(s),ind+1000)]))
          print('AUDIT_PREFIX',repr(s[:6500]))
          print('AUDIT_SUFFIX',repr(s[-8500:]))
          PY