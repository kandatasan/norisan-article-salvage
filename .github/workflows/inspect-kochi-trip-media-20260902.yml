name: Inspect Kochi trip media 20260902

on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_kochi_trip_media.py'
      - '.github/workflows/inspect-kochi-trip-media-20260902.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Syntax check
        run: python -m py_compile scripts/inspect_kochi_trip_media.py
      - name: Inspect WordPress media read-only
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/inspect_kochi_trip_media.py
      - name: Record result on salvage audit issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Kochi trip media inspection: SUCCESS'
            echo
            cat reports/kochi-trip-media-audit/summary.md
          } > /tmp/kochi-trip-media-comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/kochi-trip-media-comment.md
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kochi-trip-media-audit
          path: reports/kochi-trip-media-audit/
          if-no-files-found: warn
