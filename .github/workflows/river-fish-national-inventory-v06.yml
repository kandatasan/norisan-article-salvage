name: Inspect nationwide official fish sources (nine regions)

on:
  pull_request:
    paths:
      - 'river-fish/nationwide_sources_v06.json'
      - 'river-fish/inspect_nationwide_source_v06.py'
      - '.github/workflows/river-fish-national-inventory-v06.yml'

permissions:
  contents: read

jobs:
  inspect-region:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 13
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        region: [hokkaido, tohoku, kanto, hokuriku, chubu, kinki, chugoku, shikoku, kyushu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify official index and inspect source (no fish observations retained)
        run: python river-fish/inspect_nationwide_source_v06.py --region "${{ matrix.region }}" --output-dir /tmp/fish-region-inventory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fish-source-inventory-${{ matrix.region }}
          path: /tmp/fish-region-inventory/*.json
          if-no-files-found: warn
          retention-days: 30
