name: Test outing card inner-grid v2 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-outing-card-inner-grid-v2-once.yml'
      - 'ops/outing-card-internals/test_inner_grid_v2.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate
        run: python -m py_compile ops/outing-card-internals/test_inner_grid_v2.py
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium
      - name: Test inner-grid fix in browser only
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: |
          set -o pipefail
          python ops/outing-card-internals/test_inner_grid_v2.py | tee outing-card-inner-grid-v2-console.json
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outing-card-inner-grid-v2-test
          path: |
            outing-card-inner-grid-v2.json
            outing-card-inner-grid-v2-console.json
            outing-card-inner-grid-v2-before-1440.png
            outing-card-inner-grid-v2-after-1440.png
          if-no-files-found: warn
