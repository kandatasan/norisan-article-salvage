name: Inspect WordPress navigation REST routes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-wp-navigation-rest-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Inspect REST routes and current classic menu resources
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,json,os,urllib.request,urllib.error
          user=os.environ['TSURIKUE_WP_USER']; pw=os.environ['TSURIKUE_WP_APP_PASSWORD']
          token=base64.b64encode(f'{user}:{pw}'.encode()).decode()
          headers={'Authorization':'Basic '+token,'Accept':'application/json','User-Agent':'tsurikue-nav-inspect/1.0'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      return r.status,json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: body=e.read().decode()
                  except: body=''
                  return e.code,body[:3000]
          status,root=get('https://tsurikue.com/wp-json/')
          print('ROOT_STATUS',status)
          if isinstance(root,dict):
              routes=sorted([k for k in (root.get('routes') or {}) if any(x in k.lower() for x in ['menu','navigation','custom_css','widget','sidebar','theme'])])
              print('MATCHING_ROUTES='+json.dumps(routes,ensure_ascii=False,indent=2))
          for path in [
              '/wp-json/wp/v2/menus?context=edit&per_page=100',
              '/wp-json/wp/v2/menu-items?context=edit&per_page=100',
              '/wp-json/wp/v2/menu-locations',
              '/wp-json/wp/v2/navigation?context=edit&per_page=100',
              '/wp-json/wp/v2/types/custom_css?context=edit',
              '/wp-json/wp/v2/settings?context=edit',
              '/wp-json/wp/v2/widgets?context=edit&per_page=100',
              '/wp-json/wp/v2/sidebars?context=edit&per_page=100'
          ]:
              st,data=get('https://tsurikue.com'+path)
              print('\nENDPOINT',path,'STATUS',st)
              s=json.dumps(data,ensure_ascii=False,indent=2) if not isinstance(data,str) else data
              print(s[:12000])
          PY
