name: Audit LBX internal links once

on:
  push:
    branches: [main]
    paths:
      - scripts/audit_lbx_internal_links_20260928.py
      - .github/workflows/audit-lbx-internal-links-20260928.yml

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit live WordPress with GET only
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile scripts/audit_lbx_internal_links_20260928.py
          python scripts/audit_lbx_internal_links_20260928.py > /tmp/audit.md
          cat /tmp/audit.md
          gh issue comment 561 --repo "${{ github.repository }}" --body-file /tmp/audit.md
