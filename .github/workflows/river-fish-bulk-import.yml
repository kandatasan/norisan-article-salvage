name: River fish official data bulk import to review branch

on:
  pull_request:
    paths:
      - '.github/workflows/river-fish-bulk-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-reviewed-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/river-fish-official-import-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline unit tests
        run: python -m unittest discover -s river-fish -p 'test_official_aggregate_v05.py' -v
      - name: Download pinned public source and aggregate safely
        run: python river-fish/aggregate_official_workbook.py --output-dir river-fish
      - name: Validate output before any commit
        run: |
          python - <<'PY'
          import csv,json,pathlib
          p=pathlib.Path("river-fish/official_chugoku_watershed_year_fish_v05.csv")
          m=json.loads(pathlib.Path("river-fish/official_chugoku_manifest_v05.json").read_text())
          with p.open(encoding="utf-8",newline="") as f:
              rd=csv.DictReader(f)
              assert rd.fieldnames==["watershed","survey_year","recorded_name","source_url","source_sha256"]
              data=list(rd)
          assert len(data)==len(set((x["watershed"],x["survey_year"],x["recorded_name"]) for x in data))
          assert len(data)==m["aggregated_records"] and len(data)>=100
          assert all(x["source_sha256"]==m["source_sha256"] for x in data)
          assert all(x["watershed"] and x["recorded_name"] and x["survey_year"].isdigit() for x in data)
          assert m["publication_status"]=="staged_not_published"
          assert len(data)<=50000
          print("validated aggregated rows",len(data),"source rows",m["source_rows"],"water systems",m["unique_watersheds"],"year range",min(m["years"]),max(m["years"]))
          PY
      - name: Keep a downloadable QA artifact even if Git push is unavailable
        uses: actions/upload-artifact@v4
        with:
          name: china-fish-official-reviewed-preview
          path: |
            river-fish/official_chugoku_watershed_year_fish_v05.csv
            river-fish/official_chugoku_manifest_v05.json
          retention-days: 30
      - name: Add staged, sanitized output to PR branch (never main)
        env:
          REVIEW_HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add river-fish/official_chugoku_watershed_year_fish_v05.csv river-fish/official_chugoku_manifest_v05.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m 'Stage normalized official China fish records for review'
            git push origin "HEAD:refs/heads/$REVIEW_HEAD"
          fi
