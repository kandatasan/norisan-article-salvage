name: Retry fix Karato Market flow once

on:
  push:
    branches: [main]
    paths:
      - scripts/retry_fix_karato_market_flow_20260909.py
      - .github/workflows/retry-fix-karato-market-flow-20260909.yml

permissions:
  contents: read
  issues: write

jobs:
  fix-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retry 唐戸市場 draft fix and verify
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile scripts/fix_karato_market_flow_20260909.py scripts/retry_fix_karato_market_flow_20260909.py
          python scripts/retry_fix_karato_market_flow_20260909.py > /tmp/result.md
          cat /tmp/result.md
          gh issue comment 22 --repo "${{ github.repository }}" --body-file /tmp/result.md
