name: Probe Moroki small river fish source coverage
on:
  pull_request:
    paths:
      - 'river-fish/check_minor_river_name.py'
      - '.github/workflows/river-fish-minor-river-probe.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python river-fish/check_minor_river_name.py --river 諸木川
