name: Audit lexus-ux-used funnel once

on:
  push:
    branches: [main]
    paths:
      - scripts/audit_lexus_ux_used_funnel_20260907.py
      - .github/workflows/audit-lexus-ux-used-funnel-20260907.yml

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile scripts/audit_lexus_ux_used_funnel_20260907.py
      - name: Audit current WordPress state (GET only)
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/audit_lexus_ux_used_funnel_20260907.py | tee /tmp/summary.md
      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### lexus-ux-used funnel audit'
            echo
            cat /tmp/summary.md 2>/dev/null || echo '- result: **FAILED**'
          } > /tmp/comment.md
          gh issue comment 386 --repo "${{ github.repository }}" --body-file /tmp/comment.md
