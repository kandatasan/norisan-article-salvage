name: Kyushu river evidence discovery v04 (research only)
on:
  push:
    branches:
      - research/river-individual-kyushu-20261020
    paths:
      - river-fish/research-individual-v04/*.py
      - .github/workflows/river-individual-kyushu-v04.yml
  workflow_dispatch:
concurrency:
  group: kyushu-river-v04-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  kyushu-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source parsers and research invariants
        run: python -m unittest discover -s river-fish/research-individual-v04 -p 'test_kyushu_evidence_v04.py' -v
      - name: Install official PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Inspect JMA 2026 official 10-digit river numbers
        run: python river-fish/research-individual-v04/probe_jma_river_codes_v04.py --out /tmp/kyushu-v04/jma_2026_river_numbers_probe.json
      - name: Parse official MLIT distribution list
        run: |
          python -m py_compile river-fish/research-individual-v04/*.py
          python river-fish/research-individual-v04/probe_kyushu_official_page.py --out /tmp/kyushu-v04/mlit_official_page_probe.json
      - name: Join source pairs with original Kyushu B research records
        run: |
          python river-fish/research-individual-v04/build_kyushu_evidence_queue.py --out /tmp/kyushu-v04
          python - <<'PY'
          from pathlib import Path
          import csv,json
          out=Path('/tmp/kyushu-v04')
          data=json.loads((out/'kyushu_audit_v04.json').read_text())
          assert data['B_remain_B'] and data['new_A_rivers']==0 and data['new_A_contexts']==0
          assert data['recovered_B_contexts']==115062
          assert data['official_watersheds']==20 and data['source_B_distinct_pairs']==92
          with (out/'kyushu_B_triage_v04.csv').open() as f:
              q=list(csv.DictReader(f))
          assert len(q)==286 and all(r['match_class']=='B' for r in q)
          print('RESEARCH_B_ONLY',data['independently_confirmed_name_pairs_with_unique_catalog_candidate'])
          PY
      - name: Cross-verify JMA ten-digit codes against official MLIT water/river pairs
        run: |
          python river-fish/research-individual-v04/verify_kyushu_jma_crosswalk.py --out /tmp/kyushu-v04
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/kyushu-v04/kyushu_jma_crosswalk_review_v04.json').read_text())
          assert d['strict_matched_rivers']>0
          assert d['matched_old_B_recovered_contexts']>0
          assert d['production_changed'] is False
          print('INDEPENDENT_10_DIGIT_MATCHES',d['strict_matched_rivers'])
          PY
      - name: Store read-only research audit
        uses: actions/upload-artifact@v4
        with:
          name: kyushu-independent-source-probe-v04
          path: /tmp/kyushu-v04/
          if-no-files-found: error
      - name: Commit research-only audit results
        run: |
          test "${GITHUB_REF_NAME}" = "research/river-individual-kyushu-20261020"
          mkdir -p river-fish/research-individual-v04/outputs
          cp /tmp/kyushu-v04/*.json river-fish/research-individual-v04/outputs/
          cp /tmp/kyushu-v04/*.csv river-fish/research-individual-v04/outputs/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add river-fish/research-individual-v04/outputs
          if ! git diff --cached --quiet; then
            git commit -m "research: save confirmed Kyushu river name pairs and unresolved-code triage"
            git push origin HEAD:refs/heads/research/river-individual-kyushu-20261020
          fi
