name: Build national watershed switcher (offline)
on:
  push:
    branches:
      - feature/river-atlas-watershed-switcher-20261019
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate actual source data and watershed switching
        run: python -m unittest discover -s river-fish -p 'test_watershed_switcher_v01.py' -v
      - name: Build preview from the two official-code CSVs
        run: python river-fish/build_watershed_switcher_v01.py --out /tmp/watershed-switcher
      - name: Validate standalone page includes actual river records
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("/tmp/watershed-switcher/standalone.html").read_text(encoding="utf-8")
          assert "window.RIVER_ATLAS=" in p
          assert "三篠川" in p and "8707090029" in p
          assert '<script src="data.js"></script>' not in p
          print("STANDALONE_REAL_DATA_OK",len(p))
          PY
      - name: JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path("/tmp/watershed-switcher/index.html").read_text()
          Path("/tmp/watershed-switcher/app.js").write_text(page.split("<script>")[-1].split("</script>")[0])
          PY
          node --check /tmp/watershed-switcher/app.js
          node --check /tmp/watershed-switcher/data.js
      - name: Package offline HTML and data
        run: cd /tmp/watershed-switcher && zip -q /tmp/tsurikue-watershed-switcher.zip standalone.html index.html data.js
      - uses: actions/upload-artifact@v4
        with:
          name: tsurikue-watershed-switcher-v01
          path: /tmp/tsurikue-watershed-switcher.zip
          if-no-files-found: error
