name: Apply UX koukai sharpen v5 final

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply_ux_koukai_sharpen_v5_final.py
      - .github/workflows/apply-ux-koukai-sharpen-v5-final.yml

permissions:
  contents: read
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile final sharpen script
        run: python -m py_compile scripts/apply_ux_koukai_sharpen_v5_final.py
      - name: Apply guarded UX sharpen v5
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/apply_ux_koukai_sharpen_v5_final.py
      - name: Record audit result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### ux-koukai sharpen v5 final'
            echo
            if [ -f reports/ux-koukai-sharpen-once/summary.md ]; then
              cat reports/ux-koukai-sharpen-once/summary.md
            else
              echo '- result: **BLOCKED_BEFORE_APPLY**'
              echo '- wordpress_write_count: **0**'
              echo '- note: compile/apply stopped before report creation'
            fi
          } > /tmp/comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-koukai-sharpen-v5-final
          path: reports/ux-koukai-sharpen-once/
          if-no-files-found: warn
