name: Inspect live Gutenberg family image block

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gutenberg-top-styles-once.yml'

permissions:
  contents: read

jobs:
  inspect-family:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Read media 2992 vicinity only
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, urllib.parse, urllib.request
          PAGE_ID=2983
          user=os.environ['TSURIKUE_WP_USER']
          pw=os.environ['TSURIKUE_WP_APP_PASSWORD']
          token=base64.b64encode(f'{user}:{pw}'.encode()).decode()
          headers={'Authorization':'Basic '+token,'Accept':'application/json','User-Agent':'tsurikue-family-inspect/1.1'}
          q=urllib.parse.urlencode({'context':'edit','_fields':'id,slug,status,title,content'})
          req=urllib.request.Request(f'https://tsurikue.com/wp-json/wp/v2/pages/{PAGE_ID}?{q}',headers=headers)
          with urllib.request.urlopen(req,timeout=45) as r:
              page=json.loads(r.read().decode())
          content=(page.get('content') or {}).get('raw') or ''
          p=content.find('2992')
          if p<0:
              p=content.find('e9134f4d-3d71-45fd-a6e7-cf47982bb93d')
          if p<0:
              raise SystemExit('MEDIA_2992_NOT_FOUND')
          print('id='+str(page.get('id')))
          print('slug='+str(page.get('slug')))
          print('status='+str(page.get('status')))
          print('title='+str((page.get('title') or {}).get('raw') or (page.get('title') or {}).get('rendered') or ''))
          print('media_pos='+str(p))
          print('hero_pos='+str(content.find('https://tsurikue.com/wp-content/uploads/2026/05/img_4588.jpg')))
          a=max(0,p-1200)
          b=min(len(content),p+1800)
          print('---MEDIA2992_SNIPPET_START---')
          print(content[a:b])
          print('---MEDIA2992_SNIPPET_END---')
          PY
