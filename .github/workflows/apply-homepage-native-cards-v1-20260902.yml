name: Apply homepage native image cards v1 20260902
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-homepage-native-cards-v1-20260902.yml'
      - 'experimental-pages/top-design-lab/native-cards-v1/**'
permissions:
  contents: read
jobs:
  deploy-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate native card template
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('experimental-pages/top-design-lab/native-cards-v1/card-grid.html')
          s=p.read_text(encoding='utf-8')
          targets=['/odekake/','/gourmet-guide/','/fishing-guide/','/car-guide/']
          assert s.count('tq4-native-card tq4-native-card--')==4
          assert s.count('linkDestination":"custom"')==4
          assert all(f'<a href="{x}"><img' in s for x in targets)
          assert 'wp:cover' not in s
          print('NATIVE_CARD_TEMPLATE_OK')
          PY
      - name: Backup published homepage
        id: backup
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          TQ_HOME_BACKUP_PATH: /tmp/homepage-native-cards-v1-backup.json
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4; do
            if python experimental-pages/top-design-lab/complete-v2/live_backup.py backup; then ok=1; break; fi
            echo "Backup attempt ${attempt}/4 failed; retrying..." >&2
            sleep $((attempt * 5))
          done
          test "$ok" -eq 1
      - name: Apply native image cards to published homepage
        id: deploy
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          TQ_NATIVE_RESULT_PATH: /tmp/homepage-native-cards-v1-result.json
        run: |
          set -euo pipefail
          python experimental-pages/top-design-lab/native-cards-v1/deploy.py | tee /tmp/homepage-native-cards-v1-deploy.log
      - name: Install render audit dependencies
        if: steps.deploy.outcome == 'success'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m pip install --quiet selenium
      - name: Verify desktop and mobile native image links
        id: verify
        if: steps.deploy.outcome == 'success'
        run: |
          set -euo pipefail
          python experimental-pages/top-design-lab/native-cards-v1/verify_render.py | tee /tmp/homepage-native-cards-v1-render.log
      - name: Roll back homepage if render audit fails
        if: failure() && steps.deploy.outcome == 'success' && steps.verify.outcome == 'failure'
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          TQ_HOME_BACKUP_PATH: /tmp/homepage-native-cards-v1-backup.json
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            if python experimental-pages/top-design-lab/complete-v2/live_backup.py rollback; then ok=1; break; fi
            sleep $((attempt * 5))
          done
          test "$ok" -eq 1
          echo 'Native card render audit failed; published homepage restored.' >&2
          exit 1
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-native-cards-v1-audit
          path: |
            /tmp/homepage-native-cards-v1-result.json
            /tmp/homepage-native-cards-v1-deploy.log
            /tmp/homepage-native-cards-v1-render.log
            homepage-native-cards-v1-render.json
            homepage-native-cards-v1-desktop.png
            homepage-native-cards-v1-mobile.png
          if-no-files-found: warn
