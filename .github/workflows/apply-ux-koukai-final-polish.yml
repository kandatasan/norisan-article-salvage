name: Purge UX300h server cache if credential exists

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-ux-koukai-final-polish.yml

permissions:
  contents: read
  issues: write

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      XSERVER_API_KEY: ${{ secrets.XSERVER_API_KEY }}
      XSERVER_SERVERNAME: ${{ secrets.XSERVER_SERVERNAME }}
    steps:
      - name: Prepare report
        shell: bash
        run: |
          mkdir -p reports/ux300h-xserver-cache-purge
          echo '# UX300h Xserver cache purge' > reports/ux300h-xserver-cache-purge/summary.md
          echo >> reports/ux300h-xserver-cache-purge/summary.md
      - name: Check credential presence
        id: check
        shell: bash
        run: |
          if [ -n "$XSERVER_API_KEY" ]; then
            echo 'has_key=yes' >> "$GITHUB_OUTPUT"
            echo '- XSERVER_API_KEY: **PRESENT**' >> reports/ux300h-xserver-cache-purge/summary.md
          else
            echo 'has_key=no' >> "$GITHUB_OUTPUT"
            echo '- result: **NO_XSERVER_API_KEY_SECRET**' >> reports/ux300h-xserver-cache-purge/summary.md
            echo '- XSERVER_API_KEY: **NOT PRESENT**' >> reports/ux300h-xserver-cache-purge/summary.md
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.has_key == 'yes'
        with:
          node-version: '20'
      - name: Purge Xserver server cache
        if: steps.check.outputs.has_key == 'yes'
        shell: bash
        run: |
          set +e
          npx --yes xserver-cli server server-cache clear-cache tsurikue.com -y > /tmp/xserver-purge.log 2>&1
          code=$?
          if [ $code -eq 0 ]; then
            echo '- result: **SUCCESS**' >> reports/ux300h-xserver-cache-purge/summary.md
            echo '- domain: **tsurikue.com**' >> reports/ux300h-xserver-cache-purge/summary.md
            echo '- action: **server cache cleared**' >> reports/ux300h-xserver-cache-purge/summary.md
          else
            echo '- result: **XSERVER_PURGE_FAILED**' >> reports/ux300h-xserver-cache-purge/summary.md
            echo "- exit_code: **$code**" >> reports/ux300h-xserver-cache-purge/summary.md
            sed -E 's/xs_[A-Za-z0-9_-]+/[REDACTED]/g' /tmp/xserver-purge.log | tail -20 | sed 's/^/- log: `/' | sed 's/$/`/' >> reports/ux300h-xserver-cache-purge/summary.md
          fi
          exit 0
      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          { echo '### ux300h Xserver cache purge'; echo; cat reports/ux300h-xserver-cache-purge/summary.md; } > /tmp/comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux300h-xserver-cache-purge
          path: reports/ux300h-xserver-cache-purge/
          if-no-files-found: warn
