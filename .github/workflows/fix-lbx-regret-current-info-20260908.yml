name: Fix LBX regret current-info copy once

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_lbx_regret_current_info_20260908.py
      - scripts/verify_lbx_regret_current_info_20260908.py
      - .github/workflows/fix-lbx-regret-current-info-20260908.yml

permissions:
  contents: read
  issues: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply localized copy fix and verify via GET
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile scripts/fix_lbx_regret_current_info_20260908.py scripts/verify_lbx_regret_current_info_20260908.py
          python scripts/fix_lbx_regret_current_info_20260908.py > /tmp/fix.md
          python scripts/verify_lbx_regret_current_info_20260908.py > /tmp/verify.md
          { cat /tmp/fix.md; echo; cat /tmp/verify.md; } > /tmp/comment.md
          cat /tmp/comment.md
          gh issue comment 441 --repo "${{ github.repository }}" --body-file /tmp/comment.md
