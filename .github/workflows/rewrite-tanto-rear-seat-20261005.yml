name: Rewrite authorized Tanto rear-seat article 20261005
on:
  push:
    branches: [main]
    paths:
      - 'scripts/rewrite_tanto_rear_seat_20261005.py'
      - 'editorial/tanto-rear-seat-polish-20261005/**'
      - '.github/workflows/rewrite-tanto-rear-seat-20261005.yml'
permissions:
  contents: read
jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: tanto-rear-seat-3981
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update only approved existing post and verify
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/rewrite_tanto_rear_seat_20261005.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tanto-rear-seat-polish-20261005
          path: reports/tanto-rear-seat-polish-20261005/
          if-no-files-found: warn
