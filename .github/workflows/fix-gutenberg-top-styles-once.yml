name: Inspect live Gutenberg family block shape

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gutenberg-top-styles-once.yml'

permissions:
  contents: read

jobs:
  inspect-family:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Read family block vicinity only
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, urllib.parse, urllib.request
          PAGE_ID=2983
          user=os.environ['TSURIKUE_WP_USER']
          pw=os.environ['TSURIKUE_WP_APP_PASSWORD']
          token=base64.b64encode(f'{user}:{pw}'.encode()).decode()
          headers={'Authorization':'Basic '+token,'Accept':'application/json','User-Agent':'tsurikue-family-inspect/1.0'}
          q=urllib.parse.urlencode({'context':'edit','_fields':'id,slug,status,title,content'})
          req=urllib.request.Request(f'https://tsurikue.com/wp-json/wp/v2/pages/{PAGE_ID}?{q}',headers=headers)
          with urllib.request.urlopen(req,timeout=45) as r:
              page=json.loads(r.read().decode())
          content=(page.get('content') or {}).get('raw') or ''
          print('id='+str(page.get('id')))
          print('slug='+str(page.get('slug')))
          print('status='+str(page.get('status')))
          print('title='+str((page.get('title') or {}).get('raw') or (page.get('title') or {}).get('rendered') or ''))
          needles=['2992','e9134f4d-3d71-45fd-a6e7-cf47982bb93d','tq4-party-image','tq4-party']
          positions=[(n,content.find(n)) for n in needles]
          print('positions='+repr(positions))
          poss=[p for _,p in positions if p>=0]
          if not poss:
              raise SystemExit('FAMILY_NEEDLES_NOT_FOUND')
          p=min(poss)
          a=max(0,p-900)
          b=min(len(content),p+1400)
          print('---FAMILY_SNIPPET_START---')
          print(content[a:b])
          print('---FAMILY_SNIPPET_END---')
          hp=content.find('https://tsurikue.com/wp-content/uploads/2026/05/img_4588.jpg')
          print('hero_pos='+str(hp))
          print('family_first_pos='+str(p))
          PY
