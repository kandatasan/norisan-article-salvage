name: Probe UX300h public cache

on:
  push:
    branches:
      - main
    paths:
      - scripts/public_ux300h_cache_probe.py
      - .github/workflows/apply-ux-koukai-final-polish.yml

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile public cache probe
        run: python -m py_compile scripts/public_ux300h_cache_probe.py
      - name: Probe public URL
        run: python scripts/public_ux300h_cache_probe.py
      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          { echo '### ux300h public cache probe'; echo; cat reports/ux300h-public-cache-probe/summary.md 2>/dev/null || echo '- result: **BLOCKED**'; } > /tmp/comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux300h-public-cache-probe
          path: reports/ux300h-public-cache-probe/
          if-no-files-found: warn
