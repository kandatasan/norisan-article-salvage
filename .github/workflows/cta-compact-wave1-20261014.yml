name: CTA compact wave 1 guarded publish-post edits
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/cta_compact_wave1_20261014.py'
      - '.github/workflows/cta-compact-wave1-20261014.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/cta_compact_wave1_20261014.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guarded-cta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Preflight exact October 14 live source hashes - no writes
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/cta_compact_wave1_20261014.py check
      - name: Apply only on main push and independently verify published posts
        if: github.event_name == 'push'
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/cta_compact_wave1_20261014.py apply
      - name: Upload preflight and apply audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cta-compact-wave1-20261014-audit
          path: reports/cta-compact-wave1-20261014/
          if-no-files-found: warn
