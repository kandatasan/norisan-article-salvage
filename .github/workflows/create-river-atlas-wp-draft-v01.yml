name: Create river atlas WordPress draft preview
on:
  push:
    branches:
      - feature/river-atlas-watershed-switcher-20261019
    paths:
      - '.github/workflows/create-river-atlas-wp-draft-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build actual river code data and single-file preview
        run: |
          python -m unittest discover -s river-fish -p 'test_watershed_switcher_v01.py' -v
          python river-fish/build_watershed_switcher_v01.py --out river-fish/watershed-switcher-v01
      - name: Validate draft script
        run: python -m py_compile river-fish/create_watershed_wp_draft_v01.py
      - name: Create new WordPress draft, never publish
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python river-fish/create_watershed_wp_draft_v01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: river-atlas-wp-draft-result
          path: river-fish/watershed-switcher-v01/wp-draft-result.json
          if-no-files-found: warn
