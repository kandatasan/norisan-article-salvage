name: Audit outing spacing 20260903
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-outing-spacing-20260903.yml'
      - 'category-hubs/outing-v5/diagnose_spacing.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --quiet selenium
      - name: Measure live outing spacing
        run: |
          set -euo pipefail
          python category-hubs/outing-v5/diagnose_spacing.py | tee /tmp/outing-spacing.json
      - uses: actions/upload-artifact@v4
        with:
          name: outing-spacing-audit
          path: /tmp/outing-spacing.json
