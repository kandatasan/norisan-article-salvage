name: Sakaiminato 15 photo upload to existing draft
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/manifest/sakaiminato-photos15-20261013.json'
      - 'scripts/upload_sakaiminato_15_photos_20261013.py'
      - '.github/workflows/sakaiminato-upload-15-photos-20261013.yml'
  push:
    branches: [main]
    paths:
      - 'assets/manifest/sakaiminato-photos15-20261013.json'
      - 'scripts/upload_sakaiminato_15_photos_20261013.py'
      - '.github/workflows/sakaiminato-upload-15-photos-20261013.yml'
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Read-only verify source archive and target WP draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/upload_sakaiminato_15_photos_20261013.py check
      - name: Upload media and insert into unpublished WordPress draft
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/upload_sakaiminato_15_photos_20261013.py apply
