name: Chugoku seven-river source-linked human review packet v08
on:
  pull_request:
    branches: [main]
    paths:
      - 'river-fish/research-20261021/build_chugoku_review_packet_v08.py'
      - 'river-fish/research-20261021/test_chugoku_review_packet_v08.py'
      - '.github/workflows/chugoku-fish-human-review-packet-v08.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  human-review-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed unit tests
        run: |
          python -m unittest discover -s river-fish/research-20261021 -p 'test_chugoku_review_packet_v08.py' -v
          python -m unittest discover -s river-fish/research-20261021 -p 'test_chugoku_source_crosscheck_v07.py' -v
          python -m unittest discover -s river-fish/research-20261021 -p 'test_chugoku_national_snapshot_v01.py' -v
      - name: Materialize checksum-verified Chugoku fish snapshot (offline)
        run: python river-fish/research-20261021/validate_chugoku_national_snapshot_v01.py --out-dir "$RUNNER_TEMP/chugoku-v08"
      - name: Rebuild verified read-only 13-river crosscheck
        run: |
          python river-fish/research-20261021/build_chugoku_source_crosscheck_v07.py \
            --national-csv "$RUNNER_TEMP/chugoku-v08/official_direct_river_fish_v04.csv" \
            --out "$RUNNER_TEMP/chugoku-v08/chugoku_source_crosscheck_v07.json"
      - name: Build Markdown packet with counts derived from current evidence gates
        run: |
          python river-fish/research-20261021/build_chugoku_review_packet_v08.py \
            --review-json "$RUNNER_TEMP/chugoku-v08/chugoku_source_crosscheck_v07.json" \
            --out "$RUNNER_TEMP/chugoku-v08/CHUGOKU_7_RIVERS_HUMAN_REVIEW_V08.md"
      - name: Ensure packet has no hidden fish names or precise survey details
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"chugoku-v08"
          d=json.loads((p/"chugoku_source_crosscheck_v07.json").read_text(encoding="utf-8"))
          md=(p/"CHUGOKU_7_RIVERS_HUMAN_REVIEW_V08.md").read_text(encoding="utf-8")
          assert d["status"]=="REVIEW_ONLY_DO_NOT_UPLOAD"
          assert d["priority_counts"]=={
            "B_NEW_RIVER_REVIEW":3,"C_EVIDENCE_SCOPE_OR_CONSERVATION_REVIEW":10}
          assert "公開承認は0" in md and "採集地点" in md
          assert all(x["approved_for_publication"] is False for x in d["rows"])
          assert all("recorded_name" not in x for x in d["rows"])
          assert "recorded_name" not in md
          print("CHUGOKU_7_RIVER_HUMAN_REVIEW_PACKET_V08_OK",len(md),"characters","site_updated=False")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chugoku-seven-river-human-review-packet-v08
          path: |
            ${{ runner.temp }}/chugoku-v08/CHUGOKU_7_RIVERS_HUMAN_REVIEW_V08.md
            ${{ runner.temp }}/chugoku-v08/chugoku_source_crosscheck_v07.json
          retention-days: 30
