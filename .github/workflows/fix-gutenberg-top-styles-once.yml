name: Add Gutenberg gourmet category pill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gutenberg-top-styles-once.yml'

permissions:
  contents: write

jobs:
  add-gourmet-pill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Replace gourmet alignment hack with normal pill
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('experimental-pages/top-design-lab/content.html')
          s = p.read_text(encoding='utf-8')

          old_css = (
              '\n/* GUTENBERG GOURMET ALIGN FIX v3 */\n'
              '/* Gourmet has no pill, so reserve the same vertical space as the other cards. */\n'
              '.tq4 .tq4-cat--gourmet .tq4-cat-body{padding-bottom:58px!important}\n'
              '@media(max-width:560px){.tq4 .tq4-cat--gourmet .tq4-cat-body{padding-bottom:52px!important}}\n'
          )
          if old_css not in s:
              raise SystemExit('expected gourmet alignment override not found')
          s = s.replace(old_css, '\n', 1)

          pill = (
              '<!-- wp:paragraph {"className":"tq4-pill-text"} -->\n'
              '<p class="tq4-pill-text">ラーメン・ご当地グルメ</p>\n'
              '<!-- /wp:paragraph -->\n'
          )
          if 'ラーメン・ご当地グルメ' in s:
              raise SystemExit('gourmet pill already present')

          needle = (
              '<p class="tq4-card-desc">街のラーメン、旅先のごはん、気になった店。</p>\n'
              '<!-- /wp:paragraph -->\n'
              '</div>\n'
          )
          if needle not in s:
              raise SystemExit('gourmet card insertion point not found')
          replacement = (
              '<p class="tq4-card-desc">街のラーメン、旅先のごはん、気になった店。</p>\n'
              '<!-- /wp:paragraph -->\n'
              + pill +
              '</div>\n'
          )
          s = s.replace(needle, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Sync only guarded draft page
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/create_experimental_page_once.py --config experimental-pages/top-design-lab/config.json

      - name: Adopt new exact draft hash and commit source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          content_path = Path('experimental-pages/top-design-lab/content.html')
          config_path = Path('experimental-pages/top-design-lab/config.json')
          content = content_path.read_text(encoding='utf-8')
          cfg = json.loads(config_path.read_text(encoding='utf-8'))
          cfg['expected_current_content_sha256'] = hashlib.sha256(content.encode()).hexdigest()
          config_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experimental-pages/top-design-lab/content.html experimental-pages/top-design-lab/config.json
          git commit -m 'Add gourmet category pill'
          git push origin HEAD:main
