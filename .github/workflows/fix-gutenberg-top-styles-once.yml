name: Remove SWELL outer padding and verify mobile width

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gutenberg-top-styles-once.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch current WordPress top CSS only
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, re, urllib.parse, urllib.request

          PAGE_ID=2983
          MARKER='<!-- tsurikue-experimental-page:v1:top-design-lab -->'
          FIX_TAG='/* MOBILE OUTER PADDING FIX v4 */'
          HERO_URL='https://tsurikue.com/wp-content/uploads/2026/05/img_4588.jpg'

          user=os.environ['TSURIKUE_WP_USER']
          pw=os.environ['TSURIKUE_WP_APP_PASSWORD']
          token=base64.b64encode(f'{user}:{pw}'.encode()).decode()
          headers={
              'Authorization':'Basic '+token,
              'Accept':'application/json',
              'Content-Type':'application/json; charset=utf-8',
              'User-Agent':'tsurikue-outer-padding-v4/1.0',
          }

          def get_page():
              q=urllib.parse.urlencode({'context':'edit','_fields':'id,slug,status,title,content'})
              req=urllib.request.Request(f'https://tsurikue.com/wp-json/wp/v2/pages/{PAGE_ID}?{q}',headers=headers)
              with urllib.request.urlopen(req,timeout=45) as r:
                  return json.loads(r.read().decode())

          def raw_content(page):
              return (page.get('content') or {}).get('raw') or ''

          page=get_page()
          original=raw_content(page)
          original_status=page.get('status')
          if page.get('id') != PAGE_ID or original_status not in ('draft','publish'):
              raise SystemExit('BLOCKED_WRONG_PAGE_STATE')
          if MARKER not in original or HERO_URL not in original:
              raise SystemExit('BLOCKED_EXPECTED_PAGE_MISSING')
          if '"id":2992' not in original and 'wp-image-2992' not in original:
              raise SystemExit('BLOCKED_FAMILY_MEDIA_MISSING')
          if '</style>' not in original:
              raise SystemExit('BLOCKED_STYLE_END_MISSING')

          content=re.sub(
              r'\n?/\* MOBILE OUTER PADDING FIX v4 \*/.*?/\* END MOBILE OUTER PADDING FIX v4 \*/\n?',
              '\n', original, flags=re.S
          )

          css='\n'.join([
              '',
              '/* MOBILE OUTER PADDING FIX v4 */',
              'body.page-id-2983 .l-content{padding-left:0!important;padding-right:0!important;max-width:none!important}',
              'body.page-id-2983 .l-mainContent,body.page-id-2983 .l-mainContent__inner,body.page-id-2983 .post_content{width:100%!important;max-width:none!important;margin-left:0!important;margin-right:0!important;padding-left:0!important;padding-right:0!important}',
              'body.page-id-2983 .post_content>.tq4,body.page-id-2983 .post_content>.wp-block-group.tq4,body.page-id-2983 .alignfull.tq4{width:100%!important;max-width:100%!important;margin-left:0!important;margin-right:0!important;left:auto!important;right:auto!important;transform:none!important}',
              'body.page-id-2983 .tq4>.alignfull,body.page-id-2983 .tq4>.wp-block-cover.alignfull,body.page-id-2983 .tq4>.wp-block-group.alignfull{width:100%!important;max-width:100%!important;margin-left:0!important;margin-right:0!important}',
              '/* END MOBILE OUTER PADDING FIX v4 */',
              '',
          ])
          content=content.replace('</style>',css+'</style>',1)

          latest=get_page()
          latest_content=raw_content(latest)
          if latest.get('status') != original_status:
              raise SystemExit('BLOCKED_STATUS_CHANGED_DURING_RUN')
          if hashlib.sha256(latest_content.encode()).hexdigest() != hashlib.sha256(original.encode()).hexdigest():
              raise SystemExit('BLOCKED_PAGE_CHANGED_DURING_RUN')

          payload=json.dumps({'content':content},ensure_ascii=False).encode('utf-8')
          req=urllib.request.Request(f'https://tsurikue.com/wp-json/wp/v2/pages/{PAGE_ID}',data=payload,headers=headers,method='POST')
          with urllib.request.urlopen(req,timeout=45) as r:
              json.loads(r.read().decode())

          after=get_page()
          after_content=raw_content(after)
          if after.get('status') != original_status:
              raise SystemExit('VERIFY_STATUS_CHANGED')
          if after_content.count(FIX_TAG) != 1:
              raise SystemExit('VERIFY_FIX_NOT_UNIQUE')
          if MARKER not in after_content or HERO_URL not in after_content:
              raise SystemExit('VERIFY_CONTENT_GUARDS_MISSING')

          pathlib.Path('experimental-pages/top-design-lab/content.html').write_text(after_content,encoding='utf-8')
          cfg_path=pathlib.Path('experimental-pages/top-design-lab/config.json')
          cfg=json.loads(cfg_path.read_text(encoding='utf-8'))
          cfg['expected_current_content_sha256']=hashlib.sha256(after_content.encode()).hexdigest()
          cfg_path.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('SUCCESS_PATCH_V4')
          print('status='+str(after.get('status')))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Verify 390px viewport is filled
        shell: bash
        run: |
          cat > measure.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('https://tsurikue.com/?v4check=1',{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(1200);
            const m=await page.evaluate(()=>{
              const rect=s=>{const e=document.querySelector(s);if(!e)return null;const r=e.getBoundingClientRect();return {left:+r.left.toFixed(2),right:+r.right.toFixed(2),width:+r.width.toFixed(2),paddingLeft:getComputedStyle(e).paddingLeft,paddingRight:getComputedStyle(e).paddingRight}};
              return {innerWidth:innerWidth,lContent:rect('.l-content'),post:rect('.post_content'),tq4:rect('.tq4'),party:rect('.tq4-party'),hero:rect('.tq4-hero')};
            });
            console.log('VERIFY_LAYOUT='+JSON.stringify(m));
            const ok=m.innerWidth===390 && m.lContent && m.tq4 && Math.abs(m.lContent.left)<=0.5 && Math.abs(m.lContent.right-390)<=0.5 && Math.abs(m.tq4.left)<=0.5 && Math.abs(m.tq4.right-390)<=0.5 && m.lContent.paddingLeft==='0px' && m.lContent.paddingRight==='0px';
            if(!ok){throw new Error('VERIFY_FULL_WIDTH_FAILED '+JSON.stringify(m));}
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node measure.js

      - name: Commit synchronized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experimental-pages/top-design-lab/content.html experimental-pages/top-design-lab/config.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove SWELL outer padding on top page'
          git push origin HEAD:main
