name: Publish car current v3 no-wobble
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-car-current-v3-no-wobble-20260902.yml']
permissions:
  contents: read
  issues: write
jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Patch preview draft for stable viewport width
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee car-no-wobble-preview-audit.json
          import base64,hashlib,json,os,urllib.request
          BASE='https://tsurikue.com/wp-json/wp/v2'
          PREVIEW=3350; LIVE=3294
          tok=base64.b64encode(f"{os.environ['TSURIKUE_WP_USER']}:{os.environ['TSURIKUE_WP_APP_PASSWORD']}".encode()).decode()
          H={'Authorization':'Basic '+tok,'Accept':'application/json','Content-Type':'application/json; charset=utf-8','User-Agent':'tsurikue-car-no-wobble/1.0'}
          def req(method,path,data=None):
              body=None if data is None else json.dumps(data,ensure_ascii=False).encode()
              r=urllib.request.Request(BASE+path,data=body,headers=H,method=method)
              with urllib.request.urlopen(r,timeout=50) as x:return json.loads(x.read().decode())
          def raw(p): return ((p.get('content') or {}).get('raw') or '')
          def sha(s): return hashlib.sha256(s.encode()).hexdigest()
          p=req('GET',f'/pages/{PREVIEW}?context=edit&_fields=id,slug,status,title,content')
          if (p['slug'],p['status'])!=('car-guide-v2-preview','draft'): raise SystemExit('PREVIEW_IDENTITY_FAILED')
          s=raw(p)
          if 'tsurikue-category-hub:v3:car-current-improved' not in s: raise SystemExit('MARKER_MISSING')
          required=['海まで走る。山へ行く。','目的もなく、ちょっと遠回りする。','休日の遊べる範囲はけっこう広がる。','1万km以上いっしょに走ったレクサスUXを中心に']
          if not all(x in s for x in required): raise SystemExit('LATEST_HERO_COPY_MISSING')
          old='width:100vw;margin-left:calc(50% - 50vw);background:#fff'
          new='width:100%;max-width:100%;margin-left:0;background:#fff'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('EXPECTED_WIDTH_RULE_NOT_FOUND')
          editor_rule='.editor-styles-wrapper .tq-car-current-v3,.block-editor-block-list__layout .tq-car-current-v3{width:100%!important;max-width:100%!important;margin-left:0!important;overflow-x:hidden!important}'
          anchor='body:has(.tq-car-current-v3){overflow-x:clip}'
          if editor_rule not in s:
              if anchor not in s: raise SystemExit('EDITOR_RULE_ANCHOR_MISSING')
              s=s.replace(anchor,anchor+'\n'+editor_rule,1)
          if 'width:100vw' in s or 'calc(50% - 50vw)' in s: raise SystemExit('VIEWPORT_HACK_STILL_PRESENT')
          req('POST',f'/pages/{PREVIEW}',{'content':s,'status':'draft'})
          p2=req('GET',f'/pages/{PREVIEW}?context=edit&_fields=id,slug,status,content')
          s2=raw(p2)
          checks={
            'draft':p2['status']=='draft','marker':s2.count('tsurikue-category-hub:v3:car-current-improved')==1,
            'no_100vw':'width:100vw' not in s2,'no_negative_vw':'calc(50% - 50vw)' not in s2,
            'stable_width':'width:100%;max-width:100%;margin-left:0;background:#fff' in s2,
            'editor_guard':editor_rule in s2,'hero_copy':all(x in s2 for x in required),'no_fj':'ランドクルーザーFJ' not in s2,
            'four_details':s2.count('<!-- wp:details ')==4,'four_picks':s2.count('class="tq-pick"')==4
          }
          if not all(checks.values()): raise SystemExit('PREVIEW_VERIFY_FAILED '+json.dumps(checks,ensure_ascii=False))
          print(json.dumps({'ok':True,'page_id':PREVIEW,'sha':sha(s2),'checks':checks},ensure_ascii=False))
          PY

      - name: Install Japanese font and Selenium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          python -m pip install --disable-pip-version-check selenium

      - name: Verify preview PC and mobile
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python category-hubs/car-current-v3/verify_render.py | tee car-no-wobble-preview-render.json

      - name: Publish verified preview to current live page
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee car-no-wobble-publish-audit.json
          import base64,hashlib,json,os,pathlib,urllib.request
          BASE='https://tsurikue.com/wp-json/wp/v2'; PREVIEW=3350; LIVE=3294
          EXPECTED_LIVE_SHA='b41eaca8ad5f570e063c12715d1622cbdf7ffee25af8fc0baf93682d6f5c9b02'
          tok=base64.b64encode(f"{os.environ['TSURIKUE_WP_USER']}:{os.environ['TSURIKUE_WP_APP_PASSWORD']}".encode()).decode()
          H={'Authorization':'Basic '+tok,'Accept':'application/json','Content-Type':'application/json; charset=utf-8','User-Agent':'tsurikue-car-publish-no-wobble/1.0'}
          def req(method,path,data=None,with_headers=False):
              body=None if data is None else json.dumps(data,ensure_ascii=False).encode()
              r=urllib.request.Request(BASE+path,data=body,headers=H,method=method)
              with urllib.request.urlopen(r,timeout=50) as x:
                  val=json.loads(x.read().decode()); return (val,dict(x.headers)) if with_headers else val
          def raw(p):return ((p.get('content') or {}).get('raw') or '')
          def sha(s):return hashlib.sha256(s.encode()).hexdigest()
          def count(kind):
              _,h=req('GET',f'/{kind}?status=publish&per_page=1&_fields=id',with_headers=True);return int(h.get('X-WP-Total','0'))
          before={'posts':count('posts'),'pages':count('pages')}
          live=req('GET',f'/pages/{LIVE}?context=edit&_fields=id,slug,status,title,content')
          if (live['slug'],live['status'])!=('car-guide','publish'): raise SystemExit('LIVE_IDENTITY_FAILED')
          live_raw=raw(live); live_sha=sha(live_raw)
          if live_sha!=EXPECTED_LIVE_SHA: raise SystemExit('LIVE_STALE_SOURCE_GUARD '+live_sha)
          preview=req('GET',f'/pages/{PREVIEW}?context=edit&_fields=id,slug,status,content')
          s=raw(preview)
          checks={
            'preview_draft':preview['status']=='draft','marker':'tsurikue-category-hub:v3:car-current-improved' in s,
            'hero':'海まで走る。山へ行く。' in s and '休日の遊べる範囲はけっこう広がる。' in s,
            'no_100vw':'width:100vw' not in s,'no_negative_vw':'calc(50% - 50vw)' not in s,
            'no_fj':'ランドクルーザーFJ' not in s,'four_details':s.count('<!-- wp:details ')==4
          }
          if not all(checks.values()): raise SystemExit('SOURCE_VERIFY_FAILED '+json.dumps(checks,ensure_ascii=False))
          pathlib.Path('car-live-backup.json').write_text(json.dumps({'content':live_raw,'title':live['title']['raw']},ensure_ascii=False),encoding='utf-8')
          req('POST',f'/pages/{LIVE}',{'content':s,'status':'publish'})
          pathlib.Path('car-live-write-done').write_text('1')
          after_live=req('GET',f'/pages/{LIVE}?context=edit&_fields=id,slug,status,title,content')
          after_raw=raw(after_live)
          if after_live['status']!='publish' or 'tsurikue-category-hub:v3:car-current-improved' not in after_raw: raise SystemExit('LIVE_POST_VERIFY_FAILED')
          if 'width:100vw' in after_raw or 'calc(50% - 50vw)' in after_raw: raise SystemExit('LIVE_WOBBLE_RULE_REMAINED')
          after={'posts':count('posts'),'pages':count('pages')}
          if before!=after: raise SystemExit('PUBLIC_COUNTS_CHANGED '+repr((before,after)))
          print(json.dumps({'ok':True,'live_page':LIVE,'status':'publish','old_sha':live_sha,'new_sha':sha(after_raw),'public_before':before,'public_after':after,'checks':checks},ensure_ascii=False))
          PY

      - name: Verify actual live page on PC and mobile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee car-no-wobble-live-render.json
          import json,time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          opts=Options();opts.add_argument('--headless=new');opts.add_argument('--no-sandbox');opts.add_argument('--disable-dev-shm-usage');opts.add_argument('--force-device-scale-factor=1')
          d=webdriver.Chrome(options=opts); checks={};metrics={}
          try:
            for label,w,h in [('desktop',1440,1200),('mobile',390,1000)]:
              d.set_window_size(w,h);d.get('https://tsurikue.com/car-guide/?tqverify=20260902');time.sleep(2)
              root=d.find_element('css selector','.tq-car-current-v3')
              picks=d.find_elements('css selector','.tq-pick')
              details=d.find_elements('css selector','.tq-accordion')
              sw=d.execute_script('return document.documentElement.scrollWidth');cw=d.execute_script('return document.documentElement.clientWidth')
              rw=root.rect['width']
              body=d.find_element('tag name','body').text
              metrics[label]={'scroll_width':sw,'client_width':cw,'root_width':round(rw,1),'picks':len(picks),'details':len(details)}
              checks[label+'_no_overflow']=sw<=cw+10
              checks[label+'_root_full']=rw>=cw-12
              checks[label+'_four_picks']=len(picks)==4
              checks[label+'_four_details']=len(details)==4
              checks[label+'_hero']='海まで走る。山へ行く。' in body and '休日の遊べる範囲はけっこう広がる。' in body
              checks[label+'_no_fj']='ランドクルーザーFJ' not in body
              d.save_screenshot(f'car-no-wobble-live-{label}.png')
          finally:d.quit()
          if not all(checks.values()): raise RuntimeError('LIVE_RENDER_FAILED '+json.dumps({'checks':checks,'metrics':metrics},ensure_ascii=False))
          print(json.dumps({'ok':True,'checks':checks,'metrics':metrics},ensure_ascii=False))
          PY

      - name: Roll back live page if live render verification failed
        if: failure()
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f car-live-write-done ] || [ ! -s car-live-backup.json ]; then
            echo 'No live write to roll back.'
            exit 0
          fi
          python - <<'PY'
          import base64,json,os,urllib.request
          BASE='https://tsurikue.com/wp-json/wp/v2'; LIVE=3294
          b=json.load(open('car-live-backup.json',encoding='utf-8'))
          tok=base64.b64encode(f"{os.environ['TSURIKUE_WP_USER']}:{os.environ['TSURIKUE_WP_APP_PASSWORD']}".encode()).decode()
          H={'Authorization':'Basic '+tok,'Accept':'application/json','Content-Type':'application/json; charset=utf-8','User-Agent':'tsurikue-car-rollback/1.0'}
          data=json.dumps({'content':b['content'],'status':'publish'},ensure_ascii=False).encode()
          r=urllib.request.Request(BASE+f'/pages/{LIVE}',data=data,headers=H,method='POST')
          with urllib.request.urlopen(r,timeout=50) as x: print('ROLLBACK_OK',x.status)
          PY

      - name: Upload audit and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: car-current-v3-no-wobble-publish-audit
          path: |
            car-no-wobble-preview-audit.json
            car-no-wobble-preview-render.json
            car-no-wobble-publish-audit.json
            car-no-wobble-live-render.json
            car-no-wobble-live-desktop.png
            car-no-wobble-live-mobile.png

      - name: Log to Issue 22
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Car current v3 — publish + no-wobble viewport fix'
            for f in car-no-wobble-preview-audit.json car-no-wobble-publish-audit.json car-no-wobble-live-render.json; do
              if [ -s "$f" ]; then echo; echo '```json'; cat "$f"; echo '```'; fi
            done
          } >/tmp/car-no-wobble.md
          gh issue comment 22 --body-file /tmp/car-no-wobble.md
