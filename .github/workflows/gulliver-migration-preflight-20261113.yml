name: Gulliver all-post native count preflight (read-only)
on:
  push:
    branches: [migrate-old-gulliver-tracked-buttons-20261113]
    paths:
      - '.github/workflows/gulliver-migration-preflight-20261113.yml'
      - 'scripts/migrate_all_gulliver_native_counted_20261113.py'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run dry-run replacement plan against live WordPress without changes
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,json,os,sys
          sys.path.insert(0,'scripts')
          from migrate_all_gulliver_native_counted_20261113 import run
          from apply_editorial_draft_once import get_json,post_json,public_counts,SITE_URL
          cfg=json.load(open('editorial/migrate-all-gulliver-counted-20261113/config.json'))
          auth='Basic '+base64.b64encode((os.environ['TSURIKUE_WP_USER']+':'+os.environ['TSURIKUE_WP_APP_PASSWORD']).encode()).decode()
          report=run(cfg,auth,(get_json,post_json,public_counts,SITE_URL),dry_run=True)
          print('DRY_RUN_COMPLETED_ZERO_WRITES',json.dumps(report,ensure_ascii=False))
          PY