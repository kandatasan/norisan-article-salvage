name: UX price checker WordPress exact-target read-only audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/lexus-ux-price-checker/wp_target_audit.php'
      - '.github/workflows/ux-price-wp-target-audit.yml'
  push:
    branches: [main]
    paths:
      - 'ops/lexus-ux-price-checker/wp_target_audit.php'
      - '.github/workflows/ux-price-wp-target-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax only
        run: php -l ops/lexus-ux-price-checker/wp_target_audit.php
  inspect:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      XSERVER_SSH_HOST: ${{ secrets.XSERVER_SSH_HOST }}
      XSERVER_SSH_USER: ${{ secrets.XSERVER_SSH_USER }}
      XSERVER_SSH_PRIVATE_KEY: ${{ secrets.XSERVER_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Xserver SSH identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$XSERVER_SSH_HOST" && test -n "$XSERVER_SSH_USER" && test -n "$XSERVER_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "$XSERVER_SSH_PRIVATE_KEY" > "$HOME/.ssh/xserver_deploy_key"
          chmod 600 "$HOME/.ssh/xserver_deploy_key"
          bash river-fish/xserver-git/verify_host_key.sh
      - name: Read only exact WordPress UX target posts
        shell: bash
        run: |
          set -euo pipefail
          remote="$XSERVER_SSH_USER@$XSERVER_SSH_HOST"
          opts="-p 10022 -i $HOME/.ssh/xserver_deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          temp=".tsurikue-ux-audit-$GITHUB_RUN_ID.php"
          scp -P 10022 -i "$HOME/.ssh/xserver_deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" ops/lexus-ux-price-checker/wp_target_audit.php "$remote:$temp"
          ssh $opts "$remote" bash -s -- "$temp" <<'REMOTE'
          set -euo pipefail
          name="$1"
          [[ "$name" =~ ^\.tsurikue-ux-audit-[0-9]+\.php$ ]] || exit 20
          root="$HOME/tsurikue.com/public_html"
          test -d "$root" && test ! -L "$root" && test -f "$root/wp-config.php"
          test -f "$HOME/$name" && test ! -L "$HOME/$name"
          trap 'rm -f "$HOME/$name"' EXIT
          cd "$root"
          wp eval-file "$HOME/$name" --skip-themes
          echo 'UX_WP_TARGET_READ_ONLY=PASS'
          REMOTE
