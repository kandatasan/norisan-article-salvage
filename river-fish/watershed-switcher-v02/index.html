<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日本の河川大図鑑</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8f9;color:#24373c;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}main{max-width:900px;margin:auto;padding:14px}.hero{padding:22px 16px 12px}.hero h1{font-size:clamp(25px,6vw,36px);line-height:1.3;margin:0}.hero p{color:#5b6d72}.panel{border:1px solid #dce4e6;background:white;border-radius:22px;padding:20px;margin:14px 0}.panel h2{font-size:23px;margin:0 0 10px}.muted{color:#68777d;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.card{display:flex;align-items:center;gap:9px;text-align:left;background:#fff;border:1px solid #dce3e5;border-radius:15px;min-height:66px;padding:14px 12px;font-size:17px;color:#26383e;width:100%;cursor:pointer}.card:focus-visible,.small:focus-visible,input:focus-visible{outline:3px solid #eead4b;outline-offset:2px}.card:hover{background:#f3faf9}.card.selected{background:#e6f4f5;border-color:#4b9fb4;color:#165b76}.waves{color:#2988b8;font-size:23px;line-height:1}.card span:last-child{min-width:0;overflow-wrap:anywhere}.info{background:#f1f3f4;border-radius:18px;padding:18px;margin:12px 0;animation:appear .16s ease-out}.info h3{font-size:23px;margin:0 0 6px}.info .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.small{border:0;border-radius:11px;padding:9px 12px;background:white;color:#244653;font:inherit;cursor:pointer}.small.primary{background:#1b7595;color:white}.crumb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0;color:#4f6e7b;font-size:14px}.crumb button{border:0;background:none;text-decoration:underline;color:#216e8e;font:inherit;padding:5px;cursor:pointer}input{width:100%;font:inherit;padding:12px;border:1px solid #ccd9dc;border-radius:12px}label{display:block;margin:14px 0 5px;font-weight:600}.more{width:100%;border:1px solid #c5dce1;background:#f6fbfc;border-radius:13px;padding:13px;font:inherit;color:#185b73;cursor:pointer}.hidden{display:none!important}.notice{border-left:3px solid #9cb6be;padding-left:12px;color:#5b6c72;font-size:14px}.counter{font-size:14px;color:#63777c}.divider{border:0;border-top:1px solid #e1e8e9;margin:17px 0}@keyframes appear{from{opacity:.4;transform:translateY(-5px)}to{opacity:1;transform:none}}@media(max-width:420px){main{padding:8px}.panel{padding:15px 12px}.grid{gap:8px}.card{padding:12px 9px;font-size:16px;min-height:64px}.info{padding:15px}.hero{padding:20px 11px 8px}}@media(prefers-reduced-motion:reduce){.info{animation:none}}
</style></head><body><main id="river-atlas">
<div class="hero"><h1>日本の河川大図鑑</h1><p>水系を選ぶと、そこに登録された川がズラーッと並びます。気になる川をタップして探検しよう。</p></div>
<section class="panel" id="step1"><h2>🌊 水系を選ぶ</h2><p class="muted">都道府県との正確な対応は調査中。まずは全国の水系から探せます。</p><label for="wsSearch">水系名で絞り込む（任意）</label><input id="wsSearch" type="search" placeholder="例：太田川、利根川"><p id="wsCount" class="counter"></p><div id="wsCards" class="grid"></div><button id="wsMore" class="more hidden" type="button">もっと水系を見る</button></section>
<section class="panel hidden" id="step2"><nav id="crumb" class="crumb" aria-label="現在地"></nav><h2 id="wsTitle"></h2><div id="wsInfo" class="info"></div><h2>この水系の川</h2><p id="riverCount" class="counter"></p><label for="riverSearch">川の名前で絞り込む（任意）</label><input id="riverSearch" type="search" placeholder="川の名前・河川コード"><div id="riverCards" class="grid"></div><button id="riverMore" class="more hidden" type="button">もっと川を見る</button><section id="riverInfo" class="info hidden" aria-live="polite"></section></section>
<p class="notice">国土交通省の河川・水系コード表をもとに表示しています。所在地、直接の合流関係、生物の生息をコードだけから推定していません。水系未照合19件は除外しています。</p>
</main><script src="data.js"></script><script>
(function(){"use strict";
const root=document.getElementById("river-atlas"),$=id=>root.querySelector("#"+id),data=window.RIVER_ATLAS;
if(!data||!Array.isArray(data.watersheds)){root.textContent="河川データを読み込めませんでした。";return}
const systems=data.watersheds;let active=null,river=null,wsLimit=40,riverLimit=40;
const node=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e};
const wipe=e=>e.replaceChildren();const visible=(id,yes)=>$(id).classList.toggle("hidden",!yes);
const focusSection=id=>$(id).scrollIntoView({behavior:"smooth",block:"start"});
function systemCards(){const q=$("wsSearch").value.trim(),hits=systems.filter(w=>w[1].includes(q)||w[0].includes(q));wipe($("wsCards"));$("wsCount").textContent=hits.length.toLocaleString("ja-JP")+" 水系";for(const w of hits.slice(0,wsLimit)){const b=node("button","","card"+(active&&active[0]===w[0]?" selected":""));b.type="button";b.append(node("span","≋","waves"),node("span",w[1]+"水系"));b.onclick=()=>selectSystem(w);$("wsCards").append(b)}visible("wsMore",hits.length>wsLimit);if(!hits.length)$("wsCards").append(node("p","該当する水系はありません"))}
function crumb(){const c=$("crumb");wipe(c);const top=node("button","水系一覧");top.onclick=()=>focusSection("step1");c.append(top,node("span","›"),node("span",active[1]+"水系"));if(river)c.append(node("span","›"),node("span",river[1]))}
function selectSystem(w){active=w;river=null;riverLimit=40;$("riverSearch").value="";$("wsTitle").textContent=w[1]+"水系";const box=$("wsInfo");wipe(box);box.append(node("h3",w[1]+"水系"),node("p","水系コード："+w[0]),node("p","登録河川コード："+w[2].length+"件"));const actions=node("div","","actions");const biota=node("button","🐟 生物調査記録（準備中）","small");biota.disabled=true;actions.append(biota);box.append(actions);visible("riverInfo",false);visible("step2",true);crumb();systemCards();riverCards();focusSection("step2")}
function riverCards(){if(!active)return;const q=$("riverSearch").value.trim(),hits=active[2].filter(r=>r[1].includes(q)||r[0].includes(q));$("riverCount").textContent=hits.length+" / "+active[2].length+" 河川コード";wipe($("riverCards"));for(const r of hits.slice(0,riverLimit)){const b=node("button","","card"+(river&&river[0]===r[0]?" selected":""));b.type="button";b.append(node("span","≋","waves"),node("span",r[1]));b.onclick=()=>selectRiver(r);$("riverCards").append(b)}visible("riverMore",hits.length>riverLimit);if(!hits.length)$("riverCards").append(node("p","該当する川はありません"))}
function selectRiver(r){river=r;const box=$("riverInfo");wipe(box);box.append(node("h3",r[1]),node("p","河川コード："+r[0]),node("p","所属水系："+active[1]+"水系（"+active[0]+"）"),node("p","所在地・合流先：確認済み情報の追加待ち","muted"));const actions=node("div","","actions");const back=node("button","← 別の川を選ぶ","small");back.onclick=()=>{river=null;visible("riverInfo",false);crumb();riverCards();focusSection("step2")};const biota=node("button","🐟 この川の生物記録（準備中）","small");biota.disabled=true;actions.append(back,biota);box.append(actions,node("p","水系全体の生物記録を、この川で確認された生物として表示することはありません。","notice"));visible("riverInfo",true);crumb();riverCards();box.scrollIntoView({behavior:"smooth",block:"nearest"})}
$("wsSearch").addEventListener("input",()=>{wsLimit=40;systemCards()});$("riverSearch").addEventListener("input",()=>{riverLimit=40;riverCards()});$("wsMore").onclick=()=>{wsLimit+=40;systemCards()};$("riverMore").onclick=()=>{riverLimit+=40;riverCards()};systemCards();
})();
</script></body></html>
