name: Audit spindle grille carwash draft once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_spindle_carwash_draft_once.py'
      - '.github/workflows/audit-spindle-carwash-draft-once.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Syntax check
        run: python -m py_compile scripts/audit_spindle_carwash_draft_once.py
      - name: Read-only WordPress audit
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/audit_spindle_carwash_draft_once.py
      - name: Record audit on issue 22
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file reports/spindle-carwash-audit/summary.md
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spindle-carwash-draft-audit
          path: reports/spindle-carwash-audit/
          if-no-files-found: warn
