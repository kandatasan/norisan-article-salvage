name: Fix outing accordion category reference once
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_outing_accordion_category_reference_once.py'
      - '.github/workflows/fix-outing-accordion-category-reference-once.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --disable-pip-version-check selenium
      - run: python -m py_compile scripts/fix_outing_accordion_category_reference_once.py
      - name: Fix accordion source and verify final outing top
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          set -o pipefail
          python scripts/fix_outing_accordion_category_reference_once.py | tee /tmp/outing-complete.json
      - name: Record success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Outing hero + accordions: COMPLETE'
            echo
            echo '全幅ヒーローと5アコーディオンの公開実データ参照がすべて一致しました。'
            echo
            echo '```json'
            cat /tmp/outing-complete.json
            echo '```'
          } > /tmp/comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outing-hero-accordion-complete-audit
          path: /tmp/outing-complete.json
          if-no-files-found: warn
