name: Inspect tsurikue header and mobile menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-tsurikue-header-menu-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Inspect inline state
        shell: bash
        run: |
          cat > inspect.js <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('https://tsurikue.com/?headerinspect=4',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(1400);
            const snap=async(label)=>{
              const d=await page.evaluate(()=>{
                const one=s=>{const e=document.querySelector(s);if(!e)return null;return {cls:e.className,style:e.getAttribute('style'),data:[...e.attributes].filter(a=>a.name.startsWith('data-')).reduce((o,a)=>(o[a.name]=a.value,o),{})}};
                return {spMenu:one('#sp_menu'),inner:one('#sp_menu .p-spMenu__inner'),overlay:one('#sp_menu .p-spMenu__overlay'),headerBtn:one('.l-header__menuBtn .-menuBtn')};
              });
              console.log(label+'='+JSON.stringify(d));
            };
            await snap('INLINE_CLOSED');
            await page.locator('.l-header__menuBtn .-menuBtn').first().click({force:true,timeout:3000,noWaitAfter:true});
            await page.waitForTimeout(700);
            await snap('INLINE_OPEN');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node inspect.js
