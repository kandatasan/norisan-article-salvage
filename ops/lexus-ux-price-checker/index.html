<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>レクサスUXの中古車相場価格｜つりくえ！</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#21333e;background:#fff;font-size:14px}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:auto;padding:8px}.ux{border:1px solid #d9e1e5;border-radius:13px;padding:15px;background:#fff}.ux h1{font-size:17px;margin:0 0 12px;line-height:1.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field.full{grid-column:span 2}.field label{display:block;font-size:11px;font-weight:700;color:#465c67;margin-bottom:4px}.field select{width:100%;font-size:13px;height:41px;border-radius:7px;border:1px solid #ccd8de;background:#fff;padding:0 9px;color:#21333e;text-overflow:ellipsis}.field select:focus-visible{outline:3px solid #8bb7d3;outline-offset:2px}.result{margin:13px 0 0;background:#f4f7f8;padding:11px 12px;border-radius:9px}.kicker{color:#56717f;font-size:11px;font-weight:700;margin:0}.amount{font-size:24px;line-height:1.4;letter-spacing:-.04em;font-weight:850;margin:2px 0}.sample-label{font-size:10.5px;color:#45606f;margin:2px 0 1px;font-weight:650}.meta{font-size:11px;line-height:1.6;color:#60747f;margin:0}.reference{margin:8px 2px 0;color:#647782;font-size:10.5px;line-height:1.55}.reference strong{color:#455d69}.marketrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;align-items:center;padding:9px 0 8px;border-bottom:1px solid #dde5e9}.marketrow:last-of-type{border:0}.markethead{font-size:12px;font-weight:800;align-self:end}.markethead .sub{font-size:10px;color:#687c86;font-weight:500}.marketprice{font-size:18px;font-weight:850;letter-spacing:-.03em;white-space:nowrap;text-align:right;line-height:1.35}.marketnote{grid-column:1/-1;text-align:right;font-size:10.5px;color:#60747f;margin:2px 0 0}.result .meta{margin:7px 0 0;font-size:10.5px}.marketprice.is-empty{font-size:13px;color:#657681;font-weight:600;letter-spacing:0}@media(max-width:340px){.ux{padding:12px}.grid{gap:6px}.field select{font-size:12px;padding-left:5px}.amount{font-size:21px}}
</style>
</head>
<body>
<main><section class="ux" aria-label="レクサスUX中古車の相場目安">
<h1>レクサスUX 中古相場チェックツール</h1>
<p class="meta" style="margin:-5px 0 10px">※価格は参考程度です。</p>
<div class="grid">
  <div class="field full"><label for="grade">グレード</label><select id="grade"></select></div>
  <div class="field"><label for="year">年式</label><select id="year"></select></div>
  <div class="field"><label for="km">走行距離</label><select id="km"></select></div>
</div>
<div class="result" id="result" role="status" aria-live="polite">
  <p class="kicker">参考価格（支払総額）</p>
  <div class="marketrow">
    <div class="markethead">一般中古車</div>
    <div class="marketprice" id="general-price">集計中</div>
    <p class="marketnote" id="general-note">参考価格を調査しています</p>
  </div>
  <div class="marketrow">
    <div class="markethead">レクサスCPO <span class="sub">認定中古車</span></div>
    <div class="marketprice" id="cpo-price">集計中</div>
    <p class="marketnote" id="cpo-note">参考価格を調査しています</p>
  </div>
  <p class="meta" id="meta">該当条件の掲載価格を調査しています。</p>
</div>

</section></main>
<script>
(()=>{'use strict';
const models=[
 ['200','UX200',2018,[['base','標準仕様',2018],['c','version C',2018],['fs','F SPORT',2018],['l','version L',2018],['blue','Blue Edition',2020],['urban','Urban Elegance',2020],['style-blue','F SPORT Style Blue',2021],['emotional','F SPORT Emotional Explorer',2022],['graceful','Graceful Explorer',2022]]],
 ['250h','UX250h',2018,[['base','標準仕様',2018],['c','version C',2018],['fs','F SPORT',2018],['l','version L',2018],['brown','Brown Edition',2020],['urban','Urban Elegance',2020],['style-blue','F SPORT Style Blue',2021],['elegant','Elegant Black',2021],['emotional','F SPORT Emotional Explorer',2022],['graceful','Graceful Explorer',2022]]],
 ['300h','UX300h',2024,[['base','標準仕様',2024],['c','version C',2024],['fs','F SPORT',2024],['l','version L',2024],['emotional','F SPORT Emotional Explorer',2024],['graceful','Graceful Explorer',2024],['shining','Shining Essence',2026]]],
 ['300e','UX300e',2020,[['c','version C',2020],['l','version L',2020]]]
];
const $=id=>document.getElementById(id),g=$('grade'),y=$('year'),k=$('km');
let bands=[];let latest='';
for(const [model,name,,grades] of models){const optgroup=document.createElement('optgroup');optgroup.label=name;for(const [id,caption] of grades){const o=document.createElement('option');o.value=model+':'+id;o.textContent=name+' '+caption;optgroup.append(o)}g.append(optgroup)}
const option=(select,value,label)=>{const o=document.createElement('option');o.value=value;o.textContent=label;select.append(o)};
option(y,'any','指定なし');for(let yr=2026;yr>=2018;yr--)option(y,String(yr),yr+'年');
option(k,'any','指定なし');for(let i=0;i<10;i++)option(k,String(i*10000),`${i}万〜${i+1}万km未満`);option(k,'100000','10万km以上');
const params=new URLSearchParams(location.search);const pModel=params.get('model')||'250h',pGrade=params.get('grade')||'c';
if([...g.options].some(o=>o.value===pModel+':'+pGrade))g.value=pModel+':'+pGrade;else g.value='250h:c';
for(const [el,name] of [[y,'year'],[k,'mileage']]){const v=params.get(name);if(v&&[...el.options].some(o=>o.value===v))el.value=v}
if(!params.has('year'))y.value='2021';
function syncYears(){const [model,id]=g.value.split(':');const start=models.find(m=>m[0]===model)?.[3].find(z=>z[0]===id)?.[2]||2018;const endYear=({200:2023,'250h':2023,'300h':2026,'300e':2026})[model]||2026;[...y.options].forEach(o=>{o.disabled=o.value!=='any'&&(+o.value<start||+o.value>endYear)});if(y.selectedOptions[0]?.disabled)y.value='any'}
// Only show preview figures on local test host. URL flags do not bypass publication review on the public site.
const isLocalTest=['localhost','127.0.0.1'].includes(location.hostname);
let sourceLabel='';let sampleDate='';let isPreview=false;
function fmt(n){return Math.round(n).toLocaleString('ja-JP')}
function matchingBand(model,grade,yr,mileage,segment){
  const targetYear=yr==='any'?null:Number(yr);
  const targetMileage=mileage==='any'?null:Number(mileage);
  const candidates=bands.filter(b=>{
    if(b.market_segment!==segment||b.model!==model) return false;
    // Only exact grade matches can produce a price.
    if(b.grade==='all'||b.grade!==grade) return false;
    if(b.mileage_start_km!=='any'&&b.mileage_start_km!==targetMileage) return false;
    const [minYear,maxYear]=b.observed_years;
    if(targetYear===null) return b.year==='any';
    if(b.year!=='any') return b.year===targetYear;
    // Grade must match; multi-year fallback is allowed only within that grade.
    return minYear<=targetYear && targetYear<=maxYear && maxYear-minYear<=4;
  });
  // Exact year and grade take priority. If unavailable, prefer the narrowest time span.
  const score=b=>(b.year!=='any'?100:0)+(b.grade===grade?10:0)+(b.mileage_start_km!=='any'?2:0)-5*(b.observed_years[1]-b.observed_years[0]);
  candidates.sort((a,b)=>score(b)-score(a) || b.sample_size-a.sample_size);
  return candidates[0];
}
function render(){
  syncYears();
  const [model,grade]=g.value.split(':'),yr=y.value,mileage=k.value;
  const general=matchingBand(model,grade,yr,mileage,'general_market');
  const cpo=matchingBand(model,grade,yr,mileage,'lexus_cpo');
  function showMarket(b,priceId,noteId){
    const price=$(priceId),note=$(noteId);
    if(!b){
      price.textContent='集計中';
      price.classList.add('is-empty');
      note.textContent='このグレード・年式の掲載例が不足しています';
      return;
    }
    price.classList.remove('is-empty');
    price.textContent=`${fmt(b.lower_man)}万〜${fmt(b.upper_man)}万円`;
    const caveats=[];
    const years=b.observed_years;
    if(years[1]>years[0])caveats.push(`複数年式の参考値（${years[0]}〜${years[1]}年）`);
    else if(yr==='any')caveats.push(`${years[0]}年式の参考値`);
    if(mileage!=='any'&&b.mileage_start_km==='any')caveats.push('走行距離未反映');
    note.textContent=`中央値約${fmt(b.median_man)}万円・${b.sample_size}件`+(caveats.length?'／'+caveats.join('・'):'');
  }
  showMarket(general,'general-price','general-note');
  showMarket(cpo,'cpo-price','cpo-note');
  $('meta').textContent=(general||cpo)?`${isPreview?'調査プレビュー／':''}${sampleDate||'調査日不明'}時点の掲載例`:'条件に合う掲載例を調査中です。';
}
[g,y,k].forEach(el=>el.addEventListener('change',render));syncYears();render();
fetch('./data/reference_price_bands.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('no data');return r.json()}).then(data=>{
  const date=new Date(data.updated_at+'T00:00:00+09:00'),age=(Date.now()-date.getTime())/86400000;
  const approved=data.publication_reviewed===true&&data.research_preview_only===false&&data.limited_sample_release===true;
  const allowed=approved||(isLocalTest&&new URLSearchParams(location.search).get('preview')==='1');
  if(!allowed || data.price_basis!=='total' || data.market_segment!=='segmented_general_and_cpo' || !Array.isArray(data.markets_included) || !data.markets_included.includes('general_market') || !data.markets_included.includes('lexus_cpo') || !Number.isFinite(age) || age<0 || age>60) return;
  sourceLabel=data.source_label;
  sampleDate=data.updated_at;
  isPreview=!approved;
  bands=(Array.isArray(data.cohorts)?data.cohorts:[]).filter(b=>
    models.some(m=>m[0]===b.model&&m[3].some(x=>x[0]===b.grade)) &&
    ((b.year==='any')||(Number.isInteger(b.year)&&b.year>=2018&&b.year<=2026)) &&
    (b.mileage_start_km==='any'||(Number.isInteger(b.mileage_start_km)&&b.mileage_start_km>=0&&b.mileage_start_km%10000===0)) &&
    Number.isInteger(b.sample_size)&&b.sample_size>=5 &&
    Array.isArray(b.observed_years)&&b.observed_years.length===2&&b.observed_years.every(Number.isInteger)&&b.observed_years[0]<=b.observed_years[1]&&
    [b.lower_man,b.median_man,b.upper_man].every(v=>Number.isFinite(v)&&v>0) &&
    b.lower_man<=b.median_man && b.median_man<=b.upper_man &&
    ['general_market','lexus_cpo'].includes(b.market_segment) && Array.isArray(b.observed_years)&&b.observed_years.length===2);
  render();
}).catch(()=>render());

})();
</script>
</body></html>
