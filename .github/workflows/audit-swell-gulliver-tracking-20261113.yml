name: Audit SWELL tracked buttons and legacy Gulliver (read only)
on:
  push:
    branches: [migrate-old-gulliver-tracked-buttons-20261113]
    paths: [.github/workflows/audit-swell-gulliver-tracking-20261113.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Inspect live WP block representations, old Gulliver placement and count settings
        env:
          WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          WP_PASS: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,html,json,os,re,urllib.request
          base='https://tsurikue.com/wp-json/wp/v2'
          auth='Basic '+base64.b64encode((os.environ['WP_USER']+':'+os.environ['WP_PASS']).encode()).decode()
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':auth,'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=45) as f:return json.load(f)
          posts=get('/posts?context=edit&status=publish&per_page=100&page=1&_fields=id,slug,title,content,categories')
          posts+=get('/posts?context=edit&status=publish&per_page=100&page=2&_fields=id,slug,title,content,categories')
          button_re=re.compile(r'<!-- wp:loos/button(?: (\{.*?\}))? -->[\s\S]*?<!-- /wp:loos/button -->')
          samples=0
          old_items=[]
          for p in posts:
              body=p['content']['raw'];old=[(int(i),m.start()) for m in re.finditer(r'\[blog_parts id="(2843|4172)"\]',body) for i in [m.group(1)]]
              for m in button_re.finditer(body):
                  attr=m.group(1) or '{}'
                  if any(k.lower() in attr.lower() for k in ('count','measure','click','btnid','btnid','dataid')) or 'data-id' in m.group(0):
                      print('TRACKED_SWELL_BUTTON',p['id'],p['slug'],'ATTR',attr[:850],'HTML',repr(m.group(0)[:1050]),flush=True)
                      samples+=1
                      if samples>=12:break
              if old:
                  chunks=[]
                  for n,(part,offset) in enumerate(old):
                      heading_before=list(re.finditer(r'<!-- wp:heading\b.*?</h[234]>\s*<!-- /wp:heading -->',body[:offset],re.S))
                      last=heading_before[-1].group(0) if heading_before else ''
                      last=html.unescape(re.sub('<[^>]+>',' ',last)).strip()
                      chunks.append({'part':part,'offset':offset,'nearest_heading':last[-85:],'near':re.sub(r'\s+',' ',html.unescape(re.sub('<[^>]+>',' ',body[max(0,offset-320):offset+390])))[:580]})
                  old_items.append((p['id'],p['slug'],chunks))
          print('TRACKED_SAMPLE_COUNT',samples)
          for pid,slug,chunks in old_items:print('OLD_AD_ARTICLE',pid,slug,json.dumps(chunks,ensure_ascii=False),flush=True)
          PY