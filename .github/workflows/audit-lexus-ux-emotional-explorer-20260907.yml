name: Audit lexus-ux-emotional-explorer funnel once

on:
  push:
    branches: [main]
    paths:
      - scripts/audit_lexus_ux_emotional_explorer_funnel_20260907.py
      - .github/workflows/audit-lexus-ux-emotional-explorer-20260907.yml

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit and comment
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile scripts/audit_lexus_ux_emotional_explorer_funnel_20260907.py
          python scripts/audit_lexus_ux_emotional_explorer_funnel_20260907.py > /tmp/audit.md
          cat /tmp/audit.md
          gh issue comment 413 --repo "${{ github.repository }}" --body-file /tmp/audit.md
