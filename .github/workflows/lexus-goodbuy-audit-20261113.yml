name: Lexus goodbuy source audit (read-only)
on:
  push:
    branches: [lexus-goodbuy-light-20261113]
    paths: ['.github/workflows/lexus-goodbuy-audit-20261113.yml', 'scripts/lexus_goodbuy_light_20261113.py']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read post content and verify proposed light-touch edits
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,html,json,os,re,sys,urllib.parse,urllib.request
          auth="Basic "+base64.b64encode((os.environ['TSURIKUE_WP_USER']+":"+os.environ['TSURIKUE_WP_APP_PASSWORD']).encode()).decode()
          req=urllib.request.Request("https://tsurikue.com/wp-json/wp/v2/posts?context=edit&slug=goodbuy&_fields=id,slug,status,title,content,featured_media,categories,author,date,modified",headers={"Authorization":auth})
          with urllib.request.urlopen(req,timeout=35) as f: rows=json.load(f)
          if len(rows)!=1:raise RuntimeError(f'Expected single goodbuy post, got {len(rows)}')
          post=rows[0];body=post['content']['raw']
          print('POST_META',json.dumps({k:post[k] for k in ['id','slug','status','featured_media','categories','author','date','modified']},ensure_ascii=False))
          print('TITLE',post['title']['raw'])
          print('BODY_SHA',hashlib.sha256(body.encode()).hexdigest(),'CHARS',len(body))
          print('BLOCK_COUNTS',{k:body.count('<!-- wp:'+k) for k in ['paragraph','heading','list','image','shortcode','table','embed']})
          pattern=re.compile(r'<!-- wp:(paragraph|heading|table|list|image|shortcode|html|quote)(?: [^\n]*?)? -->(.*?)<!-- /wp:\1 -->',re.S)
          for i,m in enumerate(pattern.finditer(body)):
              inner=m.group(2)
              text=html.unescape(re.sub(r'<[^>]*>','',inner))
              text=re.sub(r'\s+',' ',text).strip()
              print('BLOCK',i,m.group(1),repr(text[:1300]),'chars',len(text))
          print('SHORTCODES',re.findall(r'\[blog_parts id="\d+"\]',body))
          print('LINK_URLS',re.findall(r'href="([^"]+)"',body))
          try:
              sys.path.insert(0,'scripts')
              from lexus_goodbuy_light_20261113 import transform
          except ImportError:
              print('PREFLIGHT_WAITING_FOR_SCRIPT')
          else:
              new=transform(body)
              print('PREFLIGHT_SUCCESS',hashlib.sha256(new.encode()).hexdigest(),'chars',len(new))
          PY