name: UX review live editorial read-only audit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ux-koukai-readonly-editorial-audit.yml'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect published UX owner review paragraphs and media without modifying WordPress
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os, base64, json, urllib.request, urllib.parse, re, html, hashlib
          user=os.environ["TSURIKUE_WP_USER"];password=os.environ["TSURIKUE_WP_APP_PASSWORD"]
          auth="Basic "+base64.b64encode((user+":"+password).encode()).decode()
          q=urllib.parse.urlencode({"context":"edit","_fields":"id,slug,status,title,content"})
          url="https://tsurikue.com/wp-json/wp/v2/posts/2517?"+q
          req=urllib.request.Request(url,headers={"Authorization":auth,"Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=60) as response:post=json.load(response)
          assert (post["id"],post["slug"],post["status"])==(2517,"ux-koukai","publish")
          body=post["content"]["raw"]
          print("ARTICLE_SHA",hashlib.sha256(body.encode()).hexdigest(),"LENGTH",len(body),flush=True)
          pat=re.compile(r'<h[23]\b[^>]*>.*?</h[23]>|<p\b[^>]*>.*?</p>|<img\b[^>]*>',re.I|re.S)
          from html.parser import HTMLParser
          class Cleaner(HTMLParser):
           def __init__(self):
            super().__init__();self.parts=[]
           def handle_data(self,d):self.parts.append(d)
           def handle_starttag(self,t,a):
            if t=="br":self.parts.append(" / ")
          def strip(s):
           p=Cleaner();p.feed(s)
           return " ".join(html.unescape("".join(p.parts)).split())
          for i,m in enumerate(pat.finditer(body)):
           raw=m.group()
           if raw.lower().startswith("<img"):
            alt=re.search(r'alt="([^"]*)"',raw)
            cls=re.search(r'wp-image-\d+',raw)
            print("IMG",i,cls.group() if cls else "no-image-id",html.unescape(alt.group(1)) if alt else "",flush=True)
           else:
            label="H" if re.match(r'<h[23]',raw) else "P"
            txt=strip(raw)
            if txt:print(label,i,txt[:750],flush=True)
          print("INTERNAL_EDITOR_MARKERS",re.findall(r'tsurikue-internal-links:[^ <]*',body),flush=True)
          print("BAD_ALT_NIYODO", "雪の残る道を走るレクサスUX" in body,flush=True)
          print("SWELL_PARTS",re.findall(r'\[blog_parts id="(\d+)"\]',body),flush=True)
          print("PUBLIC_LINKS",[url for url in re.findall(r'href="([^"]+)"',body) if not url.startswith("#")][:35],flush=True)
          
          PY
