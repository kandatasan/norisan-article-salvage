name: Patch Kochi trip new photos 20260903

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_kochi_trip_new_photos_once.py'
      - '.github/workflows/patch-kochi-trip-new-photos-20260903.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  patch-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Syntax check
        run: python -m py_compile scripts/patch_kochi_trip_new_photos_once.py
      - name: Patch guarded WordPress draft
        env:
          TSURIKUE_WP_USER: ${{ secrets.TSURIKUE_WP_USER }}
          TSURIKUE_WP_APP_PASSWORD: ${{ secrets.TSURIKUE_WP_APP_PASSWORD }}
        run: python scripts/patch_kochi_trip_new_photos_once.py
      - name: Record result on salvage audit issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Kochi new-photo patch: SUCCESS'
            echo
            cat reports/kochi-photo-patch-20260903/summary.md
          } > /tmp/kochi-photo-patch-comment.md
          gh issue comment 22 --repo "$GITHUB_REPOSITORY" --body-file /tmp/kochi-photo-patch-comment.md
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kochi-photo-patch-20260903
          path: reports/kochi-photo-patch-20260903/
          if-no-files-found: warn
